<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<script>
/* Zeigt Fehler direkt auf dem Bildschirm an (es gibt auf dem iPad keine Konsole) */
window.addEventListener('error', function (e) {
  var d = document.getElementById('fehler');
  if (!d) { d = document.createElement('pre'); d.id = 'fehler'; (document.body || document.documentElement).appendChild(d);
    d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;margin:0;padding:10px;background:#b00020;color:#fff;font:15px/1.3 monospace;z-index:999;white-space:pre-wrap'; }
  var t = e.target, msg;
  if (t && t !== window && (t.src || t.href)) msg = 'Datei nicht gefunden: ' + (t.src || t.href);
  else msg = 'Fehler: ' + e.message + (e.filename ? '  (' + e.filename.split('/').slice(-2).join('/') + ', Zeile ' + e.lineno + ')' : '');
  d.textContent += msg + '\n';
}, true);
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bauernhof">
<link rel="manifest" href="../../../manifest.json">
<link rel="apple-touch-icon" href="../../../icon.png">
<link rel="stylesheet" href="../../../gemeinsam/basis.css?v=20261120a">
<title>Dach</title>
</head>
<body>
<canvas id="game"></canvas>
<div id="dhud" class="hud gamehud hidden">
  <div class="pill" data-say="roof" style="pointer-events:auto"><span class="word">DACH</span> <span id="dcount">0/6</span></div>
  <button class="pill btn" id="pausebtn" aria-label="Pause"><i class="ico" data-ico="pause"></i></button>
</div>
<div id="gpause" class="overlay hidden">
  <div class="row">
    <button class="home" data-home aria-label="Zur Baustelle"><i class="ico" data-ico="home"></i></button>
    <button class="big" id="gresume" aria-label="Weiter"><svg width="70" height="70" viewBox="0 0 10 10"><path d="M2 1 L9 5 L2 9 Z" fill="#5a3d00"/></svg></button>
  </div>
  <button class="mute" aria-label="Ton"><i class="ico" data-ico="sound"></i></button>
</div>
<div id="gwin" class="overlay hidden">
  <div class="stars"></div>
  <div class="row">
    <div class="pill gain" data-say="star" style="cursor:pointer">+<span id="wingain">3</span> <i class="ico" data-ico="star"></i></div>
    <div class="pill gain" id="winword" style="cursor:pointer"><span class="word"></span></div>
  </div>
  <button class="home" data-home aria-label="Zur Baustelle"><i class="ico" data-ico="home"></i></button>
</div>
<script>window.NO_PAD = true;   // hier wird gezogen und getippt</script>
<script src="../../../gemeinsam/sterne.js?v=20261120a"></script>
<script src="../../../gemeinsam/basis.js?v=20261120a"></script>
<script src="../../../gemeinsam/bau.js?v=20261120a"></script>
<script>
window.HOF_URL = '../../index.html';                 // „Hof“ ist hier der Bauhof
const save = Hof.save;
const house = () => { if (!save.house || typeof save.house !== 'object') save.house = { step: 0 }; return save.house; };
let winTimer = null;
// Bauschritt fertig: Fortschritt speichern, Sterne, Jubel, zurück zum Bauhof
function finishStep(step, key, back) {
  Hof.load(); house().step = Math.max(house().step, step); save.stars += BAU_STARS_STEP; Hof.persist();
  setTimeout(() => {
    document.querySelectorAll('.gamehud').forEach(el => el.classList.add('hidden'));
    $('wingain').textContent = BAU_STARS_STEP;
    const row = $('gwin').querySelector('.stars'); row.innerHTML = '<i class="ico" data-ico="star"></i>'.repeat(BAU_STARS_STEP); applyIcons(row);
    $('winword').dataset.say = key; $('winword').querySelector('.word').textContent = WORDS[key][0];
    show('gwin'); sfx.win(); confetti();
    setTimeout(() => sayWord(key), 1400);
    winTimer = setTimeout(() => goHof(back), 4200);
  }, 400);
}
</script>
<script>
/* =====================================================================
   MINISPIEL: DACH DECKEN (Baustelle, Wohnhaus Schritt 5) – von schräg oben wie der Hof
   Mit dem Finger über die leuchtende Reihe wischen → Ziegel werden gelegt. Reihe für Reihe von vorne
   bis hinten. Danach wird verputzt, Fenster, Tür und Schornstein kommen: Haus fertig (house.step = 5).
   ===================================================================== */
document.querySelectorAll('[data-home]').forEach(b => b.addEventListener('click', () => goHof('dach')));

// Gleiche Lage des Hauses in Kran und Dach: Raster wie beim Baggern/Beton (scharfe Pixel, Hof-Maßstab)
function siteGeo(withCrane) {
  const hw = Math.min(6, gc - (withCrane ? 6 : 4)) * G, hh = Math.min(4, gr - 4) * G;
  const hx = Math.round((gc * G - hw) / 2) - (withCrane ? G : 0), hy = Math.max(G, Math.round(((gr - 1) * G - hh) / 2));
  return { hx, hy, hw, hh };
}
function paintGround(g) {
  for (let r = 0; r < gr; r++) for (let c = 0; c < gc; c++) {
    const set = r === gr - 1 ? tiles.road : bauTiles.gravel;
    for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) bctx.drawImage(pick(set), c*G+i*T, r*G+j*T);
  }
  const B = (col,x,y,w,h)=>{bctx.fillStyle=col;bctx.fillRect(x,y,w,h);};
  // Bauzaun um den Bauplatz
  const x0 = g.hx - 14, y0 = g.hy - 14, w = g.hw + 28, h = g.hh + 26;
  for (let x = x0; x <= x0 + w; x += 9) { B('#d35400', x, y0 - 2, 2, 7); }
  for (let y = y0; y <= y0 + h; y += 9) { B('#d35400', x0, y, 2, 6); B('#d35400', x0 + w, y, 2, 6); }
  B('#ffffff', x0, y0, w + 2, 2); B('#ffffff', x0, y0, 2, h); B('#ffffff', x0 + w, y0, 2, h);
}

const Dach = (() => {
  let g, geo, state, roof, row, down = false, fin = null, pops = [], paused = false;
  function enter() {
    Hof.load();
    if (house().step !== 4) { goHof('dach'); return; }
    layout(true);
    g = siteGeo(false); geo = houseGeo(g.hx, g.hy, g.hw, g.hh);
    paintGround(g);
    roof = Array.from({ length: ROOF_ROWS }, () => Array(ROOF_COLS).fill(false)); row = 0; fin = null; pops = [];
    state = 'play'; show('dhud'); hud();
    setTimeout(() => sayWord('roof'), 400);
  }
  $('pausebtn').addEventListener('click', () => { if (state !== 'play') return; paused = true; down = false; show('gpause'); });
  $('gresume').addEventListener('click', () => { hide('gpause'); paused = false; });
  function hud() { $('dcount').textContent = row + '/' + ROOF_ROWS; }
  function lay(x, y) {
    if (row >= ROOF_ROWS) return;
    const [ry, rh] = geo.row(row);
    if (y < ry - 8 || y > ry + rh + 8) return;
    for (let c = 0; c < ROOF_COLS; c++) {
      const [rx, rw] = geo.col(c);
      if (!roof[row][c] && x > rx - 4 && x < rx + rw + 4) {
        roof[row][c] = true; pops.push({ r: row, c, t: 0 }); sfx.click();
        spawn(rx + rw / 2, ry + rh / 2, rnd(-15, 15), rnd(-25, -5), .3, '#e06a5a', 40);
      }
    }
    if (roof[row].every(Boolean)) { row++; hud(); sfx.load(); if (row >= ROOF_ROWS) finishRoof(); }
  }
  function finishRoof() {
    state = 'done'; down = false; fin = 0; hide('dhud');
    setTimeout(() => { sfx.unlock(); sayWord('house'); confetti(); }, 700);
    setTimeout(() => finishStep(5, 'house', 'dach'), 2400);
  }
  function onPointer(type, x, y) {
    if (state !== 'play' || paused) return true;
    if (type === 'down') { down = true; lay(x, y); }
    else if (type === 'move' && down) lay(x, y);
    else if (type === 'up') down = false;
    return true;
  }
  function update(dt) { if (fin !== null) fin += dt; for (const p of pops) p.t += dt; pops = pops.filter(p => p.t < 0.2); }
  function draw(time) {
    ctx.drawImage(bg, 0, 0);
    drawHouseTop(snapF(R, 2), g.hx, g.hy, g.hw, g.hh, { step: 4, roof, done: fin !== null && fin > 0.5, time });
    if (state === 'play' && row < ROOF_ROWS) {
      const [ry, rh] = geo.row(row), on = Math.abs(Math.sin(time / 260)) > .5;
      for (let c = 0; c < ROOF_COLS; c++) if (!roof[row][c]) { const [rx, rw] = geo.col(c); R(on ? 'rgba(255,210,63,.75)' : 'rgba(255,210,63,.4)', rx, ry, rw, rh); }
      if (!down) {                                   // Hinweis: Finger wischt an der Reihe entlang
        const k = (time / 1500) % 1, x = geo.roof.x + Math.round(geo.roof.w * k), y = ry + Math.round(rh / 2);
        R('rgba(0,0,0,.35)', x - 3, y - 2, 7, 6); R('#ffffff', x - 2, y - 3, 5, 5);
      }
    }
    for (const p of pops) { const [ry, rh] = geo.row(p.r), [rx, rw] = geo.col(p.c); R('rgba(255,255,255,.7)', rx, ry, rw, rh); }
    if (fin !== null && fin < 0.6) R(`rgba(255,255,255,${(0.6 - fin).toFixed(2)})`, g.hx, g.hy, g.hw, g.hh);
  }
  function resize() { layout(false); }
  function exit() { clearTimeout(winTimer); }
  return { enter, update, draw, resize, exit, onPointer, _dbg: () => ({ state, row, rows: Array.from({ length: ROOF_ROWS }, (_, i) => geo.row(i)), cols: Array.from({ length: ROOF_COLS }, (_, c) => geo.col(c)) }) };
})();
startLoop(Dach);
addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
</script>
</body>
</html>
