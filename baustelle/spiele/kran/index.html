<script>
/* Zeigt Fehler direkt auf dem Bildschirm an (es gibt auf dem iPad keine Konsole) */
window.addEventListener('error', function (e) {
  var d = document.getElementById('fehler');
  if (!d) { d = document.createElement('pre'); d.id = 'fehler'; (document.body || document.documentElement).appendChild(d);
    d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;margin:0;padding:10px;background:#b00020;color:#fff;font:15px/1.3 monospace;z-index:999;white-space:pre-wrap'; }
  var t = e.target, msg;
  if (t && t !== window && (t.src || t.href)) msg = 'Datei nicht gefunden: ' + (t.src || t.href);
  else msg = 'Fehler: ' + e.message + (e.filename ? '  (' + e.filename.split('/').slice(-2).join('/') + ', Zeile ' + e.lineno + ')' : '');
  d.textContent += msg + '\n';
}, true);
</script>

<body>
<canvas id="game"></canvas>
<div id="khud" class="hud gamehud hidden">
  <div class="pill" data-say="truss" style="pointer-events:auto"><span class="word">DACHSTUHL</span> <span id="kcount">0/3</span></div>
  <button class="pill btn" id="pausebtn" aria-label="Pause"><i class="ico" data-ico="pause"></i></button>
</div>
<div id="gpause" class="overlay hidden">
  <div class="row">
    <button class="home" data-home aria-label="Zur Baustelle"><i class="ico" data-ico="home"></i></button>
    <button class="big" id="gresume" aria-label="Weiter"><svg width="70" height="70" viewBox="0 0 10 10"><path d="M2 1 L9 5 L2 9 Z" fill="#5a3d00"/></svg></button>
  </div>
  <button class="mute" aria-label="Ton"><i class="ico" data-ico="sound"></i></button>
</div>
<div id="gwin" class="overlay hidden">
  <div class="stars"></div>
  <div class="row">
    <div class="pill gain" data-say="star" style="cursor:pointer">+<span id="wingain">3</span> <i class="ico" data-ico="star"></i></div>
    <div class="pill gain" id="winword" style="cursor:pointer"><span class="word"></span></div>
  </div>
  <button class="home" data-home aria-label="Zur Baustelle"><i class="ico" data-ico="home"></i></button>
</div>
<script>window.NO_PAD = true;   // hier wird gezogen und getippt</script>
<script src="../../../gemeinsam/sterne.js?v=20261125j"></script>
<script src="../../../gemeinsam/basis.js?v=20261125j"></script>

<script>
window.HOF_URL = '../../index.html';                 // „Hof“ ist hier der Bauhof
const save = Hof.save;
const house = () => { if (!save.house || typeof save.house !== 'object') save.house = { step: 0 }; return save.house; };
let winTimer = null;
// Bauschritt fertig: Fortschritt speichern, Sterne, Jubel, zurück zum Bauhof
function finishStep(step, key, back) {
  Hof.load(); house().step = Math.max(house().step, step); save.stars += BAU_STARS_STEP; Hof.persist();
  setTimeout(() => {
    document.querySelectorAll('.gamehud').forEach(el => el.classList.add('hidden'));
    $('wingain').textContent = BAU_STARS_STEP;
    const row = $('gwin').querySelector('.stars'); row.innerHTML = '<i class="ico" data-ico="star"></i>'.repeat(BAU_STARS_STEP); applyIcons(row);
    $('winword').dataset.say = key; $('winword').querySelector('.word').textContent = WORDS[key][0];
    show('gwin'); sfx.win(); confetti();
    setTimeout(() => sayWord(key), 1400);
    winTimer = setTimeout(() => goHof(back), 4200);
  }, 400);
}
</script>
<script>
/* =====================================================================
   MINISPIEL: DACHSTUHL MIT DEM AUTOKRAN (Baustelle, Wohnhaus Schritt 4) – schräg von oben wie der Hof
   Binder auf dem Tieflader antippen oder den Ausleger über den Tieflader ziehen → der Haken geht runter und hebt ihn an.
   Ein Tieflader bringt höchstens 3 Binder; ist er leer, fährt er (vorwärts) nach rechts weg und ein neuer kommt von links. Mit dem Finger ziehen: Ausleger schwenkt hin und her,
   die Last schwebt mit (Schatten am Boden zeigt, wo sie landet). Über der leuchtenden Stelle loslassen → sie wird abgesetzt.
   Nur antippen geht auch (Binder, dann leuchtende Stelle). Kleines Haus 3 Binder, großes Haus 6. Dann RICHTFEST (house.step = 4).
   Holzhaus (L-Form): 4 Binder auf die Blockwände, 2 quer über den linken Flügel, 2 längs über den rechten (woodRoofGeo in bau.js).
   ===================================================================== */
document.querySelectorAll('[data-home]').forEach(b => b.addEventListener('click', () => goHof('kran')));

// Gleiche Lage des Hauses in Kran und Dach: Raster wie beim Baggern/Beton (scharfe Pixel, Hof-Maßstab)
function siteGeo(withCrane) {
  const hw = Math.min(6, gc - (withCrane ? 6 : 4)) * G, hh = Math.min(4, gr - 4) * G;
  const hx = Math.round((gc * G - hw) / 2) - (withCrane ? G : 0), hy = Math.max(G, Math.round(((gr - 1) * G - hh) / 2));
  return { hx, hy, hw, hh };
}
function paintGround(g) {
  for (let r = 0; r < gr; r++) for (let c = 0; c < gc; c++) {
    const set = r === gr - 1 ? tiles.road : bauTiles.gravel;
    for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) bctx.drawImage(pick(set), c*G+i*T, r*G+j*T);
  }
  const B = (col,x,y,w,h)=>{bctx.fillStyle=col;bctx.fillRect(x,y,w,h);};
  // Bauzaun um den Bauplatz
  const x0 = g.hx - 14, y0 = g.hy - 14, w = g.hw + 28 + 3 * G, h = g.hh + 26;   // Platz für den Autokran rechts
  for (let x = x0; x <= x0 + w; x += 9) { B('#d35400', x, y0 - 2, 2, 7); }
  for (let y = y0; y <= y0 + h; y += 9) { B('#d35400', x0, y, 2, 6); B('#d35400', x0 + w, y, 2, 6); }
  B('#ffffff', x0, y0, w + 2, 2); B('#ffffff', x0, y0, 2, h); B('#ffffff', x0 + w, y0, 2, h);
}

const Q = snapF(R, 2);                                // grobe Pixel wie auf dem Hof
const Kran = (() => {
  let g, geo, N, crane, truck, hook, carry, queue, fest, paused = false, placed, follow, idle = 0, wood = null, slots = [], delivered = 0, finger = null;
  const PER_TRUCK = 3;                                // so viele Binder bringt ein Tieflader; danach kommt ein neuer
  const RH = 8, LT = 10;                              // Holzhaus: Bohlen wie beim Bohlen-Legen
  const TIP = 50;                                     // Höhe der Auslegerspitze (so viel weiter oben gezeichnet)
  const liftH = lh => Math.round(4 + lh * 22);        // Höhe der Last über dem Boden
  const beamLen = () => slots[Math.min(placed, N - 1)].len;
  function enter() {
    Hof.load();
    if (house().step !== 3) { goHof('kran'); return; }
    layout(true);
    g = siteGeo(true); geo = houseGeo(g.hx, g.hy, g.hw, g.hh); N = geo.nT;
    // Zielstellen der Binder: Mitte, Länge, Winkel (quer = PI/2) und Leuchtfläche
    if (houseType().shape === 'L') {
      g.hy += 8; wood = logGeo(g.hx, g.hy, g.hw, g.hh, 26);
      slots = woodRoofGeo(wood, logWallUp(LOG_ROWS, RH, LT), LT >> 1).trusses; N = slots.length;
    } else {
      wood = null;
      slots = Array.from({ length: N }, (_, i) => ({ x: geo.beam(i), y: g.hy + Math.round(geo.rz / 2), len: geo.rz + 3, ang: Math.PI / 2 }));
    }
    const up = wood ? logWallUp(LOG_ROWS, RH, LT) : 0;
    paintGround({ hx: g.hx, hw: g.hw, hy: g.hy - up, hh: g.hh + up });   // Holzhaus: Zaun so weit oben, wie die Wände hoch sind
    crane = { x: g.hx + g.hw + Math.round(1.7 * G), y: g.hy + 14 };
    const park = g.hx + Math.round(g.hw / 2) - 28;
    delivered = Math.min(PER_TRUCK, N);
    truck = { x: park, park, y: Math.min((gr - 1) * G + 3, gr * G - 20), load: delivered, state: 'park' };
    hook = { x: crane.x - 30, y: crane.y + 30, lh: 1, vx: 0 };
    placed = 0; carry = null; queue = []; fest = null; follow = null; idle = 0;
    show('khud'); hud();
    setTimeout(() => sayWord('crane'), 400);
  }
  $('pausebtn').addEventListener('click', () => { if (fest !== null) return; paused = true; show('gpause'); });
  $('gresume').addEventListener('click', () => { hide('gpause'); paused = false; });
  function hud() { $('kcount').textContent = placed + '/' + N; }
  const pickPt = () => [truck.x + 22, truck.y + FLATBED_SLOTS[Math.max(0, truck.load - 1)] + 1];
  const slotPt = () => { const s = slots[Math.min(placed, N - 1)]; return [s.x, s.y]; };
  const busy = () => queue.length > 0;
  function to(x, y, lh, then) { queue.push({ x, y, lh, then }); }
  function fetch() {
    const [x, y] = pickPt(); sfx.click(); follow = null;
    to(x, y, 1); to(x, y, 0, () => { carry = { ang: 0 }; truck.load--; sfx.clod(); });
    to(x, y, 1, () => {
      if (truck.load <= 0) { truck.state = 'leave'; sfx.honk(); }   // leer: Tieflader fährt weg (und ein neuer kommt, falls noch Binder fehlen)
      if (finger) follow = { x: finger.x, y: finger.y, sx: finger.x, sy: finger.y };   // Finger noch drauf: gleich weiterziehen
    });
  }
  function place() {
    const [x, y] = slotPt(); follow = null;
    to(x, y, 1); to(x, y, 0, () => {
      carry = null; placed++; hud(); sfx.load();
      for (let k = 0; k < 10; k++) spawn(x + rnd(-6, 6), y + rnd(-8, 8), rnd(-20, 20), rnd(-20, 5), .5, '#e8c27a', 30);
    });
    to(x, y, 1, () => { if (placed >= N) richtfest(); });
  }
  function richtfest() {
    fest = 0; hide('khud');
    to(crane.x - 30, crane.y + 30, 1);
    setTimeout(() => { sfx.unlock(); confetti(); sayWord('richtfest'); }, 900);
    setTimeout(() => finishStep(4, 'richtfest', 'kran'), 2800);
  }
  const onTruck = (x, y) => truck.state === 'park' && truck.load > 0 && x > truck.x - 8 && x < truck.x + 64 && y > truck.y - 10 && y < truck.y + 26;
  const nearSlot = (x, y, r) => { const s = slots[placed]; if (!s) return false;
    const hx = s.ang ? r : s.len / 2 + r, hy = s.ang ? s.len / 2 + r : r; return Math.abs(x - s.x) < hx && Math.abs(y - s.y) < hy; };
  function onPointer(type, x, y) {
    if (paused || fest !== null) return true;
    idle = 0;
    if (type === 'down' || type === 'move') finger = { x, y }; else if (type === 'up') finger = null;
    if (type === 'down') {
      if (busy()) return true;
      if (!carry && onTruck(x, y)) { fetch(); return true; }
      if (carry && nearSlot(x, y, 10)) { place(); sfx.click(); return true; }
      follow = { x, y, sx: x, sy: y };              // ziehen: Haken folgt dem Finger
      return true;
    }
    if (type === 'move' && follow) { follow.x = x; follow.y = y; return true; }
    if (type === 'up' && follow) {
      const f = follow; follow = null;
      if (carry && nearSlot(hook.x, hook.y, 26)) place();               // über der Stelle losgelassen
      else if (!carry && Math.hypot(f.x - f.sx, f.y - f.sy) < 8 && nearSlot(x, y, 14)) { fetch(); queue.push({ thenPlace: true }); }   // gleich die Stelle angetippt: holen und hinbringen
    }
    return true;
  }
  function update(dt) {
    if (paused || !hook) return;
    idle += dt;
    if (carry) carry.k = approach(carry.k || 0, hook.lh > 0.5 ? 1 : 0, 2.4 * dt);
    if (carry) carry.ang = approach(carry.ang, hook.lh > 0.5 ? slots[Math.min(placed, N - 1)].ang : 0, 2.4 * dt);   // angehoben: Binder dreht sich passend zur Stelle
    const ox = hook.x;
    const q = queue[0];
    if (q && q.thenPlace) { queue.shift(); place(); }
    else if (q) {
      const d = Math.hypot(q.x - hook.x, q.y - hook.y), sp = 170 * dt;
      if (d > sp) { hook.x += (q.x - hook.x) / d * sp; hook.y += (q.y - hook.y) / d * sp; }
      else { hook.x = q.x; hook.y = q.y; hook.lh = approach(hook.lh, q.lh, 2.2 * dt);
        if (hook.lh === q.lh) { queue.shift(); if (q.then) q.then(); } }
    } else if (follow) {
      const d = Math.hypot(follow.x - hook.x, follow.y - hook.y), sp = 260 * dt;
      if (d > sp) { hook.x += (follow.x - hook.x) / d * sp; hook.y += (follow.y - hook.y) / d * sp; } else { hook.x = follow.x; hook.y = follow.y; }
      hook.x = clamp(hook.x, 8, W - 8); hook.y = clamp(hook.y, 30, H - 8);
      if (!carry && onTruck(hook.x, hook.y)) fetch();   // Ausleger über den Tieflader gezogen: Haken geht automatisch runter und nimmt den Binder
    }
    // Tieflader: leer → fährt nach rechts weg, neuer kommt von links mit den nächsten Bindern
    if (truck.state === 'leave') { truck.x += 120 * dt; if (truck.x > W + 10) { if (delivered >= N) { truck.state = 'gone'; truck.x = -200; } else { truck.load = Math.min(PER_TRUCK, N - delivered); delivered += truck.load; truck.x = -70; truck.state = 'arrive'; } } }   // Fahrerhaus vorne rechts: vorwärts nach rechts weg, neuer kommt von links
    else if (truck.state === 'arrive') { truck.x = approach(truck.x, truck.park, 110 * dt); if (truck.x === truck.park) { truck.state = 'park'; sfx.honk(); } }
    hook.vx = approach(hook.vx, (hook.x - ox) / Math.max(dt, 1e-3), 600 * dt);
    if (fest !== null) fest += dt;
    setEngine(true, busy() || !!follow, 30);
  }
  function draw(time) {
    if (!truck || !slots.length) return;              // falscher Bauschritt: es geht gleich zurück zur Stadt
    ctx.drawImage(bg, 0, 0);
    drawFlatbedTop(Q, Math.round(truck.x), truck.y, truck.load, Math.min(beamLen(), 44), 3);
    const ho = { trusses: placed, ridge: fest !== null, wreath: fest !== null ? Math.min(1, fest / 1.0) : 0, time };
    if (wood) drawWoodHouse(Q, wood, Object.assign({ rh: RH, lt: LT }, ho)); else drawHouseTop(Q, g.hx, g.hy, g.hw, g.hh, Object.assign({ step: 3 }, ho));
    // leuchtende Zielstelle für den nächsten Binder
    if (placed < N && fest === null) {
      const s = slots[placed], a = Math.abs(Math.sin(time / 260)) > .5, col = carry ? (a ? 'rgba(126,217,87,.9)' : 'rgba(126,217,87,.5)') : (a ? 'rgba(255,210,63,.85)' : 'rgba(255,210,63,.45)');
      if (s.ang) R(col, s.x - 3, s.y - Math.round(s.len / 2), 7, s.len); else R(col, s.x - Math.round(s.len / 2), s.y - 3, s.len, 7);
    }
    // Autokran: Fahrzeug, Last mit Schatten am Boden, Ausleger, Seil
    drawMobileCraneBody(Q, crane.x, crane.y, 1);
    const sway = clamp(-hook.vx * 0.04, -8, 8), lh = liftH(hook.lh);
    const lx = hook.x + sway, ly = hook.y - lh;
    if (carry) {
      const short = Math.min(beamLen(), 44), len = Math.round(short + (beamLen() - short) * carry.k);   // angehoben: Binder in voller Länge
      pixLine(Q, hook.x - Math.cos(carry.ang) * len / 2 + lh / 3, hook.y - Math.sin(carry.ang) * len / 2 + lh / 4, hook.x + Math.cos(carry.ang) * len / 2 + lh / 3, hook.y + Math.sin(carry.ang) * len / 2 + lh / 4, 4, 'rgba(0,0,0,.2)');   // Schatten
      drawBeamTop(Q, lx, ly + 4, len, carry.ang, 0);
    } else Q('rgba(0,0,0,.2)', Math.round(hook.x) - 2, Math.round(hook.y), 5, 3);
    drawMobileCraneBoom(Q, crane.x, crane.y, hook.x, hook.y, TIP);
    drawRope(R, Math.round(hook.x), Math.round(hook.y - TIP), Math.round(lx), Math.round(ly));
    // Hinweise: erst zum Tieflader, dann zur Stelle am Haus (mit Zug-Spur)
    if (fest === null && !busy() && !follow) {
      const b = Math.abs(Math.sin(time / 220)) * 4;
      if (!carry && truck.state === 'park') { const [x, y] = pickPt(); drawArrow(Math.round(x - 3), Math.round(y - 22 - b)); }
      else {
        const s = slots[placed], ay = s.y - (s.ang ? Math.round(s.len / 2) : 0); drawArrow(Math.round(s.x - 3), Math.round(ay - 18 - b));
        if (idle > 2) { const k = (time / 1200) % 1, n = 6; for (let i = 0; i < n; i++) { const u = i / n; if (Math.abs(u - k) < 0.12) R('rgba(255,210,63,.9)', Math.round(hook.x + (s.x - hook.x) * u) - 1, Math.round(hook.y - 20 + (ay - hook.y + 20) * u) - 1, 3, 3); } }
      }
    }
  }
  function resize() { layout(false); }
  function exit() { setEngine(false, false); clearTimeout(winTimer); }
  return { enter, update, draw, resize, exit, onPointer, _dbg: () => ({ placed, N, delivered, truck, g, hook, carry: !!carry, slot: slotPt(), pick: pickPt(), busy: busy() }) };
})();
startLoop(Kran);
addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
</script>
