<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<script>
/* Zeigt Fehler direkt auf dem Bildschirm an (es gibt auf dem iPad keine Konsole) */
window.addEventListener('error', function (e) {
  var d = document.getElementById('fehler');
  if (!d) { d = document.createElement('pre'); d.id = 'fehler'; (document.body || document.documentElement).appendChild(d);
    d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;margin:0;padding:10px;background:#b00020;color:#fff;font:15px/1.3 monospace;z-index:999;white-space:pre-wrap'; }
  var t = e.target, msg;
  if (t && t !== window && (t.src || t.href)) msg = 'Datei nicht gefunden: ' + (t.src || t.href);
  else msg = 'Fehler: ' + e.message + (e.filename ? '  (' + e.filename.split('/').slice(-2).join('/') + ', Zeile ' + e.lineno + ')' : '');
  d.textContent += msg + '\n';
}, true);
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bauernhof">

<title>Kran</title>
</head>
<body>
<canvas id="game"></canvas>
<div id="khud" class="hud gamehud hidden">
  <div class="pill" data-say="truss" style="pointer-events:auto"><span class="word">DACHSTUHL</span> <span id="kcount">0/3</span></div>
  <button class="pill btn" id="pausebtn" aria-label="Pause"><i class="ico" data-ico="pause"></i></button>
</div>
<div id="gpause" class="overlay hidden">
  <div class="row">
    <button class="home" data-home aria-label="Zur Baustelle"><i class="ico" data-ico="home"></i></button>
    <button class="big" id="gresume" aria-label="Weiter"><svg width="70" height="70" viewBox="0 0 10 10"><path d="M2 1 L9 5 L2 9 Z" fill="#5a3d00"/></svg></button>
  </div>
  <button class="mute" aria-label="Ton"><i class="ico" data-ico="sound"></i></button>
</div>
<div id="gwin" class="overlay hidden">
  <div class="stars"></div>
  <div class="row">
    <div class="pill gain" data-say="star" style="cursor:pointer">+<span id="wingain">3</span> <i class="ico" data-ico="star"></i></div>
    <div class="pill gain" id="winword" style="cursor:pointer"><span class="word"></span></div>
  </div>
  <button class="home" data-home aria-label="Zur Baustelle"><i class="ico" data-ico="home"></i></button>
</div>
<script>window.NO_PAD = true;   // hier wird gezogen und getippt</script>
<script src="../../../gemeinsam/sterne.js?v=20261117j"></script>
<script src="../../../gemeinsam/basis.js?v=20261117j"></script>
<script src="../../../gemeinsam/bau.js?v=20261117j"></script>
<script>
window.HOF_URL = '../../index.html';                 // „Hof“ ist hier der Bauhof
const save = Hof.save;
const house = () => { if (!save.house || typeof save.house !== 'object') save.house = { step: 0 }; return save.house; };
let winTimer = null;
// Bauschritt fertig: Fortschritt speichern, Sterne, Jubel, zurück zum Bauhof
function finishStep(step, key, back) {
  Hof.load(); house().step = Math.max(house().step, step); save.stars += BAU_STARS_STEP; Hof.persist();
  setTimeout(() => {
    document.querySelectorAll('.gamehud').forEach(el => el.classList.add('hidden'));
    $('wingain').textContent = BAU_STARS_STEP;
    const row = $('gwin').querySelector('.stars'); row.innerHTML = '<i class="ico" data-ico="star"></i>'.repeat(BAU_STARS_STEP); applyIcons(row);
    $('winword').dataset.say = key; $('winword').querySelector('.word').textContent = WORDS[key][0];
    show('gwin'); sfx.win(); confetti();
    setTimeout(() => sayWord(key), 1400);
    winTimer = setTimeout(() => goHof(back), 4200);
  }, 400);
}
</script>
<script>
/* =====================================================================
   MINISPIEL: DACHSTUHL MIT DEM KRAN (Baustelle, Wohnhaus Schritt 4)
   Einen Dachbinder auf dem Tieflader antippen → der Kran holt ihn. Dann die leuchtende Stelle auf dem
   Haus antippen → der Kran schwenkt hin und setzt ab. 3 Binder, danach RICHTFEST (house.step = 4).
   Hilfe: Wer gleich die leuchtende Stelle antippt, bekommt Holen und Absetzen in einem Rutsch.
   ===================================================================== */
document.querySelectorAll('[data-home]').forEach(b => b.addEventListener('click', () => goHof('kran')));

const Kran = (() => {
  const DW = 200, DH = 140, GROUND = 114, JIB = 8, TOWER = 186, TRUCK = { x: 2, y: GROUND };
  let st, state, placed, trolley, hook, carry, queue, fest, winT = null, glowT = 0, deliverAfter = false;
  function build() {
    st = bauStage(DW, DH, 0.7, (B, x0, x1, y0, y1) => bauSkyGround(B, x0, x1, y0, y1, GROUND));
  }
  function enter() {
    Hof.load();
    if (house().step !== 3) { goHof('kran'); return; }
    build();
    placed = 0; trolley = 40; hook = 20; carry = null; queue = []; fest = null;
    state = 'idle'; show('khud'); hud();
    setTimeout(() => sayWord('crane'), 400);
  }
  $('pausebtn').addEventListener('click', () => { if (state === 'won' || state === 'fest') return; queue.paused = true; show('gpause'); });
  $('gresume').addEventListener('click', () => { hide('gpause'); queue.paused = false; });
  function hud() { $('kcount').textContent = placed + '/3'; }
  // Bewegungs-Schritte des Krans: Laufkatze waagrecht (tx), Haken senkrecht (hy), dann optional etwas tun
  function go(tx, hy, then) { queue.push({ tx, hy, then }); }
  const truckTop = () => [TRUCK.x + 21 + (3 - placed - 1) * 3, TRUCK.y - 18 - (3 - placed - 1) * 4];   // oberster Binder
  const slotApex = () => p34(H34.ax, H34.apex, TRUSS_DEPTH[placed]);
  function fetch() {
    const [tx, ty] = truckTop();
    state = 'busy'; sfx.click();
    go(tx, 20); go(tx, ty, () => { carry = true; sfx.clod(); }); go(tx, 18, () => { state = 'carry'; });
  }
  function deliver() {
    const [ax, ay] = slotApex();
    state = 'busy'; sfx.click();
    go(ax, 18); go(ax, ay, () => {
      carry = null; placed++; hud(); sfx.load(); glowT = 0.5;
      for (let k = 0; k < 10; k++) st.sp(ax + rnd(-20, 20), ay + 20, rnd(-15, 15), rnd(-25, -5), .5, '#e8c27a', 60);
    });
    go(ax, 18, () => { if (placed >= 3) richtfest(); else state = 'idle'; });
  }
  function richtfest() {
    state = 'fest'; fest = 0; hide('khud');
    setTimeout(() => { sfx.unlock(); confetti(); sayWord('richtfest'); }, 900);
    setTimeout(() => { finishStep(4, 'richtfest', 'kran'); }, 2600);
  }
  function onPointer(type, x, y) {
    if (type !== 'down' || queue.paused) return true;
    const [sx, sy] = st.toStage(x, y);
    const onTruck = sx < TRUCK.x + 56 && sy > TRUCK.y - 40 && sy < TRUCK.y + 6;
    const onHouse = sx > H34.x0 - 12 && sx < H34.x1 + H34.dx + 8 && sy > 10 && sy < H34.yb;
    if (state === 'idle') { if (onTruck) fetch(); else if (onHouse) { fetch(); deliverAfter = true; } }
    else if (state === 'carry' && onHouse) deliver();
    return true;
  }
  function update(dt) {
    glowT = Math.max(0, glowT - dt);
    if (fest !== null) { fest += dt; return; }
    if (queue.paused) return;
    const q = queue[0];
    if (!q) { if (state === 'carry' && deliverAfter) { deliverAfter = false; deliver(); } return; }
    trolley = approach(trolley, q.tx, 70 * dt);
    if (trolley === q.tx) hook = approach(hook, q.hy, 60 * dt);
    if (trolley === q.tx && hook === q.hy) { queue.shift(); if (q.then) q.then(); }
  }
  function drawCrane(time) {
    // Turm rechts, Ausleger oben über die ganze Bühne
    R('#7a5a00', TOWER, JIB, 7, GROUND - JIB); R('#f5b700', TOWER + 1, JIB, 5, GROUND - JIB);
    for (let y = JIB + 4; y < GROUND; y += 7) { R('#c48a00', TOWER + 1, y, 5, 1); }
    R('#555', TOWER - 2, GROUND - 4, 11, 4);
    R('#7a5a00', 0, JIB - 3, TOWER + 14, 5); R('#f5b700', 0, JIB - 2, TOWER + 14, 3);
    for (let x = 4; x < TOWER + 10; x += 8) R('#c48a00', x, JIB - 2, 1, 3);
    R('#555', TOWER + 8, JIB - 6, 12, 9); R('#888', TOWER + 9, JIB - 5, 10, 7);                  // Gegengewicht
    R('#c48a00', TOWER - 4, JIB - 13, 14, 10); R('#9fe3ff', TOWER - 2, JIB - 11, 9, 5);          // Führerhaus
    R('#333', trolley - 4, JIB + 1, 8, 3);                                                       // Laufkatze
    R('#333', trolley, JIB + 4, 1, Math.max(0, hook - JIB - 4));
    R('#e0a800', trolley - 2, hook, 5, 3); R('#333', trolley - 1, hook + 3, 3, 2);
    if (carry) {                                                                                  // hängender Binder (Spitze am Haken)
      const sw = state === 'carry' ? Math.sin(time / 400) * 1.5 : 0;
      ctx.save(); ctx.translate(trolley + sw, hook + 4);
      ctx.strokeStyle = '#5a3b1c'; ctx.lineWidth = 3.4; ctx.beginPath(); ctx.moveTo(-35, 26); ctx.lineTo(0, 0); ctx.lineTo(35, 26); ctx.closePath(); ctx.stroke();
      ctx.strokeStyle = '#a0673a'; ctx.lineWidth = 2; ctx.stroke();
      ctx.lineWidth = 1.3; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 26); ctx.stroke();
      ctx.restore();
    }
  }
  function draw(time) {
    ctx.drawImage(bg, 0, 0);
    ctx.setTransform(st.S, 0, 0, st.S, st.OX, st.OY);
    drawFlatbed(TRUCK.x, TRUCK.y, 3 - placed - (carry ? 1 : 0));
    drawHouse34({ trusses: placed, wreath: fest !== null ? Math.min(1, fest / 1.2) : 0, time });
    // leuchtende Zielstelle für den nächsten Binder
    if (placed < 3 && fest === null) {
      const a = 0.35 + Math.abs(Math.sin(time / 260)) * 0.5;
      drawTruss34(TRUSS_DEPTH[placed], state === 'carry' ? '#7ed957' : '#ffd23f', a);
    }
    drawCrane(time);
    // Hinweise: erst zum Tieflader, dann zum Haus
    const b = Math.abs(Math.sin(time / 220)) * 4;
    if (state === 'idle') { const [tx, ty] = truckTop(); drawArrow(Math.round(tx - 3), Math.round(ty - 16 - b)); }
    if (state === 'carry') { const [ax, ay] = slotApex(); drawArrow(Math.round(ax - 3), Math.round(ay + 6 - b)); }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }
  function resize() { build(); }
  function exit() { clearTimeout(winTimer); }
  return { enter, update, draw, resize, exit, onPointer, _dbg: () => ({ state, placed, st: { S: st.S, OX: st.OX, OY: st.OY } }) };
})();
startLoop(Kran);
addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
</script>
</body>
</html>
