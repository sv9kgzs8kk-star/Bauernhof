<script>
/* Zeigt Fehler direkt auf dem Bildschirm an (es gibt auf dem iPad keine Konsole) */
window.addEventListener('error', function (e) {
  var d = document.getElementById('fehler');
  if (!d) { d = document.createElement('pre'); d.id = 'fehler'; (document.body || document.documentElement).appendChild(d);
    d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;margin:0;padding:10px;background:#b00020;color:#fff;font:15px/1.3 monospace;z-index:999;white-space:pre-wrap'; }
  var t = e.target, msg;
  if (t && t !== window && (t.src || t.href)) msg = 'Datei nicht gefunden: ' + (t.src || t.href);
  else msg = 'Fehler: ' + e.message + (e.filename ? '  (' + e.filename.split('/').slice(-2).join('/') + ', Zeile ' + e.lineno + ')' : '');
  d.textContent += msg + '\n';
}, true);
</script>

<script>
// Spiele, die als eigene Seite laufen (Feld, Wiese, Weide)
const PAGES = { w: 'spiele/feld/index.html', m: 'spiele/wiese/index.html', g: 'spiele/schafe/index.html', K: 'spiele/kuehe/index.html',
                a: 'spiele/angeln/index.html', W: 'spiele/wald/index.html', H: 'wohnhaus/index.html?bauernhaus' };
const FOOT_ONLY = ['g', 'K', 'B', 'a', 'W', 'H'];   // H = Haustür Bauernhaus (→ einrichten)   // nur zu Fuß: Weidetor, Melkstand, Scheunentor, Angelsteg, Waldweg
</script>
<script>
/* =====================================================================
   HOF + FELD-SPIELE (Ernten, Grubbern, Säen)
   Minispiele mit eigener Mechanik liegen in spiele/<name>/index.html
   ===================================================================== */
const save = Hof.save, persist = Hof.persist;
const GROW_MS = 15000;                       // so lange wächst die Saat auf dem Hof
const MEADOW_MS = 20000;                     // so lange wächst das Gras nach
const MAX_SHEEP = 6;                         // Herde max. 6
const WOOL_STARS = 2;                        // Sterne pro abgelieferter Wolle
const MILK_STARS = 3;                        // Sterne pro abgelieferter Milch
const WIDE_PRICE = { harvest: 30, cultivate: 20, sow: 20, mow: 20 };   // breite Geräte im Scheunen-Laden
const HINT_AFTER = 12;                       // Sekunden ohne Eingabe, bis ein Hinweis erscheint
// Zurück aus einem Spiel? (#feld, #wiese, #schafe) – dann Startbildschirm überspringen.
// #start = von der Kachel auf der Startseite, #stadt = vom Bauernhof-Platz in der Stadt: ebenfalls ohne ▶.
let backFrom = (location.hash || '').slice(1) || null;
const FROM_OUTSIDE = ['start', 'stadt'];

/* Ohne ▶ gab es auf dieser Seite noch kein Antippen: Das iPad spielt Ton und Vorlesen erst danach.
   Bis dahin wird das letzte Vorlesen gemerkt und beim ersten Antippen (oder Taste) nachgeholt. */
let touched = false, pendingSay = null;
const sayNow = say;
say = function (text) { if (touched) sayNow(text); else pendingSay = text; };
function firstTouch() {
  initAudio();
  if (touched) return;
  touched = true;
  if (pendingSay) { const t = pendingSay; pendingSay = null; sayNow(t); }
}
['pointerup', 'touchend', 'keydown', 'click'].forEach(ev => addEventListener(ev, firstTouch, true));
addEventListener('pointerdown', () => initAudio(), true);

/* ---------- Fahrzeuge & Figuren ---------- */
// Bauer von oben (mit Strohhut), schaut nach rechts
const PERSON = rotateSprite(sprite(20, R => {
  R('#f1c27d',9,0,4,3); R('#f1c27d',9,17,4,3);                 // Hände
  R('#8e2a20',3,2,11,16); R('#c0392b',4,3,9,14); R('#2a5db0',5,5,8,10); R('#3f7be0',6,6,6,8);   // Hemd + Latzhose
  R('#7a5a22',5,4,12,12); R('#e8c25a',6,5,10,10); R('#f6dc8a',7,6,4,3); R('#b8932f',6,10,10,1);  // Strohhut
  R('#e8c25a',16,7,3,6); R('#b8932f',18,7,1,6);                  // Hutkrempe vorne
}));
// Bauer von vorne (für den Knopf)
const FARMER_FRONT = { pal: { y:'#e8c25a', d:'#b8932f', s:'#f1c27d', k:'#222', r:'#c0392b', b:'#2a5db0', o:'#5a3b1c' },
  px: ['...yyyy...','..yyyyyy..','yyddddddyy','..ssssss..','..skssks..','..ssssss..','.rrbbbbrr.','srbbbbbbrs','s.bbbbbb.s','..bbbbbb..','..bb..bb..','.oo....oo.'] };
// Besucherin (holt Wolle ab)
const VISITOR = { pal: { g:'#2e8b57', h:'#7a4a22', s:'#f1c27d', k:'#222', p:'#8e44ad', n:'#2c3e50', o:'#5a3b1c' },
  px: ['..gggg..','.gggggg.','.hsssshh','.hskskh.','..ssss..','.pppppp.','spppppps','s.pppp.s','..pppp..','..n..n..','.oo..oo.'] };
function drawVehicleButtons() {
  for (const [id, spr] of [['vb-tractor', TRACTOR], ['vb-combine', COMBINE]]) {
    const g = $(id).querySelector('canvas').getContext('2d'); g.clearRect(0, 0, 34, 34); g.drawImage(spr.frames[0], 0, 0);
  }
}
drawVehicleButtons();
(() => { const g = $('vb-person').querySelector('canvas').getContext('2d');
  FARMER_FRONT.px.forEach((row, j) => [...row].forEach((ch, i) => { if (ch !== '.') { g.fillStyle = FARMER_FRONT.pal[ch]; g.fillRect(7 + i*2, 5 + j*2, 2, 2); } })); })();

/* =====================================================================
   SZENE: BAUERNHOF
   ===================================================================== */
// T Baum, h Haus, b Scheune, s Silo, = Weg, w Feld, p Schafstall, o Teich,
// g Tor zur Schafweide (→ Schafe hüten), q Kuhweide, a Angelsteg am Teich (→ Angeln), W Waldweg (→ Bäume fällen), m Wiese (→ Heu machen), w Feld (→ Ernten/Grubbern/Säen),
// B Scheunentor (→ Laden), K Melkstand-Tür (→ Kühe melken), k Melkstand, H Haustür Bauernhaus (→ einrichten)
const HUB_MAP = [
  'TT.T...T',
  'Thh.bbsW',
  '.hH.Bbs.',
  '========',
  'ww=.gppp',
  'ww=..ppp',
  'T.=.aooT',
  'T.mmKkkT',
  'T...qqqT',
];
const Hub = (() => {
  let meadowRect, meadowVar = [];
  let type, ox, oy, flock = [], penRect, cowRect, fieldRect, gateRect, signRect, entering = false, started = false, uiOpen = false;
  let doorT = 0, doorDone = -1; const DOOR_WAIT = 0.8;
  let active = 'person', posKey = '', fieldVar = [], idleT = 0, boardT = 0;
  const ENT = {
    person:  { spr: PERSON,  m: null, speed: 2.8 },
    tractor: { spr: TRACTOR, m: null, speed: 2.4, pitch: 58 },
    combine: { spr: COMBINE, m: null, speed: 2.0, pitch: 44 },
  };
  const npc = { phase: 'away', t: rnd(20, 45), x: 0, y: 0, n: 1, path: [], r: 0, c: 0, asked: false, flip: false };
  const cellType = (r, c) => (r < 0 || c < 0 || r >= gr || c >= gc) ? 'X' : type[r][c];
  const visible = name => name !== 'person' || active === 'person';
  function need() {
    const s = save.field.stage;
    return s === 'ripe' ? 'combine' : (s === 'stub' || s === 'tilled') ? 'tractor' : null;
  }
  function occupied(self, r, c) {
    // Zu Fuß kann man an geparkten Fahrzeugen vorbeigehen (sonst sperren sie Wege ab)
    if (self !== 'person') for (const [name, e] of Object.entries(ENT)) if (name !== self && visible(name) && e.m.r === r && e.m.c === c) return true;
    return npc.phase === 'wait' && npc.r === r && npc.c === c;
  }
  const passableFor = name => (r, c) => {
    if (occupied(name, r, c)) return false;
    const t = cellType(r, c);
    if (name === 'person') return t !== 'T' && t !== 'o' && t !== 'X';   // zu Fuß überall hin, nur nicht in Bäume und den Teich (passieren tut nur etwas an Tor, Scheunentor, Melkstand, Steg, Waldweg)
    if (t === 'w') return need() === name;                                  // Fahrzeug: nur wenn es dran ist
    if (t === 'm') return name === 'tractor' && ['tall','mown','baled'].includes(save.meadow.stage);   // Wiese: nur Traktor
    return ['.', '=', 'f'].includes(t);
  };

  function build() {
    layout(true);
    ox = Math.floor((gc - 8) / 2); oy = Math.floor((gr - HUB_MAP.length) / 2);
    const rr = seeded(1234 + gc*97 + gr), pickR = a => a[(rr()*a.length)|0];
    type = [];
    for (let r = 0; r < gr; r++) { type.push([]); for (let c = 0; c < gc; c++) {
      const mr = r - oy, mc = c - ox;
      type[r].push((mr >= 0 && mr < HUB_MAP.length && mc >= 0 && mc < 8) ? HUB_MAP[mr][mc] : (rr() < .15 ? 'T' : (rr() < .2 ? 'f' : '.')));
    }}
    for (let r = 0; r < gr; r++) for (let c = 0; c < gc; c++) {
      const t = type[r][c], set = t === '=' ? tiles.path : tiles.grass;
      for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++)
        bctx.drawImage(t === 'f' && i === j && rr() < .7 ? pickR(flowerTiles) : pickR(set), c*G+i*T, r*G+j*T);
      if (t === 'T') drawObstacle(bctx, 't', c*G, r*G);
    }
    fieldVar = []; for (let i = 0; i < 16; i++) fieldVar.push((rr()*6)|0);
    const B = (col,x,y,w,h)=>{bctx.fillStyle=col;bctx.fillRect(x,y,w,h);};
    const hx = (ox+1)*G, hy = (oy+1)*G;            // Wohnhaus
    B('rgba(0,0,0,.25)',hx+4,hy+8,44,40);
    B('#e9dcc0',hx+3,hy+24,42,22); B('#cdbf9f',hx+3,hy+44,42,2);
    B('#8e1f1f',hx+1,hy+3,46,23); B('#c0392b',hx+2,hy+4,44,20);
    for (let i=0;i<5;i++) B('#a93226',hx+2,hy+7+i*4,44,1);
    B('#7a1a12',hx+2,hy+3,44,1); B('#555',hx+34,hy+1,5,6);
    B('#7a4a22',hx+20,hy+32,8,14); B('#ffcc00',hx+26,hy+39,1,1);
    for (const wx of [7,31]) { B('#5a3b1c',hx+wx,hy+29,10,9); B('#9fe3ff',hx+wx+1,hy+30,8,7); B('#5a3b1c',hx+wx+4,hy+30,1,7); B('#5a3b1c',hx+wx+1,hy+33,8,1); }
    B('#ff6b8a',hx+8,hy+38,2,1); B('#ffd23f',hx+12,hy+38,2,1); B('#ff6b8a',hx+33,hy+38,2,1);
    const bx = (ox+4)*G, by = (oy+1)*G;            // Scheune
    B('rgba(0,0,0,.25)',bx+4,by+8,44,40);
    B('#4a4a4a',bx+1,by+2,46,18); B('#6b6b6b',bx+2,by+3,44,15); B('#7f7f7f',bx+2,by+3,44,2);
    B('#8e1f1f',bx+2,by+18,44,28); B('#b83227',bx+3,by+19,42,26);
    B('#f2f2f2',bx+14,by+24,20,22); B('#b83227',bx+16,by+26,16,20);
    for (let i=0;i<16;i++){ B('#f2f2f2',bx+16+i,by+26+(i*1.25|0),2,2); B('#f2f2f2',bx+30-i,by+26+(i*1.25|0),2,2); }
    B('#f2f2f2',bx+21,by+20,6,3);
    const sx = (ox+6)*G, sy = (oy+1)*G;            // Silo
    B('rgba(0,0,0,.25)',sx+6,sy+8,18,40);
    B('#8a9aa6',sx+3,sy+8,18,38); B('#b8c6d0',sx+5,sy+8,6,38); B('#6f7d88',sx+17,sy+8,4,38);
    for (let i=0;i<5;i++) B('#6f7d88',sx+3,sy+14+i*7,18,1);
    B('#6f7d88',sx+5,sy+2,14,7); B('#9aa8b2',sx+7,sy+1,10,4); B('#c8d4dc',sx+8,sy+2,3,2);
    const px0 = (ox+5)*G, py0 = (oy+4)*G;          // Schafstall (Gehege mit Stroh)
    penRect = { x: px0+6, y: py0+8, w: 3*G-14, h: 2*G-16 };
    for (let j = 0; j < 4; j++) for (let i = 0; i < 6; i++) bctx.drawImage(pickR(tiles.straw), px0 + i*T, py0 + j*T);
    B('#7a1a12',px0+2*G+4,py0+2,G-6,10); B('#b83227',px0+2*G+5,py0+3,G-8,8);   // kleines Stalldach
    const F = '#7a4a22', F2 = '#a0673a';
    B(F2,px0+1,py0+2,3*G-2,2); B(F2,px0+1,py0+2*G-5,3*G-2,2);
    B(F2,px0+1,py0+2,2,2*G-5); B(F2,px0+3*G-3,py0+2,2,2*G-5);
    for (let i=0;i<=6;i++){ B(F,px0+1+i*((3*G-4)/6|0),py0+1,3,4); B(F,px0+1+i*((3*G-4)/6|0),py0+2*G-6,3,4); }
    for (let j=0;j<=3;j++){ B(F,px0,py0+1+j*((2*G-6)/3|0),4,3); B(F,px0+3*G-4,py0+1+j*((2*G-6)/3|0),4,3); }
    const ppx = (ox+5)*G, ppy = (oy+6)*G;          // Teich
    B('#2f6fa8',ppx+2,ppy+2,2*G-4,G-4); B('#3b82c4',ppx+3,ppy+3,2*G-6,G-6);
    B('#7cc0f0',ppx+8,ppy+8,6,1); B('#7cc0f0',ppx+26,ppy+14,7,1); B('#7cc0f0',ppx+17,ppy+17,3,1);
    B('#2e8b3a',ppx+38,ppy+5,5,4); B('#3fa34d',ppx+39,ppy+6,3,2);
    const dx0 = (ox+4)*G, dy0 = (oy+6)*G;          // Angelsteg (führt in den Teich)
    B('#5a3b1c', dx0+4, dy0+6, G+2, 12); B('#a0673a', dx0+5, dy0+7, G, 10);
    for (let i = 0; i < G; i += 5) B('#7a4a22', dx0+5+i, dy0+7, 1, 10);
    B('#5a3b1c', dx0+6, dy0+17, 3, 4); B('#5a3b1c', dx0+G-2, dy0+17, 3, 4);
    B('#6b4423', dx0+8, dy0+1, 2, 8); B('#6b4423', dx0+9, dy0, 8, 1); B('#ffffff', dx0+16, dy0+1, 1, 6); B('#e03b3b', dx0+15, dy0+6, 3, 2);   // Angel am Steg
    const wx0 = (ox+7)*G, wy0 = (oy+1)*G;          // Waldweg mit Schild
    for (let j = 0; j < 4; j++) for (let i = 0; i < 4; i++) bctx.drawImage(pickR(tiles.path), wx0 + i*T/2 + 6, wy0 + j*T/2 + 2, T/2, T/2);
    B('#5a3b1c', wx0+3, wy0+8, 2, 14);
    const gx = (ox+4)*G, gy = (oy+4)*G;            // Tor zur Schafweide
    gateRect = { x: gx, y: gy };
    B('#6fbf4f',gx+1,gy+1,G-2,G-2);
    B('#7a4a22',gx+1,gy+3,3,19); B('#7a4a22',gx+G-4,gy+3,3,19);
    B('#d9c08a',gx+4,gy+8,G-8,2); B('#d9c08a',gx+4,gy+15,G-8,2);
    for (let i=0;i<G-8;i+=4) B('#b89a5c',gx+4+i,gy+8,1,9);
    const kx = (ox+4)*G, ky = (oy+7)*G;            // Melkstand (Tür links)
    B('rgba(0,0,0,.25)',kx+4,ky+4,3*G-2,G-2);
    B('#7a1a12',kx,ky,3*G,8); B('#a93226',kx+1,ky+1,3*G-2,6); B('#c0392b',kx+1,ky+1,3*G-2,2);
    B('#e9dcc0',kx+1,ky+8,3*G-2,G-9); B('#cdbf9f',kx+1,ky+G-2,3*G-2,1);
    B('#5a3b1c',kx+5,ky+9,13,G-10); B('#3a2410',kx+7,ky+11,9,G-12);          // offene Tür
    B('#5a3b1c',kx+G+10,ky+11,14,8); B('#9fe3ff',kx+G+11,ky+12,12,6);       // Fenster
    B('#ffffff',kx+2*G+6,ky+11,12,8); B('#222',kx+2*G+8,ky+13,3,2); B('#222',kx+2*G+14,ky+12,2,3);   // Kuh-Schild
    const qx = (ox+4)*G, qy = (oy+8)*G;            // Kuhweide unter dem Kuhstall
    cowRect = { x: qx+4, y: qy+1, w: 3*G-8, h: 16 };
    B('#5fa83a',qx+1,qy+1,3*G-2,G-2);
    B(F2,qx+1,qy+G-4,3*G-2,2); B(F2,qx+1,qy,2,G-2); B(F2,qx+3*G-3,qy,2,G-2);
    for (let i=0;i<=6;i++) B(F,qx+1+i*((3*G-4)/6|0),qy+G-5,3,4);
    B(F,qx,qy,4,3); B(F,qx+3*G-4,qy,4,3);
    fieldRect = { x: ox*G, y: (oy+4)*G, w: 2*G, h: 2*G };
    meadowRect = { x: (ox+2)*G, y: (oy+7)*G, w: 2*G, h: G };
    meadowVar = []; for (let i = 0; i < 8; i++) meadowVar.push((rr()*6)|0);
    buildFlock();
  }
  function buildFlock() {
    const p = penRect; flock = [];

  /* --- Besucherin, die Wolle abholt --- */

  function drawField() {

    if (npc.phase !== 'away') {
      const bob = npc.phase !== 'wait' && Math.sin(time/90) > 0 ? 1 : 0;
      R('rgba(0,0,0,.2)', npc.x - 7, npc.y + 4, 14, 3);
      drawAnimalPix(VISITOR, npc.x - 8, npc.y - 17 - bob, npc.flip, 0);
    }
    drawMover(ENT[active].m, ENT[active].spr, time);
    if (doorT > 0.1 && active === 'person') {            // Ring füllt sich, bis es hineingeht
      const p = moverPos(ENT.person.m);
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.arc(p.x, p.y - 16, 6, 0, Math.PI*2); ctx.stroke();
      ctx.strokeStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(p.x, p.y - 16, 6, -Math.PI/2, -Math.PI/2 + Math.PI*2*Math.min(1, doorT / DOOR_WAIT)); ctx.stroke();
    }
    // Anzeigen nur, wenn kein Fenster (Laden, Menü, Start) offen ist
    $('hubhud').classList.toggle('hidden', !started || uiOpen || entering);
    const sk = $('startKnopf'); if (sk) sk.style.display = (uiOpen || entering) ? 'none' : '';
    // Sprechblase der Besucherin (als HTML, damit das Wort scharf ist)
    const nb = $('npcbubble');
    if (started && npc.phase === 'wait' && !uiOpen) {
      const r = cvs.getBoundingClientRect();
      nb.style.left = (r.left + npc.x / W * r.width) + 'px'; nb.style.top = (r.top + (npc.y - 20) / H * r.height) + 'px';
      $('npcn').textContent = npc.n;
      if (nb.dataset.say !== npc.item) { nb.dataset.say = npc.item; setIco($('npcico'), npc.item); $('npcword').textContent = WORDS[npc.item][0]; }
      nb.classList.remove('hidden');
    } else nb.classList.add('hidden');
    // Hinweis nach längerem Nichtstun
    const n = need();
    if (started && !entering && !uiOpen && n && idleT > HINT_AFTER) {
      if (n === active) hintBubble(fieldRect.x + fieldRect.w/2, fieldRect.y - 4, ENT[n].spr);
      else { const p = moverPos(ENT[active].m); hintBubble(p.x, p.y - 14, ENT[n].spr); }
    }
  }
  // Fahrzeug antippen = einsteigen (in beiden Steuerungsarten)
  function onPointer(type, x, y, r, c) {
    if (!started || uiOpen || entering) return true;
    idleT = 0;
    if (type === 'down') for (const n of ['tractor', 'combine']) {
      const p = moverPos(ENT[n].m);
      if (n !== active && Math.abs(x - p.x) < G*0.7 && Math.abs(y - p.y) < G*0.7) { setActive(n); return true; }
    }
    // Scheune oder Melkstand angetippt: zur Tür laufen
    const t = cellType(r, c);
    if (active === 'person' && ctlMode === 'tippen' && (t === 'b' || t === 'B')) { setTapGoal(oy+2, ox+4); return true; }
    if (active === 'person' && ctlMode === 'tippen' && (t === 'k' || t === 'K')) { setTapGoal(oy+7, ox+4); return true; }
    if (active === 'person' && ctlMode === 'tippen' && (t === 'h' || t === 'H')) { setTapGoal(oy+2, ox+2); return true; }
    return false;
  }
  function resize() { build(); placeAll(null); }
  function exit() { setEngine(false, false); hide('hubhud'); $('npcbubble').classList.add('hidden'); }
  return { enter, update, draw, exit, resize, onPointer };
})();
