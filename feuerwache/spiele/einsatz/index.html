/* =====================================================================
   FEUERWEHR-EINSATZ (eine Szene je Einsatz, ?e=katze). Kommt aus der Wache, geht danach zurück (#einsatz).
   Das Feuerwehrauto kommt mit Blaulicht angefahren. Unten die Werkzeugleiste: das richtige Werkzeug antippen.
   Falsches Werkzeug = lustige Reaktion („Das passt nicht“), nach zwei Versuchen leuchtet das richtige. Kein Scheitern.
   Das Auto hält, die Tür geht auf, das Kind im Feuerwehranzug steigt aus. Erst dann die Werkzeugleiste (Hinweis spät).
   KATZE IM BAUM (Drehleiter): Leiter wählen → Stützen raus, Kind steigt in den Korb. Korb mit dem Finger steuern (ziehen/tippen).
   Die Katze sitzt erst unten im Baum und klettert höher, sobald der Korb nahe kommt (3 Stellen); ganz oben springt sie in den Korb.
   Korb fährt zurück, das Kind bringt die Katze dem Mädchen.
   MÜLLTONNE BRENNT (?e=muell, Löschfahrzeug): Schlauch wählen → Kind rollt den Schlauch vom Auto zur Spritzstelle. Dann mit dem Finger
   auf das Feuer zielen (halten/ziehen oder tippen): Wasser fliegt im Bogen, jeder Tropfen im Feuer macht es kleiner (fire.hp). Aus → Dampf, „Feuer aus!“,
   der Nachbar bedankt sich. Löschen (Zielen, Tropfen, Treffer) gilt für alle Feuer: `fires` = Liste { x, y (Fuß der Flammen), w, h, hp, dmg }.
   HAUS BRENNT (?e=haus, Löschfahrzeug): Einfamilienhaus mit 2 Etagen, aus 3 Fenstern schlagen Flammen, Rauch über dem Dach. Die Familie (Mama, Kind, Hund)
   steht schon sicher am Gehweg. Jedes Fenster einzeln löschen; gelöschte Fenster sind verrußt. Alle aus → Rauch wird weiß, „Feuer aus!“, die Familie bedankt sich.
   BAUM AUF DER STRASSE (?e=baum, Löschfahrzeug, Kettensäge): Ein umgestürzter Baum liegt auf der unteren Fahrspur, rechts wartet ein Auto.
   3 gelbe Schnittlinien am Stamm: über die Linie wischen (hin und her) oder antippen = sägen (Sägespäne, Brummen); jede Linie durch = Stamm bricht dort.
   Dann die 4 Stücke (3 Stammstücke, Krone) antippen → sie kommen auf die Wiese am Rand (Holzstapel). Straße frei → das Auto fährt vorbei, hupt, „Danke!“.
   BALL AUF DEM DACH (?e=ball, Drehleiter, Leiter): wie die Katze, aber ein Ball liegt auf dem Dach am Schornstein eines Hauses; ein Junge wartet.
   Korb zum Ball steuern → der Ball hüpft in den Korb, Kind bringt ihn dem Jungen. (Katzen-Code wiederverwendet: `cat` = Ball, `drawPet`.)
   AUTOUNFALL (?e=unfall, Löschfahrzeug, Rettungsschere): Ein rotes Auto ist gegen eine Laterne gerollt (Warnblinker, etwas Dampf, keine Verletzten).
   Die Fahrertür klemmt, der Fahrer winkt. Nach der Wahl der Schere leuchten 3 Punkte an der Tür (2 Scharniere, Schloss): Punkt antippen und
   gedrückt halten (oder mehrmals tippen) = Schere schneidet (Hydraulik, Funken). Alle 3 durch → Tür fällt ab, der Fahrer steigt aus und bedankt sich.
   AST AUF AUTO (?e=ast, Löschfahrzeug, Kettensäge, dann Rettungsschere): Ein dicker Ast ist auf ein Auto gefallen, die Fahrerin sitzt eingeklemmt drin.
   2 Schnittlinien sägen (wischen/antippen) → ein Kollege steigt aus → Stück antippen: beide gehen an je ein Ende, heben es an und tragen es
   zum Holzstapel, dann zurück. Danach Schere wählen, 3 Punkte an der Tür → Tür ab, Fahrerin steigt aus → Krankenwagen holt sie ab →
   Abschleppwagen kommt rückwärts von rechts, Kran hebt das Auto auf die Ladefläche, fährt weg → Stern, beide steigen ein, Abfahrt.
   Geschafft: 1 Stern (Hof.addStars), fire.missions + 1. Danach fährt das Auto weg, zurück in die Wache.
   ===================================================================== */

  function setWord(key) { const el = $('iword'); el.dataset.say = key; el.querySelector('.word').textContent = WORDS[key][0]; }
  function enter() {

    Hof.load(); layout(true);
    const short = H < 260; BAR = short ? 46 : 54; RH = short ? G + 10 : 2 * G;   // niedriger Bildschirm: Leiste und Straße schmaler

    const r = Math.round(clamp(Math.min((roadY - 40) * 0.34, (roadY - 76) / 2), 14, 58));   // Katze oben muss ins Bild passen
