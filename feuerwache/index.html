/* Zeigt Fehler direkt auf dem Bildschirm an (es gibt auf dem iPad keine Konsole) */
window.addEventListener('error', function (e) {
  var d = document.getElementById('fehler');
  if (!d) { d = document.createElement('pre'); d.id = 'fehler'; (document.body || document.documentElement).appendChild(d);
    d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;margin:0;padding:10px;background:#b00020;color:#fff;font:15px/1.3 monospace;z-index:999;white-space:pre-wrap'; }
  var t = e.target, msg;
  if (t && t !== window && (t.src || t.href)) msg = 'Datei nicht gefunden: ' + (t.src || t.href);
  else msg = 'Fehler: ' + e.message + (e.filename ? '  (' + e.filename.split('/').slice(-2).join('/') + ', Zeile ' + e.lineno + ')' : '');
  d.textContent += msg + '\n';
}, true);

<script>
/* =====================================================================
   FEUERWACHE INNEN – zum Entdecken (Alarme kommen später, nur hier drinnen)
   Erdgeschoss: links die Fahrzeughalle (Löschfahrzeug, Drehleiter, Rolltore, Schläuche, unten an der Rutschstange),
                in der Halle neben der Rutschstange die Spinde, rechts hinten die Leitstelle (Monitor, Funkgerät), rechts vorne Flur mit Haustür und Treppe.
   Obergeschoss: links hinten der Schlafraum mit Betten und dem Loch der Rutschstange, links vorne der Fitnessraum (Laufband, Hantel, Boxsack),
                 rechts Küche und Aufenthaltsraum.
   Antippen: Kind läuft hin. Fahrzeug antippen = Blaulicht und Martinshorn. Rolltor antippen = auf/zu.
   Vor dem Spind stehen bleiben = Feuerwehrkleidung an/aus. Oben aufs Loch stellen = runterrutschen. Bett = schlafen.
   ALARM (nur hier drinnen, nach einer Weile): Licht rot/blau im Wechsel, Gong, Bild des Einsatzes auf dem Monitor der Leitstelle. Erst den Feuerwehranzug anziehen, dann zum
   leuchtenden Fahrzeug laufen (oder es antippen): einsteigen, Tor geht auf, die Fahrzeuge des Einsatzes rücken aus → spiele/einsatz/.
   ===================================================================== */
window.HOF_URL = '../baustelle/index.html';
const save = Hof.save;
document.querySelectorAll('[data-home]').forEach(b => b.addEventListener('click', () => goHof('wache')));
Object.assign(WORDS, { locker: ['SPIND', 'Spind'],
  radio: ['FUNKGERÄT', 'Funkgerät'], pole: ['RUTSCHSTANGE', 'Rutschstange'], hoses: ['SCHLÄUCHE', 'Schläuche'], up: ['OBEN', 'Oben'], down: ['UNTEN', 'Unten'],
  dorm: ['SCHLAFRAUM', 'Schlafraum'], kitchen: ['KÜCHE', 'Küche'],
  gym: ['FITNESSRAUM', 'Fitnessraum'], shower: ['DUSCHE', 'Dusche'], sink: ['WASCHBECKEN', 'Waschbecken'], treadmill: ['LAUFBAND', 'Laufband'], barbell: ['HANTEL', 'Hantel'], punchbag: ['BOXSACK', 'Boxsack'] });

const Wache = (() => {
  const S = 1, WH = 24, T4 = 4, GAP = 28;
  let room, floor, level = 0, walls = [], spots = {}, stairs, kid, grid, idle = 0, swap = null, slide = null, night = null, atDoor = 0;
  let gear = false, gearT = 0, vehicles = [], gates = [0, 0], gateGoal = [0, 0], hoseWob = 0, radioT = 0, siren = null, furn = [];
  let alarm = null, nextAlarm = 12, depart = null, nag = 0;   // Alarm: { key, t, g }; depart: Fahrzeuge rücken aus
  let gym = null, gymAct = null, bagSwing = 0;               // Fitnessraum (OG): Geräte; gymAct = { k: 'run'|'lift', t, n } läuft gerade
  const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  const inR = (r, x, y, p = 0) => x > r.x - p && x < r.x + r.w + p && y > r.y - p && y < r.y + r.h + p;

  function enter() {
    Hof.load();
    const f = save.fire || {};
    if ((f.step | 0) < 5 || !f.unlocked) { goHof('wache'); return; }
    layout(true);
    const cols = Math.min(gc - 1, 16);
    room = { x: Math.round((W - cols * G) / 2), y: G, w: cols * G, h: H - G - 12 };
    floor = { x: room.x + 4, y: room.y + WH + 2, w: room.w - 8, h: room.h - WH - 6 };
    setupLevel();
    kid = { x: spots.door.x + spots.door.w / 2, y: floor.y + floor.h - 26, path: [], t: 0, flip: false, still: 0 };
    nextAlarm = rnd(10, 16);
    show('ihud'); setWord('firestation');
    if (location.hash === '#einsatz') {               // zurück vom Einsatz: im Anzug neben dem Fahrzeug, nächster Alarm später
      history.replaceState(null, '', location.pathname + location.search);
      const v = vehicles.find(v => v.key === 'dlk') || vehicles[0]; gear = true; kid.x = v.x + v.w / 2; kid.y = v.y + v.h + 10; kid.used = true; nextAlarm = rnd(25, 40);
      setTimeout(() => say('Gut gemacht!'), 400);
    } else setTimeout(() => sayWord('firestation'), 400);
  }
  function setWord(key) { const el = $('iword'); el.dataset.say = key; el.querySelector('.word').textContent = WORDS[key][0]; }

  // ---------- Grundriss je Etage ----------
  function setupLevel() {
    // Grundriss nach Michaels Zeichnung (25.11.): drei Streifen von links nach rechts.
    //   links: EG Fahrzeughalle | OG hinten Schlafraum, vorne Fitnessraum
    //   Mitte: Flur über beide Etagen mit Rutschstange (hinten), Treppe an der rechten Flurwand, unten die Haustür
    //   rechts: EG hinten Einsatzzentrale (Leitstelle), vorne Bad | OG hinten Küche, vorne Aufenthaltsraum
    const fx = floor.x, fy = floor.y, fw = floor.w, fh = floor.h, fb = fy + fh, fr = fx + fw;
    const cw = Math.max(64, Math.round(fw * 0.2)), hw = Math.round((fw - cw - 2 * T4) * 0.58);
    const vx = fx + hw, cx0 = vx + T4, cx1 = cx0 + cw, ux = cx1, rx = ux + T4, rw = fr - rx, hy = Math.round(fy + fh * 0.42);
    const top = room.y + WH - 2;
    const vwall = (x, gaps) => { let y0 = top; for (const [a, b] of gaps.concat([[fb + 9, fb + 9]])) { if (a > y0) walls.push({ x, y: y0, w: T4, h: Math.min(a, fb) - y0 }); y0 = b; } };
    const hwall = (y, x0, x1, gaps) => { let a0 = x0; for (const [a, b] of gaps.concat([[x1, x1]])) { if (a > a0) walls.push({ x: a0, y, w: a - a0, h: T4 }); a0 = b; } };
    walls = [];
    const upDoor = fy + 40, rDoorLow = hy + T4 + 14;              // Durchgänge: oben unter der Stange, rechts unten über der Treppe
    stairs = { x: cx1 - 30, y: Math.min(fb - 76, Math.max(rDoorLow + GAP + 6, fb - 90)), w: 28, h: 42 };   // Treppe an der rechten Flurwand, über der Haustür
    spots = { vx, hy, cx0, cx1, rx, pole: { x: cx0 + Math.round(cw / 2) - 6, y: fy + 12, w: 12, h: 12 } };
    const dw = Math.min(2 * G, cw - 8);
    spots.door = { x: cx0 + Math.round((cw - dw) / 2), w: dw };    // Haustür unten im Flur
    furn = []; vehicles = []; gym = null; gymAct = null;
    if (level === 0) {
      vwall(vx, [[upDoor, upDoor + GAP], [fb - GAP - 4, fb + 9]]);   // Halle | Flur: oben (zu den Spinden) und unten (vor den Fahrzeugen)
      const lDoor = Math.round(fy + (hy - fy) * 0.5 - GAP / 2);
      vwall(ux, [[lDoor, lDoor + GAP], [rDoorLow, rDoorLow + GAP]]);  // Flur | Einsatzzentrale und Bad
      hwall(hy, rx, fr + 4, []);                                      // Einsatzzentrale | Bad
      const vw = Math.max(26, Math.min(56, Math.round(hw * 0.3))), vl = Math.max(50, Math.min(104, fh - 46));   // 2 Stellplätze (passt zu den 2 Toren außen)
      vehicles = [{ key: 'lf', cx: fx + Math.round(hw * 0.27) }, { key: 'dlk', cx: fx + Math.round(hw * 0.7) }]
        .map((v, i) => Object.assign(v, { i, x: v.cx - (vw >> 1), y: fb - vl - 14, w: vw, h: vl, blink: 0 }));
      spots.gates = vehicles.map(v => ({ x: v.x - 8, w: v.w + 16 }));
      spots.hoses = { x: fx + 4, y: room.y + 2, w: Math.min(44, Math.round(hw * 0.22)), h: WH + 6 };
      spots.lockers = { x: vx - 6 - 3 * 16, y: fy, w: 3 * 16, h: 12 };   // Spinde hinten rechts in der Halle, gleich am Durchgang zur Rutschstange
      const ddw = Math.max(24, Math.min(rw - 16, 48)), mk = 1, mw = 32 * mk + 6, mh = 28 * mk + 6;   // Monitor: zeigt beim Alarm das Bild des Einsatzes
      spots.desk = { x: rx + Math.max(4, Math.round((rw - ddw) / 2)), y: Math.min(fy + mh + 2, hy - 18), w: ddw, h: 16 };
      spots.mon = { x: spots.desk.x + Math.round((ddw - mw) / 2), y: spots.desk.y - mh + 2, w: mw, h: mh, k: mk };
      // Bad (Michael): Waschbecken an der Wand oben, rechts 4 Kabinen übereinander: 2 Klos, 2 Duschen (Trennwände = Wände, vorne offen)
      const by = hy + T4, ch = clamp(Math.floor((fb - by - 4) / 4), 24, 40), cabW = 30, kx = fr - cabW;
      spots.cabins = [0, 1, 2, 3].map(i => ({ x: kx, y: by + 2 + i * ch, w: cabW, h: ch, k: i < 2 ? 'toilet' : 'shower' }));
      for (let i = 1; i < 4; i++) walls.push({ x: kx, y: by + 1 + i * ch, w: fr + 4 - kx, h: 2 });
      for (const c of spots.cabins) if (c.k === 'toilet') furn.push({ k: 'toilet', x: fr - 16, y: c.y + Math.max(1, Math.round((ch - 20) / 2)) });
      spots.sink = { x: rx + Math.max(4, Math.round((kx - rx - 24) / 2)), y: by + 2, w: 24, h: 16 };
      furn = furn.filter(o => BY[o.k]).map(o => Object.assign(o, { f: BY[o.k], w: BY[o.k].w, h: BY[o.k].h }));
      walls.push(...vehicles, spots.lockers, spots.desk);
    } else {
      const dormDoor = fy + 44, fitDoor = Math.round(hy + T4 + (fb - hy) * 0.3);
      vwall(vx, [[dormDoor, dormDoor + GAP], [fitDoor, fitDoor + GAP]]);   // Flur | Schlafraum und Fitnessraum
      vwall(ux, [[rDoorLow, rDoorLow + GAP]]);                              // Flur | Aufenthaltsraum
      hwall(hy, room.x, vx, []);                                            // Schlafraum | Fitnessraum
      const kd = rx + Math.max(4, Math.round(rw * 0.12));
      hwall(hy, rx, fr + 4, [[kd, kd + GAP]]);                              // Küche | Aufenthaltsraum (Durchgang links)
      const n = Math.max(2, Math.min(4, Math.floor((hw - 16) / 36)));
      for (let i = 0; i < n; i++) furn.push({ k: 'bed', x: fx + 8 + i * 36, y: fy + 4 });
      const gy0 = hy + T4 + 6, gh = fb - gy0;
      gym = {
        tread: { x: fx + 8, y: gy0 + Math.max(0, Math.round((gh - 50) * 0.3)), w: 26, h: 50 },
        bar: { x: fx + 42, y: gy0 + Math.max(4, Math.round((gh - 34) * 0.55)), w: 44, h: 30 },
        bag: { x: fx + Math.round(hw * 0.8) - 8, y: gy0 + 6, w: 16, h: 26 },
      };
      if (gym.bag.x < gym.bar.x + gym.bar.w + 8) {                // schmal: Boxsack unter die Hantel statt daneben
        gym.bag.x = gym.bar.x + gym.bar.w - 16; gym.bar.y = gy0 + 4; gym.bag.y = gym.bar.y + gym.bar.h + 26;
        if (gym.bag.y + gym.bag.h + 10 > fb) gym.bag.y = fb - gym.bag.h - 10;
      }
      const ky = fy + Math.round((hy - fy) * 0.35);
      furn.push({ k: 'table', x: rx + Math.round(rw * 0.12), y: ky + 6 }, { k: 'stove', x: fr - 22, y: fy + 2 }, { k: 'fridge', x: fr - 42, y: fy },
        { k: 'tv', x: fr - 30, y: rDoorLow }, { k: 'sofa', x: Math.max(rx + 4, fr - 50), y: fb - 26 });
      furn = furn.filter(o => BY[o.k]).map(o => Object.assign(o, { f: BY[o.k], w: BY[o.k].w, h: BY[o.k].h }));
      walls.push(...furn.filter(o => o.k !== 'bed' && o.k !== 'tv'));
    }
    buildGrid(); paint();
  }
  function buildGrid() {
    const c = 4, cols = Math.floor(floor.w / c), rows = Math.floor(floor.h / c), ok = [];
    const block = walls.concat(level === 1 ? [] : []);
    for (let r = 0; r < rows; r++) for (let q = 0; q < cols; q++) {
      const cell = { x: floor.x + q * c - 8, y: floor.y + r * c - 2, w: c + 16, h: c + 4 };
      ok.push(!block.some(wl => hit(cell, wl)));
    }
    grid = { c, cols, rows, ok };
  }
  const cellOf = (x, y) => [clamp(Math.floor((y - floor.y) / grid.c), 0, grid.rows - 1), clamp(Math.floor((x - floor.x) / grid.c), 0, grid.cols - 1)];
  function findPath(tx, ty) {
    const [sr, sc] = cellOf(kid.x, kid.y); let [er, ec] = cellOf(tx, ty);
    const idx = (r, c) => r * grid.cols + c;
    if (!grid.ok[idx(er, ec)]) { let best = null, bd = 1e9;
      for (let r = 0; r < grid.rows; r++) for (let c = 0; c < grid.cols; c++) if (grid.ok[idx(r, c)]) { const d = (r - er) ** 2 + (c - ec) ** 2; if (d < bd) { bd = d; best = [r, c]; } }
      if (!best) return []; [er, ec] = best; }
    const prev = new Map(), q = [[sr, sc]]; prev.set(idx(sr, sc), -1);
    while (q.length) { const [r, c] = q.shift(); if (r === er && c === ec) break;
      for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]) { const nr = r + dr, nc = c + dc; if (nr < 0 || nc < 0 || nr >= grid.rows || nc >= grid.cols) continue;
        const k = idx(nr, nc); if (!grid.ok[k] || prev.has(k)) continue; prev.set(k, idx(r, c)); q.push([nr, nc]); } }
    if (!prev.has(idx(er, ec))) {                       // Ziel nicht erreichbar (z. B. hinter dem Tisch): nächste erreichbare Stelle nehmen
      let bd = 1e9; for (const k of prev.keys()) { const r = Math.floor(k / grid.cols), c = k % grid.cols, d = (r - er) ** 2 + (c - ec) ** 2; if (d < bd) { bd = d; er = r; ec = c; } } }
    const path = []; let k = idx(er, ec);
    while (k !== -1) { const r = Math.floor(k / grid.cols), c = k % grid.cols; path.unshift({ x: floor.x + c * grid.c + grid.c / 2, y: floor.y + r * grid.c + grid.c / 2 }); k = prev.get(k); }
    return path;
  }
  const walkTo = (x, y) => { kid.path = findPath(x, y); kid.still = 0; };

  // ---------- Hintergrund ----------
  function paint() {
    for (let r = 0; r < gr; r++) for (let c = 0; c < gc; c++) for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) bctx.drawImage(pick(tiles.grass), c*G+i*T, r*G+j*T);
    const B = (col,x,y,w,h)=>{bctx.fillStyle=col;bctx.fillRect(x,y,w,h);};
    const { x, y, w, h } = room, { vx, hy } = spots, fb = floor.y + floor.h;
    B('rgba(0,0,0,.25)', x + 4, y + 6, w, h);
    const tileF = (x1, y1, x2, y2, c1, c2, n) => { for (let yy = y1, k = 0; yy < y2; yy += n, k++) for (let xx = x1, j = 0; xx < x2; xx += n, j++) B((k + j) % 2 ? c1 : c2, xx, yy, Math.min(n, x2 - xx), Math.min(n, y2 - yy)); };
    const { cx0, rx } = spots, Y0 = y + WH, Y1 = y + h;
    tileF(vx, Y0, rx, Y1, '#e6dcc8', '#d4c8ae', 10);                   // Flur (beide Etagen): helle Fliesen
    if (level === 0) {
      B('#8d9196', x, Y0, vx - x, h - WH); for (let xx = x; xx < vx; xx += 16) B('#7f8388', xx, Y0, 1, h - WH); for (let yy = Y0; yy < Y1; yy += 16) B('#7f8388', x, yy, vx - x, 1);   // Hallenboden Beton
      for (const v of vehicles) { B('#ffd23f', v.x - 6, v.y - 6, 2, v.h + 12); B('#ffd23f', v.x + v.w + 4, v.y - 6, 2, v.h + 12); }   // gelbe Stellplatz-Linien
      B('#33475b', rx, Y0, x + w - rx, hy - Y0); for (let i = 0; i < 40; i++) B('#3e556b', rx + 2 + ((i * 37) % Math.max(1, x + w - rx - 4)), Y0 + 2 + ((i * 23) % Math.max(1, hy - Y0 - 4)), 2, 2);   // Einsatzzentrale: dunkler Teppich
      tileF(rx, hy, x + w, Y1, '#ffffff', '#cfe8f5', 8);               // Bad: weiß-blaue Fliesen
      const p = spots.pole; B('#2c2c2c', p.x - 2, p.y - 2, p.w + 4, p.h + 4); B('#e03b3b', p.x, p.y, p.w, p.h); B('#ffd23f', p.x + 2, p.y + 2, p.w - 4, p.h - 4);   // Landematte unter der Stange
    } else {
      const carpet = (x1, y1, x2, y2, c1, c2) => { B(c1, x1, y1, x2 - x1, y2 - y1); for (let i = 0; i < 50; i++) B(c2, x1 + ((i * 37) % Math.max(1, x2 - x1 - 2)), y1 + ((i * 23) % Math.max(1, y2 - y1 - 2)), 2, 2); };
      carpet(x, Y0, vx, hy, '#a9c8e8', '#bcd6f0');                      // Schlafraum (hinten links)
      B('#3c4650', x, hy, vx - x, Y1 - hy); for (let i = 0; i < 70; i++) B(i % 3 ? '#46525e' : '#56636f', x + 2 + ((i * 41) % Math.max(1, vx - x - 4)), hy + 2 + ((i * 29) % Math.max(1, Y1 - hy - 4)), 2, 2);   // Fitnessraum: Gummiboden
      for (let yy = hy + 20; yy < Y1 - 4; yy += 22) B('#2f3840', x + 2, yy, vx - x - 4, 1);
      tileF(rx, Y0, x + w, hy, '#fff8e8', '#d9534f', 8);               // Küche (hinten rechts)
      for (let yy = hy, k = 0; yy < Y1; yy += 6, k++) { B(k % 2 ? '#c58a4f' : '#b97f45', rx, yy, x + w - rx, 6); B('#8e5a2e', rx, yy + 5, x + w - rx, 1); }   // Aufenthaltsraum Holz
      const p = spots.pole; B('#5a5a5a', p.x - 3, p.y - 3, p.w + 6, p.h + 6); B('#111', p.x, p.y, p.w, p.h); B('#ffd23f', p.x - 3, p.y - 3, p.w + 6, 1); B('#ffd23f', p.x - 3, p.y + p.h + 2, p.w + 6, 1);   // Loch mit gelbem Rand
    }
    // Treppe
    { const s2 = stairs; B('#5a3b1c', s2.x - 2, s2.y - 2, s2.w + 4, s2.h + 4);
      for (let i = 0; i < 7; i++) { const sy = s2.y + i * 6, c = level === 0 ? ['#e0a868', '#c98a4f'][i % 2] : `rgb(${60 + i * 18},${40 + i * 13},${24 + i * 8})`; B(c, s2.x, sy, s2.w, 6); B('rgba(0,0,0,.25)', s2.x, sy + 5, s2.w, 1); }
      const ax = s2.x + s2.w / 2, ay = s2.y + s2.h / 2, up = level === 0;
      for (let i = 0; i < 5; i++) B('#ffffff', Math.round(ax - i), Math.round(up ? ay - 6 + i : ay + 6 - i), 2 * i + 1, 1);
      B('#ffffff', ax - 1, up ? ay - 1 : ay - 6, 3, 7); }
    // Rückwand: rote Klinker, Fenster; in der Halle hängen hinten links die Schläuche (werden in draw gezeichnet)
    B('#b5442e', x, y, w, WH + 2); for (let yy = y + 3; yy < y + WH; yy += 5) B('#7a2218', x, yy, w, 1);
    for (let yy = y, k = 0; yy < y + WH; yy += 5, k++) for (let xx = x + (k % 2) * 6; xx < x + w; xx += 12) B('#7a2218', xx, yy, 1, 5);
    B('#cdb27a', x, y + WH, w, 2); B('#5a2a1c', x, y + WH + 1, w, 2);
    const win = wx => { B('#f2f2f2', wx, y + 4, 22, 14); B('#6cc4f0', wx + 2, y + 6, 18, 10); B('#9fe3ff', wx + 2, y + 6, 18, 4); B('#f2f2f2', wx + 10, y + 6, 2, 10); };
    if (level === 0) { win(spots.rx + Math.round((x + w - spots.rx) * 0.15)); } else { win(x + Math.round((vx - x) * 0.55)); win(spots.rx + Math.round((x + w - spots.rx) * 0.1)); }
    // Außenmauern, vorne: unten Rolltore (Halle) und Haustür, oben Fenster
    const WC = '#e9dcc0', WD = '#b8a888', OC = '#c0392b', OD = '#7a1a12';   // Innenwände beige, Außenmauer rot wie die Wache in der Stadt
    B(OD, x - 4, y - 4, w + 8, 4); B(OC, x - 4, y - 4, w + 8, 2);

      if (gear && alarm) { const k = need()[0]; setTimeout(() => sayWord(k), 900); }
      sayWord(gear ? 'gear' : 'locker');
      for (let k = 0; k < 10; k++) spawn(kid.x + rnd(-10, 10), kid.y - rnd(4, 24), rnd(-20, 20), rnd(-30, -5), .4, gear ? '#ffd23f' : '#ffffff', 30); return; }
    if (level === 0 && kid.still > 0.5) {               // Bad: aufs Klo stellen = Spülung
      const c = spots.cabins.find(c => inR(c, kid.x, kid.y - 4)), sk = spots.sink;
      if (c && c.k === 'toilet') { kid.used = true; setWord('toilet'); sayWord('toilet'); for (let k = 0; k < 14; k++) tone(250 + Math.random() * 500, .06, 'sine', .025, .3 + k * .05); return; }
      if (c) { kid.used = true; kid.x = c.x + c.w / 2 - 2; kid.y = c.y + c.h - 3; kid.flip = false; gymAct = { k: 'shower', t: 0, s: 0, c }; setWord('shower'); sayWord('shower'); return; }
      if (inR({ x: sk.x - 4, y: sk.y, w: sk.w + 8, h: sk.h + 22 }, kid.x, kid.y)) { kid.used = true; gymAct = { k: 'sink', t: 0, s: 0 }; setWord('sink'); sayWord('sink'); return; } }
    if (level === 1 && gym && kid.still > 0.4) {      // Fitnessraum: aufs Laufband / an die Hantel stellen, neben den Boxsack = boxen
      const t = gym.tread, b = gym.bar, a = gym.bag;
      if (inR(t, kid.x, kid.y - 4)) { kid.used = true; kid.x = t.x + t.w / 2; kid.y = t.y + t.h - 6; kid.flip = false; gymAct = { k: 'run', t: 0, s: 0, n: 0 }; setWord('treadmill'); sayWord('treadmill'); return; }
      if (inR(b, kid.x, kid.y - 4, 2)) { kid.used = true; kid.x = b.x + b.w / 2; kid.y = b.y + b.h - 4; kid.flip = false; gymAct = { k: 'lift', t: 0, n: 0 }; setWord('barbell'); sayWord('barbell'); return; }
      if (inR({ x: a.x - 14, y: a.y, w: a.w + 28, h: a.h + 16 }, kid.x, kid.y)) { kid.used = true; punch(); return; }
    }
    if (level === 1 && kid.still > 0.8) { const b = furn.find(o => o.k === 'bed' && kid.x > o.x + 2 && kid.x < o.x + o.w - 2 && kid.y > o.y + 4 && kid.y < o.y + o.h + 4);
      if (b) { kid.used = true; night = { t: 0, bed: b }; setWord('sleep'); say('Gute Nacht'); tone(392, .3, 'triangle', .06); tone(330, .3, 'triangle', .06, .35); tone(262, .5, 'triangle', .06, .7); } }
  }
  function draw(time) {
    if (!room) return;
    ctx.drawImage(bg, 0, 0);
    if (level === 0) { drawHoses(time); drawLockers(); drawDesk(time); drawGates(time); for (const v of vehicles) drawVehicle(v, time); drawPole(time);
      drawBath(time); for (const o of furn) o.f.draw(R, o.x, o.y, true, time); }
    else { if (gym) drawGym(time); for (const o of furn.slice().sort((a, b) => (a.y + a.h) - (b.y + b.h))) o.f.draw(R, o.x, o.y, true, time); }
    if (night) {
      const t = night.t, a = t < 1.4 ? t / 1.4 : t < 3.8 ? 1 : Math.max(0, 1 - (t - 3.8) / 1.4), b = night.bed;
      R('#f1c27d', b.x + Math.round(b.w / 2) - 4, b.y + 6, 8, 7); R('#6b3e1e', b.x + Math.round(b.w / 2) - 4, b.y + 5, 8, 3);   // Kopf auf dem Kissen
      R(`rgba(10,15,40,${(a * 0.6).toFixed(2)})`, 0, 0, W, H);
      for (let k = 0; k < 3; k++) { const zt = (t * 0.8 + k * 0.33) % 1; R('#ffffff', Math.round(b.x + b.w * 0.6 + zt * 10), Math.round(b.y - zt * 22), 3, 3); }
    } else if (slide && !slide.done) { const k = 1 - slide.t / 0.4; if (k > 0.2) drawKid(kid.x, kid.y); }
    else if (!depart) { drawKid(kid.x, kid.y);
      if (gymAct && (gymAct.k === 'shower' || gymAct.k === 'sink')) drawWater(time);
      if (gymAct && gymAct.k === 'lift') { const f = (gymAct.t % 1.2) / 1.2, up = f < 0.5 ? f * 2 : 2 - f * 2; drawBarbell(kid.x, kid.y - 12 - Math.round(up * up * (3 - 2 * up) * 22)); } }
    if (alarm) drawAlarm(time);
    if (swap) { const a = swap.t < 0.35 ? swap.t / 0.35 : Math.max(0, 1 - (swap.t - 0.35) / 0.35); R(`rgba(0,0,0,${a.toFixed(2)})`, 0, 0, W, H); }
    if (slide && !slide.done) R(`rgba(0,0,0,${(slide.t / 0.4 * 0.8).toFixed(2)})`, 0, 0, W, H);
    if (!alarm && idle > 4 && !kid.path.length && Math.floor(time / 600) % 2 === 0) {   // Hinweis: Treppe, Loch, Ausgang
      const pts = level ? [spots.pole, stairs] : [stairs, { x: spots.door.x, y: room.y + room.h - 12, w: spots.door.w, h: 4 }];
      for (const q of pts) { const cx = Math.round(q.x + q.w / 2), cy = q.y - 6; for (let i = 0; i < 4; i++) R('rgba(255,255,255,.85)', cx - i, cy + i, 2 * i + 1, 1); }
    }
  }
  // Alarm: rotes Blinken, Lampen an der Rückwand, Bild des Einsatzes oben, Pfeil zum nächsten Ziel (Spind, Rutschstange, Fahrzeug)
  function drawAlarm(time) {
    const on = Math.floor(time / 250) % 2, a = 0.08 + 0.08 * Math.abs(Math.sin(time / 250));   // rot und blau im Wechsel
    R(on ? `rgba(255,40,30,${a.toFixed(3)})` : `rgba(40,110,255,${a.toFixed(3)})`, 0, 0, W, H);
    for (let lx = room.x + 30, i = 0; lx < room.x + room.w - 10; lx += 70, i++) { R('#333', lx - 2, room.y, 10, 8); R((on + i) % 2 ? '#ff3b2f' : '#3fa9f5', lx - 1, room.y + 1, 8, 6); }
    if (level === 0 && !depart) { const m = spots.mon; R(on ? 'rgba(255,59,47,.5)' : 'rgba(63,169,245,.5)', m.x - 5, m.y - 5, m.w + 10, 3); }   // Monitor leuchtet mit
    if (depart) return;
    let tg = null;
    if (!gear) tg = level ? spots.pole : spots.lockers;
    else if (level) tg = spots.pole;
    else { const v = vehicles.find(v => need().includes(v.key)); tg = { x: v.x, y: v.y + v.h - 12, w: v.w, h: 8 }; }
    if (tg) drawArrow(Math.round(tg.x + tg.w / 2 - 3), Math.round(tg.y - 16 - Math.abs(Math.sin(time / 220)) * 4));
    if (nag > 0 && !gear) { const l = spots.lockers; R(on ? 'rgba(255,210,63,.9)' : 'rgba(255,210,63,.4)', l.x - 2, l.y - 2, l.w + 4, l.h + 4); }
  }
  function resize() { const l = level; layout(false); level = l; if (room) { const cols = Math.min(gc - 1, 16); room = { x: Math.round((W - cols * G) / 2), y: G, w: cols * G, h: H - G - 12 }; floor = { x: room.x + 4, y: room.y + WH + 2, w: room.w - 8, h: room.h - WH - 6 }; setupLevel(); kid.path = []; kid.x = clamp(kid.x, floor.x + 8, floor.x + floor.w - 8); kid.y = clamp(kid.y, floor.y + 14, floor.y + floor.h); } }
  return { enter, update, draw, resize, onPointer, _alarm: () => startAlarm(), _dbg: () => ({ alarm, depart: !!depart, level, gear, kid: kid && { x: kid.x, y: kid.y, n: kid.path.length }, spots, stairs, vehicles, gates, room, floor, gym, gymAct, furn: furn.map(o => [o.k, o.x, o.y, o.w, o.h]) }) };
})();
startLoop(Wache);
addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
</script>
