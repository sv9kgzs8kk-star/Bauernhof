<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<script>
/* Zeigt Fehler direkt auf dem Bildschirm an (es gibt auf dem iPad keine Konsole) */
window.addEventListener('error', function (e) {
  var d = document.getElementById('fehler');
  if (!d) { d = document.createElement('pre'); d.id = 'fehler'; (document.body || document.documentElement).appendChild(d);
    d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;margin:0;padding:10px;background:#b00020;color:#fff;font:15px/1.3 monospace;z-index:999;white-space:pre-wrap'; }
  var t = e.target, msg;
  if (t && t !== window && (t.src || t.href)) msg = 'Datei nicht gefunden: ' + (t.src || t.href);
  else msg = 'Fehler: ' + e.message + (e.filename ? '  (' + e.filename.split('/').slice(-2).join('/') + ', Zeile ' + e.lineno + ')' : '');
  d.textContent += msg + '\n';
}, true);
</script>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Schafe hüten</title>
</head>
<body>
<canvas id="game"></canvas>

<div id="shud" class="hud gamehud hidden">
  <div class="pill" id="sheeppill"><i class="ico" data-ico="sheep"></i> <span id="sheepcount">0/3</span></div>
  <button class="pill btn" id="pausebtn" aria-label="Pause"><i class="ico" data-ico="pause"></i></button>
</div>

<div id="gpause" class="overlay hidden">
  <div class="row">
    <button class="home" data-home aria-label="Zum Hof"><i class="ico" data-ico="home"></i></button>
    <button class="big" id="gresume" aria-label="Weiter">
      <svg width="70" height="70" viewBox="0 0 10 10"><path d="M2 1 L9 5 L2 9 Z" fill="#5a3d00"/></svg>
    </button>
  </div>
</div>

<div id="gwin" class="overlay hidden">
  <div class="stars"><i class="ico" data-ico="star"></i><i class="ico" data-ico="star"></i><i class="ico" data-ico="star"></i></div>
  <div class="row">
    <div class="pill gain" data-say="wool" style="cursor:pointer"><i class="ico" data-ico="wool"></i> +<span id="wingain">3</span> <span class="word">WOLLE</span></div>
  </div>
  <button class="home" data-home aria-label="Zum Hof"><i class="ico" data-ico="home"></i></button>
</div>

<script src="../../gemeinsam/sterne.js?v=20261117k"></script>
<script src="../../gemeinsam/basis.js?v=20261117k"></script>
<script>
/* =====================================================================
   MINISPIEL: SCHAFE HÜTEN
   Mit dem Hütehund die Schafe in den Pferch treiben.
   Schafe laufen vor dem Hund weg (und ein bisschen Richtung Pferch-Tür).
   ===================================================================== */
const save = Hof.save;
window.HOF_URL = '../../hof.html';
const goHome = () => goHof('schafe');                          // zurück zum Hof
document.querySelectorAll('[data-home]').forEach(b => b.addEventListener('click', goHome));

// Schwierigkeit hängt an der Größe der eigenen Herde (gekaufte Schafe, max. 6)
const ASSIST = [0, .65, .6, .55, .45, .38, .32];
const herdSize = () => Math.min(6, save.sheep || 0);
const MAX_SHEEP = 6;
const sheepPrice = () => save.sheep >= MAX_SHEEP ? null : 5 + 3 * save.sheep;   // jedes weitere Schaf wird teurer: 5, 8, 11, …
const FLEE_R = 46, SHEEP_FAST = 36, SHEEP_SLOW = 5, DOG_SPEED = 50;
const SHEEP = ANIMALS[1];
const DOG = { pal: { k:'#1f1f1f', w:'#ffffff', p:'#ff7a9a' },
  px: ['......k.k.', '......kkkk', 'k....kkwwk', 'kkkkkkkww.', '.kkwwwkp..', '.w.w..w.w.'] };
const DOG_RUN = { pal: DOG.pal,
  px: ['......k.k.', '......kkkk', 'k....kkwwk', 'kkkkkkkww.', '.kkwwwkp..', 'w..w.w..w.'] };

const Schafe = (() => {
  let dogGoal = null;
  let state = 'start', level, sheep = [], walls = [], pen, inner, door, dog, inCount = 0, idle = 9, winTimer = null;

  function collide(e, r) {
    const cx = clamp(e.x, r.x, r.x + r.w), cy = clamp(e.y, r.y, r.y + r.h);
    const dx = e.x - cx, dy = e.y - cy, d2 = dx*dx + dy*dy;
    if (d2 >= e.rad*e.rad) return;
    if (d2 > 0.0001) { const d = Math.sqrt(d2); e.x = cx + dx/d*e.rad; e.y = cy + dy/d*e.rad; return; }
    const l = e.x - r.x, rr = r.x + r.w - e.x, t = e.y - r.y, b = r.y + r.h - e.y, m = Math.min(l, rr, t, b);
    if (m === l) e.x = r.x - e.rad; else if (m === rr) e.x = r.x + r.w + e.rad;
    else if (m === t) e.y = r.y - e.rad; else e.y = r.y + r.h + e.rad;
  }
  const TOP = 22;                                   // oben Platz für die Anzeige lassen
  function keepIn(e) { e.x = clamp(e.x, 8, W - 8); e.y = clamp(e.y, TOP, H - 8); for (const w of walls) collide(e, w); }

  function build() {
    level = herdSize();
    const L = { n: level, trees: clamp(level - 2, 0, 4), assist: ASSIST[level] };
    layout(true);
    // Wiese
    for (let r = 0; r < gr; r++) for (let c = 0; c < gc; c++)
      for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++)
        bctx.drawImage(Math.random() < .06 ? pick(flowerTiles) : pick(tiles.grass), c*G + i*T, r*G + j*T);
    // Pferch (3×3 Zellen) rechts, Tür links in der Mitte
    const pc = gc - 4, pr = Math.max(1, Math.floor((gr - 3) / 2));
    pen = { x: pc*G, y: pr*G, w: 3*G, h: 3*G };
    inner = { x: pen.x + 7, y: pen.y + 9, w: pen.w - 14, h: pen.h - 16 };
    const gap = 36, seg = (pen.h - gap) / 2;
    door = { x: pen.x, y: pen.y + seg, h: gap };
    walls = [
      { x: pen.x, y: pen.y, w: pen.w, h: 4 },
      { x: pen.x, y: pen.y + pen.h - 4, w: pen.w, h: 4 },
      { x: pen.x + pen.w - 4, y: pen.y, w: 4, h: pen.h },
      { x: pen.x, y: pen.y, w: 4, h: seg },
      { x: pen.x, y: pen.y + pen.h - seg, w: 4, h: seg },
    ];
    for (let j = 0; j < 6; j++) for (let i = 0; i < 6; i++) bctx.drawImage(pick(tiles.straw), pen.x + i*T, pen.y + j*T);
    const B = (col,x,y,w,h)=>{bctx.fillStyle=col;bctx.fillRect(x,y,w,h);};
    for (const w of walls) {
      B('rgba(0,0,0,.2)', w.x + 2, w.y + 2, w.w, w.h);
      B('#a0673a', w.x, w.y, w.w, w.h); B('#c88a52', w.x, w.y, w.w, 1);
      if (w.w > w.h) for (let x = w.x; x <= w.x + w.w - 4; x += 12) B('#6b3f1d', x, w.y - 2, 4, w.h + 4);
      else for (let y = w.y; y <= w.y + w.h - 4; y += 12) B('#6b3f1d', w.x - 1, y, w.w + 2, 4);
    }
    // Bäume als Hindernisse
    const used = new Set();
    for (let k = 0; k < L.trees; k++) for (let t = 0; t < 40; t++) {
      const c = 1 + ((Math.random() * (gc - 2))|0), r = 1 + ((Math.random() * (gr - 2))|0);
      if (used.has(r*100 + c) || (c < 2 && Math.abs(r - gr/2) < 2) || (c >= pc - 1 && r >= pr - 1 && r <= pr + 3)) continue;
      used.add(r*100 + c); drawObstacle(bctx, 't', c*G, r*G);
      walls.push({ x: c*G + 6, y: r*G + 6, w: 12, h: 12 }); break;
    }
    // Hund und Schafe
    dog = { x: G, y: H/2, vx: 0, vy: 0, rad: 6, flip: false };
    sheep = []; inCount = 0;
    const nearPen = (x, y) => x > pen.x - 18 && x < pen.x + pen.w + 10 && y > pen.y - 14 && y < pen.y + pen.h + 14;
    for (let k = 0; k < L.n; k++) for (let t = 0; t < 200; t++) {
      const s = { x: rnd(2*G, W - G), y: rnd(2*G, H - G), vx: 0, vy: 0, rad: 6, flip: Math.random() < .5,
                  in: false, tx: 0, ty: 0, wait: rnd(0, 2), baaCd: rnd(1, 4) };
      if (nearPen(s.x, s.y) || Math.hypot(s.x - dog.x, s.y - dog.y) < 50) continue;
      const before = { x: s.x, y: s.y }; keepIn(s);
      if (s.x !== before.x || s.y !== before.y) continue;
      if (sheep.some(o => Math.hypot(o.x - s.x, o.y - s.y) < (t < 150 ? 20 : 13))) continue;
      sheep.push(s); break;
    }
    hud();
  }
  function hud() { $('sheepcount').textContent = inCount + '/' + sheep.length; }

  // Laden nur, wenn man ein Schaf kaufen kann oder etwas fehlt (Schafe/Heu) – sonst geht es sofort los
  function enter() {
    build(); state = 'start'; hide('shud');
    const p = sheepPrice();
    if (save.sheep === 0 || save.hay === 0 || (p != null && save.stars >= p)) {
      openShop({
        stats: () => [['sheep', save.sheep, 'sheep', 'shopsheep'], ['star', save.stars, 'star', 'shopstar'], ['hay', save.hay, 'hay', 'shophay']],
        item: { word: WORDS.sheep[0], sayKey: 'sheep', price: sheepPrice,
                draw: el => { el.innerHTML = '<i class="ico" data-ico="sheep"></i>'; applyIcons(el); } },
        canPlay: () => save.sheep > 0 && save.hay > 0,
        missingId: () => save.sheep === 0 ? 'shopbuy' : 'shophay',
        onBlocked: () => { if (save.sheep > 0) sayWord('hay'); },
        onBuy: () => { save.sheep++; Hof.persist(); },
        onPlay: start,
        onHome: goHome
      });
    } else start();
  }
  function start() {
    build(); show('shud'); show('ctrl'); showPadHint(); state = 'play'; sfx.bark();
  }
  $('pausebtn').addEventListener('click', () => { if (state !== 'play') return; state = 'pause'; clearHeld(); show('gpause'); });
  $('gresume').addEventListener('click', () => { hide('gpause'); state = 'play'; });

  function win() {
    state = 'won'; clearHeld();
    Hof.load();
    const gain = Math.min(sheep.length, save.hay);    // jedes Schaf gibt 1 Wolle – und frisst dafür 1 Heuballen
    Hof.addHay(-gain); Hof.addWool(gain);
    setTimeout(() => {
      hide('shud'); hide('ctrl'); $('wingain').textContent = gain;
      const row = $('gwin').querySelector('.stars');               // Belohnung ist Wolle, keine Sterne
      row.innerHTML = gain ? '<i class="ico" data-ico="wool"></i>'.repeat(gain) : '<i class="ico" data-ico="hay"></i>';
      applyIcons(row); show('gwin'); sfx.win(); confetti();
      setTimeout(() => sayWord('wool'), 1600);
      winTimer = setTimeout(goHome, 4000);
    }, 600);
  }

  function update(dt) {
    if (state !== 'play' && state !== 'won') return;
    // Hund
    let tvx = 0, tvy = 0;
    if (state === 'play' && held) { tvx = DIRS[held][0] * DOG_SPEED; tvy = DIRS[held][1] * DOG_SPEED; }
    else if (state === 'play' && dogGoal) {          // Antippen: Hund läuft zum Finger
      const dx = dogGoal.x - dog.x, dy = dogGoal.y - dog.y, d = Math.hypot(dx, dy);
      if (d > 3) { tvx = dx/d*DOG_SPEED; tvy = dy/d*DOG_SPEED; } else if (!pDown) dogGoal = null;
    }
    const busy = held || dogGoal;
    if (busy && idle > 1.2) sfx.bark();
    idle = busy ? 0 : idle + dt;
    dog.vx = approach(dog.vx, tvx, 260*dt); dog.vy = approach(dog.vy, tvy, 260*dt);
    dog.x += dog.vx*dt; dog.y += dog.vy*dt; keepIn(dog);
    if (Math.abs(dog.vx) > 2) dog.flip = dog.vx < 0;

    const assist = ASSIST[level];
    const doorX = door.x - 6, doorY = door.y + door.h/2;
    for (const s of sheep) {
      s.baaCd -= dt;
      let tx = 0, ty = 0, speed = 0;
      if (s.in) {
        // im Pferch: gemütlich herumlaufen
        if (s.wait > 0) s.wait -= dt;
        else {
          const dx = s.tx - s.x, dy = s.ty - s.y, d = Math.hypot(dx, dy);
          if (d < 1) { s.wait = rnd(1, 3); s.tx = rnd(inner.x, inner.x + inner.w); s.ty = rnd(inner.y, inner.y + inner.h); }
          else { tx = dx/d; ty = dy/d; speed = SHEEP_SLOW; }
        }
      } else {
        const dx = s.x - dog.x, dy = s.y - dog.y, d = Math.hypot(dx, dy) || 0.01;
        if (d < FLEE_R) {
          const f = (FLEE_R - d) / FLEE_R;
          tx = dx/d; ty = dy/d;
          // kleine Hilfe: Richtung Pferch-Tür bzw. hinein, wenn schon davor
          const nearDoor = s.x > door.x - 22 && s.y > door.y - 4 && s.y < door.y + door.h + 4;
          const gx = (nearDoor ? pen.x + pen.w/2 : doorX) - s.x, gy = (nearDoor ? pen.y + pen.h/2 : doorY) - s.y, gd = Math.hypot(gx, gy) || 1;
          // klebt das Schaf außen am Zaun, hilft es stärker Richtung Tür
          const atFence = !nearDoor && s.x > pen.x - 16 && s.x < pen.x + pen.w + 16 && s.y > pen.y - 16 && s.y < pen.y + pen.h + 16;
          const a = nearDoor ? 0.9 : atFence ? Math.max(assist, 0.8) : assist;
          tx += gx/gd*a; ty += gy/gd*a;
          // nicht am Rand festklemmen: vom Rand weg nach innen drücken
          const m = 22;
          if (s.x < m) tx += (m - s.x)/m*1.5; if (s.x > W - m) tx -= (s.x - (W - m))/m*1.5;
          if (s.y < TOP + m) ty += (TOP + m - s.y)/m*1.5; if (s.y > H - m) ty -= (s.y - (H - m))/m*1.5;
          const n = Math.hypot(tx, ty) || 1; tx /= n; ty /= n;
          speed = SHEEP_FAST * Math.min(1, 0.35 + f*1.5);
          if (s.baaCd <= 0 && Math.random() < 0.03) { sfx.baa(); s.baaCd = rnd(2, 4); }
          s.wait = 0.8;
        } else if (s.wait > 0) s.wait -= dt;
        else {
          const ddx = s.tx - s.x, ddy = s.ty - s.y, dd = Math.hypot(ddx, ddy);
          if (dd < 1 || dd > 60) { s.wait = rnd(1, 4); s.tx = s.x + rnd(-25, 25); s.ty = s.y + rnd(-25, 25); }
          else { tx = ddx/dd; ty = ddy/dd; speed = SHEEP_SLOW; }
        }
      }
      s.vx = approach(s.vx, tx*speed, 160*dt); s.vy = approach(s.vy, ty*speed, 160*dt);
      s.x += s.vx*dt; s.y += s.vy*dt;
      if (Math.abs(s.vx) > 1) s.flip = s.vx < 0;
      if (s.in) {
        for (const o of sheep) if (o !== s && o.in) {
          const ex = s.x - o.x, ey = s.y - o.y, ed = Math.hypot(ex, ey);
          if (ed > 0 && ed < 12) { s.x += ex/ed*(12-ed)*0.5; s.y += ey/ed*(12-ed)*0.5; }
        }
        s.x = clamp(s.x, inner.x, inner.x + inner.w); s.y = clamp(s.y, inner.y, inner.y + inner.h);
      }
      else {
        keepIn(s);
        for (const o of sheep) if (o !== s && !o.in) {          // Schafe schubsen sich sanft auseinander
          const ex = s.x - o.x, ey = s.y - o.y, ed = Math.hypot(ex, ey);
          if (ed > 0 && ed < 12) { s.x += ex/ed*(12-ed)*0.5; s.y += ey/ed*(12-ed)*0.5; }
        }
        if (s.x > inner.x && s.x < inner.x + inner.w && s.y > inner.y && s.y < inner.y + inner.h) {
          s.in = true; s.wait = 0.5; s.tx = s.x; s.ty = s.y; inCount++; hud();
          sfx.baa(); sfx.load(); bump($('sheeppill'));
          for (let i = 0; i < 24; i++) spawn(s.x, s.y - 4, rnd(-30, 30), rnd(-40, 0), rnd(.5, 1), pick(['#ffd23f','#fff','#ff8ad8']), 50);
          if (state === 'play' && inCount === sheep.length) win();
        }
      }
    }
  }

  function draw(time) {
    if (!dog) return;                                // (kurz vor der Weiterleitung ohne Schafe)
    ctx.drawImage(bg, 0, 0);
    const ents = sheep.map(s => ({ y: s.y, d: () => drawAnimalPix(SHEEP, s.x - 8, s.y - 8, s.flip, (Math.hypot(s.vx, s.vy) > 8 && Math.sin(time/70) > 0) ? 1 : 0) }));
    const run = Math.hypot(dog.vx, dog.vy) > 5;
    ents.push({ y: dog.y, d: () => {
      R('rgba(0,0,0,.2)', dog.x - 8, dog.y + 4, 18, 3);
      drawAnimalPix(run && Math.sin(time/60) > 0 ? DOG_RUN : DOG, dog.x - 10, dog.y - 8, dog.flip, 0);
    }});
    ents.sort((a, b) => a.y - b.y).forEach(e => e.d());
    if (state === 'play' && inCount === 0) drawArrow(door.x - 4, door.y - 12 - Math.abs(Math.sin(time/200))*4);
  }
  function onPointer(type, x, y) {
    if (state !== 'play') return true;
    if (ctlMode === 'tippen') { dogGoal = { x, y }; }
    return true;
  }
  function resize() { if (state === 'start') enter(); else layout(false); }
  function exit() { clearTimeout(winTimer); }
  return { enter, update, draw, resize, exit, onPointer, _dbg: () => ({ state, inCount, n: sheep.length, level, dog, sheep }) };
})();

startLoop(Schafe);
</script>
</body>
</html>
