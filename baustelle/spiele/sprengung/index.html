/* Zeigt Fehler direkt auf dem Bildschirm an (es gibt auf dem iPad keine Konsole) */
window.addEventListener('error', function (e) {
  var d = document.getElementById('fehler');
  if (!d) { d = document.createElement('pre'); d.id = 'fehler'; (document.body || document.documentElement).appendChild(d);
    d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;margin:0;padding:10px;background:#b00020;color:#fff;font:15px/1.3 monospace;z-index:999;white-space:pre-wrap'; }
  var t = e.target, msg;
  if (t && t !== window && (t.src || t.href)) msg = 'Datei nicht gefunden: ' + (t.src || t.href);
  else msg = 'Fehler: ' + e.message + (e.filename ? '  (' + e.filename.split('/').slice(-2).join('/') + ', Zeile ' + e.lineno + ')' : '');
  d.textContent += msg + '\n';
}, true);

<script>
/* =====================================================================
   MINISPIEL: HOCHHAUS-SPRENGUNG (Baustelle, fertiges Hochhaus house.step = 5) – schräg von oben
   1. Umzug: Möbel antippen → Bauarbeiter trägt sie in die Kiste, Kiste in den Transporter.
   2. Absperren: leuchtende Stellen rund ums Haus antippen → rot-weiße Absperrgitter.
   3. Sprengladungen: leuchtende Pfeiler im Erdgeschoss antippen → rote Ladung, Kabel zum Zündkasten.
   4. Zünden: roten Griff am Zündkasten drücken → Sirene, „Drei, zwei, eins“, dumpfes Rumms, das Haus sackt Stockwerk für Stockwerk
      in sich zusammen, eine große Staubwolke legt sich langsam.
   5. Schutt wegbaggern wie beim Abriss (über Schutthaufen fahren, Schaufel voll → zum Kipper, 3 Kipper).
   Danach Hof.demolishHouse: Bauplatz leer, Hauswahl. Möbel bleiben gespeichert.
   ===================================================================== */
window.HOF_URL = '../../index.html';
const save = Hof.save;
const house = () => save.house;
const STARS = 3;
Object.assign(WORDS, { barrier: ['ABSPERRUNG', 'Absperrung'], charge: ['SPRENGLADUNG', 'Sprengladung'], blast: ['SPRENGUNG', 'Sprengung'] });
document.querySelectorAll('[data-home]').forEach(b => b.addEventListener('click', () => goHof('abriss')));
const WORKER = BUILDER_FRONT;
function drawWorker(x, y, step) {
  x = Math.round(x); y = Math.round(y);
  R('rgba(0,0,0,.25)', x - 9, y - 2, 20, 3);
  WORKER.px.forEach((row, j) => [...row].forEach((ch, i) => {
    if (ch === '.') return;
    let yy = y - 24 + j * 2; if (j >= 10 && step && (i < 5) === (step > 0)) yy -= 1;
    R(WORKER.pal[ch], x - 10 + i * 2, yy, 2, 2);
  }));
}
const Q = snapF(R, 2);
function drawFurn(f, X, Y, t) { f.draw((col, x, y, w, h) => R(col, Math.round(X + x), Math.round(Y + y), w, h), 0, 0, true, t || 0); }
// 3×5-Ziffern für den Countdown
const CDIG = { 1: ['010', '110', '010', '010', '111'], 2: ['111', '001', '111', '100', '111'], 3: ['111', '001', '011', '001', '111'] };
function bigDigit(n, cx, cy, k) { CDIG[n].forEach((row, j) => [...row].forEach((c, i) => { if (c === '1') { R('#5a0000', cx - 1.5 * k + i * k + 3, cy - 2.5 * k + j * k + 3, k, k); R('#ff3b30', cx - 1.5 * k + i * k, cy - 2.5 * k + j * k, k, k); } })); }

const Abriss = (() => {
  let g, phase, paused = false, idle = 0, winTimer = null, wood = null;
  let queue, packed, carry, box, van, boxCarry;                       // Umzug
  let spots, charges, det, cd, blast, sink = 0, dust = [], shake = 0, flash = 0;   // Absperren, Laden, Zünden
  let veh, truck, cells, fill, cap, loads, totalLoads, left, totalCells, honked = false, truckColor = 0;   // Schutt
  function setWord(k, count) { const el = $('aword'); el.dataset.say = k; el.querySelector('.word').textContent = WORDS[k][0]; $('acount').textContent = count || ''; }
  function enter() {
    Hof.load();
    if (!house() || house().step < 5 || house().pick || houseType().shape !== 'T') { goHof('abriss'); return; }
    layout(true);
    const fh = H < 230 ? 13 : 16, d = 36, w = 96;
    const y = Math.max(TOWER_FLOORS * fh + 22, Math.min((gr - 1) * G - 34 - d, Math.round((gr - 1) * G / 2)));
    const x = Math.round((W - w) / 2);
    g = { x, y, w, d, fh, hx: x, hy: y, hw: w, hh: d };
    for (let r = 0; r < gr; r++) for (let c = 0; c < gc; c++) {
      const set = r === gr - 1 ? tiles.road : bauTiles.gravel;
      for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) bctx.drawImage(pick(set), c*G+i*T, r*G+j*T);
    }
    // Umzug
    const kinds = [...new Set((save.home.items || []).map(i => i.k))].filter(k => BY[k]).slice(0, 6);
    queue = (kinds.length ? kinds : ['lamp', 'chair']).map(k => BY[k]);
    packed = 0; carry = null; boxCarry = null;
    g.door = { x: x + w / 2, y: y + d + 2 };
    box = { x: Math.max(4, x - 34), y: Math.min(y + d + 8, (gr - 1) * G - 22), closed: false };
    van = { x: -110, y: gr * G - VAN_H * 2 - 2, state: 'away', open: false };
    // Absperrgitter rund ums Haus, Pfeiler im Erdgeschoss, Zündkasten rechts hinter der Absperrung
    const gx0 = Math.max(10, x - 30), gx1 = Math.min(W - 26, x + w + 12), gyT = Math.max(14, y - TOWER_FLOORS * fh - 6), gyB = Math.min(H - 30, y + d + 26);
    spots = [[gx0, gyT + 10], [gx1, gyT + 10], [gx0, (gyT + gyB) / 2], [gx1, (gyT + gyB) / 2], [x + 6, gyB], [x + w - 24, gyB]].map(([sx, sy]) => ({ x: Math.round(sx), y: Math.round(sy), on: false }));
    charges = [0.08, 0.36, 0.64, 0.92].map(f => ({ x: Math.round(x + w * f), y: Math.round(y + d - fh / 2), on: false }));
    det = { x: Math.min(W - 22, x + w + 44), y: Math.min(H - 26, y + d + 14), pressed: 0 };
    cd = null; blast = null; sink = 0; dust = []; shake = 0; flash = 0;
    // Schutt: alle Rasterfelder unter dem Haus
    cells = [];
    for (let r = Math.floor(y / G); r <= Math.floor((y + d - 1) / G); r++) for (let c = Math.floor(x / G); c <= Math.floor((x + w - 1) / G); c++) if (r < gr - 1) cells.push({ r, c, dug: false, seed: r * 31 + c * 7 });
    totalCells = left = cells.length; totalLoads = 3; cap = Math.ceil(totalCells / totalLoads); fill = 0; loads = 0; veh = null; truck = null;
    phase = 'move'; idle = 0; paused = false;
    show('ahud'); setWord('move', '0/' + queue.length);
    setTimeout(() => sayWord('move'), 400);
  }
  $('pausebtn').addEventListener('click', () => { if (phase === 'done') return; paused = true; show('gpause'); });
  $('gresume').addEventListener('click', () => { hide('gpause'); paused = false; });

  // ---------- 1. Umzug (wie beim Abriss) ----------
  function pieceSpot(f) { return { x: Math.round(g.door.x - f.w / 2), y: Math.round(g.door.y + 2) }; }
  function tapMove() {
    if (!carry && packed < queue.length) { const f = queue[packed]; carry = { f, t: 0 }; sfx.click(); setWord(f.key, packed + '/' + queue.length); sayWord(f.key); return; }
    if (packed >= queue.length && van.state === 'park' && !boxCarry) { boxCarry = { t: 0 }; van.open = true; sfx.click(); setWord('box'); sayWord('box'); }
  }
  function updMove(dt) {
    if (carry) {
      carry.t += dt / 1.4;
      if (carry.t >= 1) { carry = null; packed++; sfx.clod(); setWord('move', packed + '/' + queue.length);
        for (let i = 0; i < 6; i++) spawn(box.x + 11, box.y + 4, rnd(-15, 15), rnd(-12, -4), .3, '#d9a066', 30);
        if (packed >= queue.length) { box.closed = true; sfx.load(); setTimeout(() => { van.state = 'come'; sfx.honk(); setWord('van'); sayWord('van'); }, 700); } }
    }
    if (van.state === 'come') { van.x += 110 * dt; if (van.x >= box.x - 20) { van.x = box.x - 20; van.state = 'park'; } }
    if (boxCarry) { boxCarry.t += dt / 1.2; if (boxCarry.t >= 1) { boxCarry = null; box.gone = true; van.open = false; sfx.clod(); van.state = 'go'; sfx.honk(); } }
    if (van.state === 'go') { van.x += 140 * dt; if (van.x > W + 20) { van.state = 'gone'; startBarrier(); } }
  }
  function drawMove(time) {
    if (!box.gone && !boxCarry) drawMoveBox(Q, box.x, box.y, box.closed);
    const nf = !carry && packed < queue.length ? queue[packed] : null;
    if (nf) { const p = pieceSpot(nf); drawFurn(nf, p.x, p.y, time);
      if (Math.abs(Math.sin(time / 260)) > .5) { R('rgba(255,210,63,.9)', p.x - 2, p.y - 2, nf.w + 4, 1); R('rgba(255,210,63,.9)', p.x - 2, p.y + nf.h + 1, nf.w + 4, 1); R('rgba(255,210,63,.9)', p.x - 2, p.y - 2, 1, nf.h + 4); R('rgba(255,210,63,.9)', p.x + nf.w + 1, p.y - 2, 1, nf.h + 4); } }
    if (carry) {
      const k = carry.t, back = k > 0.6, u = back ? (k - 0.6) / 0.4 : k / 0.6;
      const sx = g.door.x, sy = g.door.y + 26, ex = box.x + 11, ey = box.y + 16;
      const x = back ? ex + (sx - ex) * u : sx + (ex - sx) * u, y = back ? ey + (sy - ey) * u : sy + (ey - sy) * u;
      drawWorker(x, y, Math.floor(time / 120) % 2 ? 1 : -1);
      if (!back) drawFurn(carry.f, Math.round(x - carry.f.w / 2), Math.round(y - 24 - carry.f.h), time);
    } else if (!boxCarry) drawWorker(g.door.x + 18, g.door.y + 26, 0);
    if (van.state !== 'away' && van.state !== 'gone') drawVan(Q, van.x, van.y, van.open, 2);
    if (boxCarry) { const u = boxCarry.t, x = box.x + 11 + (van.x + 4 - box.x - 11) * u, y = box.y + 16 + (van.y + 40 - box.y - 16) * u;
      drawWorker(x, y, Math.floor(time / 120) % 2 ? 1 : -1); drawMoveBox(Q, Math.round(x - 11), Math.round(y - 24 - 18), true); }
    if (idle > 2.5 && !carry && !boxCarry) { const b = Math.round(Math.abs(Math.sin(time / 220)) * 4);
      if (nf) { const p = pieceSpot(nf); drawArrow(Math.round(p.x + nf.w / 2 - 3), p.y - 14 - b); } else if (van.state === 'park') drawArrow(box.x + 8, box.y - 14 - b); }
  }

  // ---------- 2. Absperren ----------
  function startBarrier() { phase = 'barrier'; idle = 0; setWord('barrier', '0/' + spots.length); sayWord('barrier'); }
  const nOn = l => l.filter(q => q.on).length;
  // ---------- 3. Sprengladungen ----------
  function startCharge() { phase = 'charge'; idle = 0; setWord('charge', '0/' + charges.length); sayWord('charge'); }
  // ---------- 4. Zünden ----------
  function startFire() { phase = 'fire'; idle = 0; setWord('blast'); sayWord('blast'); }
  function fire() {                                   // Sirene, dann 3-2-1
    phase = 'count'; det.pressed = 1; sfx.click(); cd = { t: 0, n: 0 };
    for (let i = 0; i < 6; i++) tone(i % 2 ? 660 : 880, .28, 'square', .035, i * 0.3);   // Sirene
  }
  function boom() {
    phase = 'boom'; blast = { t: 0 }; shake = 1; flash = 1;
    tone(70, 1.1, 'sawtooth', .14, 0, 30); tone(45, 1.4, 'square', .09, 0.05, 25); tone(120, .5, 'triangle', .06, 0.1, 40);   // dumpfes Rumms
    for (let i = 0; i < 90; i++) dust.push({ x: g.x + Math.random() * g.w, y: g.y + g.d - Math.random() * 10, vx: rnd(-50, 50), vy: rnd(-60, 0), r: rnd(8, 18), t: 0, life: rnd(2.8, 4.5) });
  }
  function onPointer(type, x, y) {
    if (paused) return true;
    idle = 0;
    if (phase === 'found') return false;
    if (type !== 'down') return true;
    if (phase === 'move') { tapMove(); return true; }
    if (phase === 'barrier') {
      const s = spots.find(q => !q.on && Math.abs(x - q.x - 9) < 18 && Math.abs(y - q.y) < 16) || spots.find(q => !q.on);   // irgendwo tippen hilft auch
      if (s && Math.abs(x - s.x - 9) < 40 && Math.abs(y - s.y) < 40) { s.on = true; sfx.clod(); setWord('barrier', nOn(spots) + '/' + spots.length); if (nOn(spots) === spots.length) setTimeout(startCharge, 700); }
      return true;
    }
    if (phase === 'charge') {
      const c = charges.find(q => !q.on && Math.abs(x - q.x) < 14 && Math.abs(y - q.y) < 16);
      if (c) { c.on = true; sfx.click(); tone(1200, .05, 'square', .04); setWord('charge', nOn(charges) + '/' + charges.length); if (nOn(charges) === charges.length) setTimeout(startFire, 700); }
      return true;
    }
    if (phase === 'fire' && Math.abs(x - det.x - 8) < 20 && Math.abs(y - det.y) < 22) fire();
    return true;
  }
  function update(dt) {
    if (paused) return;
    idle += dt;
    if (phase === 'move') updMove(dt);
    if (phase === 'count') {
      cd.t += dt; const n = cd.t < 1.8 ? 0 : cd.t < 2.8 ? 3 : cd.t < 3.8 ? 2 : cd.t < 4.8 ? 1 : -1;
      if (n !== cd.n) { cd.n = n; if (n > 0) { say(['', 'Eins', 'Zwei', 'Drei'][n]); tone(440, .12, 'square', .05); } }
      if (n < 0) boom();
    }
    if (phase === 'boom') {
      blast.t += dt; sink = Math.min(1, Math.max(0, (blast.t - 0.25) / 2.2));
      if (blast.t < 2.4 && Math.random() < 0.5) dust.push({ x: g.x + Math.random() * g.w, y: g.y + g.d - 4, vx: rnd(-30, 30), vy: rnd(-25, 0), r: rnd(5, 12), t: 0, life: rnd(2, 3.5) });
      if (blast.t > 4.2) { phase = 'settle'; confetti(); setTimeout(startFound, 900); }
    }
    shake = Math.max(0, shake - dt * 0.7); flash = Math.max(0, flash - dt * 2.5);
    for (const p of dust) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.97; p.vy *= 0.97; p.r += dt * 6; }
    dust = dust.filter(p => p.t < p.life);
    if (phase === 'found') updFound(dt);
  }
  // ---------- 5. Schutt wegbaggern ----------
  const cellAt = (r, c) => cells.find(q => q.r === r && q.c === c);
  const truckCell = (r, c) => truck && r === gr - 1 && ['arrive', 'park', 'pause'].includes(truck.state) && (c === truck.tx || c === truck.tx + 1);
  const passable = (r, c) => r >= 0 && c >= 0 && r < gr && c < gc && !truckCell(r, c);
  const nearTruck = () => truck && !veh.moving && veh.r >= gr - 2 && veh.c >= truck.tx - 1 && veh.c <= truck.tx + 2;
  const canUnload = () => fill >= cap || (left === 0 && fill > 0);
  function startFound() {
    phase = 'found'; idle = 0; setEngine(false, false);
    veh = newMover(gr - 2, gc - 2, Math.PI); veh.unloading = false;
    newTruck(); setWord('rubble', '0/' + totalCells); sayWord('rubble');
  }
  function newTruck() {
    truckColor = (truckColor + 1) % TIPPERS.length; let tx;
    for (let t = 0; t < 30; t++) { tx = 1 + ((Math.random() * (gc - 3)) | 0); if (!(veh.r === gr - 1 && (veh.c === tx || veh.c === tx + 1))) break; }
    truck = { tx, x: W + 10, y: (gr - 1) * G + 4, park: tx * G + 6, fill: 0, state: 'arrive', timer: 0, col: TIPPERS[truckColor] };
  }
  function work(m) {
    if (m.done || m.prog < 0.25) return;
    m.done = true;
    const q = cellAt(m.tr, m.tc);
    if (!q || q.dug) return;
    if (fill >= cap) { if (!honked) { sfx.honk(); honked = true; } return; }
    q.dug = true; left--; fill++; honked = false; sfx.clod(); setWord('rubble', (totalCells - left) + '/' + totalCells);
    const px = q.c * G + G / 2, py = q.r * G + G / 2;
    for (let i = 0; i < 14; i++) spawn(px + rnd(-10, 10), py + rnd(-10, 10), rnd(-25, 25), rnd(-30, 10), rnd(.3, .8), pick(['#8a8a8a', '#b0b0b0', '#c4b8a0']), 40);
  }
  function updFound(dt) {
    if (!veh.unloading) {
      moverUpdate(veh, dt, { passable, speed: 1.9, onProg: m => { work(m); const p = moverPos(m);
        if (Math.random() < .25) spawn(p.x - Math.cos(m.a) * 12, p.y - Math.sin(m.a) * 12, rnd(-6, 6), rnd(-6, 6), .5, 'rgba(90,80,70,.6)'); } });
      if (truck.state === 'park' && canUnload() && nearTruck()) { veh.unloading = true; sfx.pour(); }
    } else {
      const amt = Math.min(fill, cap * dt / 1.3); fill -= amt; truck.fill += amt / cap;
      const p = moverPos(veh), tx = truck.x + 23, ty = truck.y + 8;
      for (let i = 0; i < 3; i++) { const sx = p.x + rnd(-3, 3), sy = p.y + rnd(-3, 3), ex = tx + rnd(-7, 7), ey = ty + rnd(-4, 4); spawn(sx, sy, (ex - sx) / .4, (ey - sy) / .4, .4, pick(['#8a8a8a', '#b0b0b0'])); }
      if (fill <= 0.001) { fill = 0; veh.unloading = false; loads++; sfx.load(); truck.state = 'pause'; truck.timer = 0.6; }
    }
    setEngine(true, veh.moving || veh.unloading, 40);
    const t = truck; if (!t) return;
    if (t.state === 'arrive') { t.x = approach(t.x, t.park, 80 * dt); if (t.x === t.park) t.state = 'park'; }
    else if (t.state === 'pause') { t.timer -= dt; if (t.timer <= 0) { t.state = 'leave'; t.v = 10; sfx.honk(); } }
    else if (t.state === 'leave') { t.v += 90 * dt; t.x -= t.v * dt; if (t.x < -50) { if (left === 0 && fill === 0) { t.state = 'gone'; finish(); } else newTruck(); } }
  }
  function drawPad(q) { drawRubble(Q, q.c * G + 1, q.r * G + 2, G - 2, G - 3, q.seed); }   // Schutthaufen
  function finish() {
    phase = 'done'; hide('ahud'); clearTapGoal(); setEngine(false, false);
    Hof.demolishHouse(STARS, HOUSE_TYPES.length);
    setTimeout(() => {
      $('wingain').textContent = STARS;
      const row = $('gwin').querySelector('.stars'); row.innerHTML = '<i class="ico" data-ico="star"></i>'.repeat(STARS); applyIcons(row);
      show('gwin'); sfx.win(); confetti(); setTimeout(() => sayWord('demolish'), 1200);
      winTimer = setTimeout(() => goHof('abriss'), 4200);
    }, 300);
  }

  function drawBarrier(x, y) {                      // rot-weißes Absperrgitter mit Füßen
    Q('rgba(0,0,0,.22)', x + 2, y + 3, 20, 3); Q('#333', x, y + 1, 3, 3); Q('#333', x + 17, y + 1, 3, 3);
    for (let i = 0; i < 5; i++) Q(i % 2 ? '#ffffff' : '#e03a2f', x + i * 4, y - 8, 4, 6); Q('#7a0000', x, y - 9, 20, 1);
    Q('#999', x + 1, y - 3, 1, 4); Q('#999', x + 18, y - 3, 1, 4);
  }
  function draw(time) {
    if (!g) return;
    const sx = Math.round((Math.random() - 0.5) * 6 * shake), sy = Math.round((Math.random() - 0.5) * 4 * shake);
    ctx.save(); ctx.translate(sx, sy);
    ctx.drawImage(bg, 0, 0);
    const a = Math.abs(Math.sin(time / 260)) > .5, bob = Math.round(Math.abs(Math.sin(time / 220)) * 4);
    // Haus (sackt bei der Sprengung in sich zusammen: alles unterhalb des Bodens wird abgeschnitten)
    if (phase !== 'found' && phase !== 'done' && phase !== 'settle') {
      const drop = Math.round(sink * (TOWER_FLOORS * g.fh + g.d));
      ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, g.y + g.d + 1); ctx.clip();
      drawTower(Q, { x: g.x, y: g.y + drop, w: g.w, d: g.d, fh: g.fh }, { allWin: true, helipad: true, slab: false, time });
      ctx.restore();
      if (sink > 0) drawRubble(Q, g.x - 4, g.y + g.d - Math.round(sink * 14), g.w + 8, Math.round(sink * 16) + 2, 5);
    }
    if (phase === 'settle' || phase === 'found' || phase === 'done') for (const q of cells) if (!q.dug) drawPad(q);
    // Ladungen und Kabel
    if (['charge', 'fire', 'count', 'boom'].includes(phase) && sink < 0.2) {
      for (const c of charges) if (c.on) { pixLine(Q, c.x, c.y + 4, det.x + 2, det.y - 2, 1, '#c0392b'); }
      for (const c of charges) {
        if (c.on) { Q('#7a0000', c.x - 4, c.y - 5, 8, 10); Q('#e03a2f', c.x - 3, c.y - 4, 2, 8); Q('#e03a2f', c.x + 1, c.y - 4, 2, 8); if (Math.floor(time / 300) % 2) Q('#ffd23f', c.x - 1, c.y - 7, 2, 2); }
        else if (phase === 'charge') { const col = a ? 'rgba(255,210,63,.95)' : 'rgba(255,210,63,.45)'; R(col, c.x - 7, c.y - 8, 14, 2); R(col, c.x - 7, c.y + 6, 14, 2); R(col, c.x - 7, c.y - 8, 2, 16); R(col, c.x + 5, c.y - 8, 2, 16); }
      }
    }
    // Zündkasten mit T-Griff
    if (['charge', 'fire', 'count', 'boom'].includes(phase)) {
      const px = det.x, py = det.y, push = det.pressed ? 5 : 0;
      Q('rgba(0,0,0,.25)', px + 2, py + 3, 18, 6); Q('#5a3418', px, py - 8, 18, 12); Q('#8a5a2e', px + 1, py - 7, 16, 3); Q('#ffd23f', px + 5, py - 3, 8, 2);
      Q('#555', px + 8, py - 18 + push, 2, 10 - push); Q('#e03a2f', px + 2, py - 20 + push, 14, 3);
      if (phase === 'fire' && idle > 1) drawArrow(px + 6, py - 36 - bob);
    }
    // Absperrgitter
    if (phase !== 'move') for (const s of spots) {
      if (s.on) { if (phase !== 'found' && phase !== 'done') drawBarrier(s.x, s.y); }
      else if (phase === 'barrier') { const col = a ? 'rgba(255,210,63,.9)' : 'rgba(255,210,63,.4)'; R(col, s.x - 2, s.y - 10, 24, 2); R(col, s.x - 2, s.y + 4, 24, 2); R(col, s.x - 2, s.y - 10, 2, 16); R(col, s.x + 20, s.y - 10, 2, 16); }
    }
    if (phase === 'barrier' && idle > 2) { const s = spots.find(q => !q.on); if (s) drawArrow(s.x + 7, s.y - 26 - bob); }
    if (phase === 'charge' && idle > 2) { const c = charges.find(q => !q.on); if (c) drawArrow(c.x - 3, c.y - 24 - bob); }
    if (phase === 'move') drawMove(time);
    if (veh) {
      if (truck && truck.state !== 'gone') drawTipper(truck.x, truck.y, truck.fill, truck.col);
      drawMover(veh, EXCAVATOR, time);
      if (fill > 0) { const p = moverPos(veh), fx = p.x + Math.cos(veh.a) * 12, fy = p.y + Math.sin(veh.a) * 12, n = Math.ceil(4 * fill / cap);
        R('#6a6058', fx - 4, fy - 4, 8, 8); R('#a8a8a8', fx - 3, fy - 3 - n, 6, 3 + n); }
      if (phase === 'found' && truck && canUnload() && truck.state === 'park' && !veh.unloading) drawArrow(Math.round(truck.x + 16), Math.round(truck.y - 12 - bob));
      else if (phase === 'found' && !veh.moving && idle > 1.5) { const q = cells.find(o => !o.dug); if (q) drawArrow(q.c * G + 9, Math.round(q.r * G - 14 - bob)); }
      if (phase === 'found') { const p = moverPos(veh); for (let i = 0; i < cap; i++) R(i < Math.round(fill) ? '#ffd23f' : 'rgba(0,0,0,.35)', Math.round(p.x - cap * 2 + i * 4), Math.round(p.y - 24), 3, 3); }
    }
    // Staubwolke
    for (const p of dust) { const al = Math.max(0, 1 - p.t / p.life) * 0.55; ctx.fillStyle = `rgba(190,180,165,${al.toFixed(2)})`; const r = Math.round(p.r); ctx.fillRect(Math.round(p.x - r), Math.round(p.y - r), 2 * r, 2 * r); }
    ctx.restore();
    if (flash > 0) { ctx.fillStyle = `rgba(255,240,200,${(flash * 0.8).toFixed(2)})`; ctx.fillRect(0, 0, W, H); }
    if (phase === 'count' && cd.n > 0) { const k = Math.max(6, Math.round(Math.min(W, H) / 22)); R('rgba(0,0,0,.35)', W / 2 - 3 * k, H / 2 - 4 * k, 6 * k, 8 * k); bigDigit(cd.n, Math.round(W / 2), Math.round(H / 2), k); }
  }
  function resize() { layout(false); }
  function exit() { clearTimeout(winTimer); setEngine(false, false); }
  return { enter, update, draw, resize, exit, onPointer, _dbg: () => ({ phase, packed, n: queue.length, van: van.state, spots: spots.map(s => ({ x: s.x, y: s.y, on: s.on })), charges: charges.map(c => ({ x: c.x, y: c.y, on: c.on })), det,
    left, fill, cap, veh: veh && { r: veh.r, c: veh.c, moving: veh.moving }, truck: truck && { tx: truck.tx, state: truck.state }, todo: cells.filter(q => !q.dug).map(q => [q.r, q.c]) }) };
})();
startLoop(Abriss);
addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
