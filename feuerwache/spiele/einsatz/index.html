<script>
/* =====================================================================
   FEUERWEHR-EINSATZ (eine Szene je Einsatz, ?e=katze). Kommt aus der Wache, geht danach zurück (#einsatz).
   Das Feuerwehrauto kommt mit Blaulicht angefahren. Unten die Werkzeugleiste: das richtige Werkzeug antippen.
   Falsches Werkzeug = lustige Reaktion („Das passt nicht“), nach zwei Versuchen leuchtet das richtige. Kein Scheitern.
   Das Auto hält, die Tür geht auf, das Kind im Feuerwehranzug steigt aus. Erst dann die Werkzeugleiste (Hinweis spät).
   KATZE IM BAUM (Drehleiter): Leiter wählen → Stützen raus, Kind steigt in den Korb. Korb mit dem Finger steuern (ziehen/tippen).
   Die Katze sitzt erst unten im Baum und klettert höher, sobald der Korb nahe kommt (3 Stellen); ganz oben springt sie in den Korb.
   Korb fährt zurück, das Kind bringt die Katze dem Mädchen.
   MÜLLTONNE BRENNT (?e=muell, Löschfahrzeug): Schlauch wählen → Kind rollt den Schlauch vom Auto zur Spritzstelle. Dann mit dem Finger
   auf das Feuer zielen (halten/ziehen oder tippen): Wasser fliegt im Bogen, jeder Tropfen im Feuer macht es kleiner (fire.hp). Aus → Dampf, „Feuer aus!“,
   der Nachbar bedankt sich. Löschen (Zielen, Tropfen, Treffer) gilt für alle Feuer: `fires` = Liste { x, y (Fuß der Flammen), w, h, hp, dmg }.
   HAUS BRENNT (?e=haus, Löschfahrzeug): Einfamilienhaus mit 2 Etagen, aus 3 Fenstern schlagen Flammen, Rauch über dem Dach. Die Familie (Mama, Kind, Hund)
   steht schon sicher am Gehweg. Jedes Fenster einzeln löschen; gelöschte Fenster sind verrußt. Alle aus → Rauch wird weiß, „Feuer aus!“, die Familie bedankt sich.
   BAUM AUF DER STRASSE (?e=baum, Löschfahrzeug, Kettensäge): Ein umgestürzter Baum liegt auf der unteren Fahrspur, rechts wartet ein Auto.
   3 gelbe Schnittlinien am Stamm: über die Linie wischen (hin und her) oder antippen = sägen (Sägespäne, Brummen); jede Linie durch = Stamm bricht dort.
   Dann die 4 Stücke (3 Stammstücke, Krone) antippen → sie kommen auf die Wiese am Rand (Holzstapel). Straße frei → das Auto fährt vorbei, hupt, „Danke!“.
   Geschafft: 1 Stern (Hof.addStars), fire.missions + 1. Danach fährt das Auto weg, zurück in die Wache.
   ===================================================================== */
window.HOF_URL = '../../index.html';
document.querySelectorAll('[data-home]').forEach(b => b.addEventListener('click', () => goHof('einsatz')));
const KEY = EINSAETZE[new URLSearchParams(location.search).get('e')] ? new URLSearchParams(location.search).get('e') : 'katze';
const E = EINSAETZE[KEY];
const MUELL = KEY === 'muell', HAUS = KEY === 'haus', BAUM = KEY === 'baum', FIRE = MUELL || HAUS;   // FIRE = Einsatz mit Löschen

const Einsatz = (() => {
  const L = 80, WD = 30, GIRL = { h: '#e0a040', r: '#ff6b8a', w: '#ffffff', b: '#6a4c93' };
  let roadY, tree, cat, spots, truck, girl, bar, phase, t = 0, wrong = 0, react = null, idle = 0, meow = 3, hearts = [], drops = [], starGiven = false;
  let BAR = 54, RH = 48, basket = null, target = null, pivot, Lmax, kid = { x: 0, y: 0, show: false, step: false };
  let trunk = null, marks = [], pieces = [], car = null, sawT = 0, walkTo = null;   // Baum: Stamm, Schnittlinien, Stücke, wartendes Auto
  let bins = null, fires = [], house = null, family = [], sprayAt = null, aim = null, spraying = 0, steam = [], backFrom = null, owner = null;   // Mülltonne: Tonnen, Feuer { hp }, Spritzstelle, Zielpunkt
  const OWNER = { h: '#cfcfcf', r: '#3f8f37', w: '#ffffff', b: '#5a4a3a' }, MOM = { h: '#5a3b1c', r: '#8e44ad', w: '#ffffff', b: '#2c3e50' }, CHILD = { h: '#e0a040', r: '#ffd23f', w: '#ffffff', b: '#3fa9f5' };
  function setWord(key) { const el = $('iword'); el.dataset.say = key; el.querySelector('.word').textContent = WORDS[key][0]; }
  function enter() {
    Hof.load(); layout(true);
    const short = H < 260; BAR = short ? 46 : 54; RH = short ? G + 10 : 2 * G;   // niedriger Bildschirm: Leiste und Straße schmaler

    const r = Math.round(clamp(Math.min((roadY - 40) * 0.34, (roadY - 76) / 2), 14, 58));   // Katze oben muss ins Bild passen

    spots = [                                          // Katze klettert höher, sobald der Korb näher kommt: unten links, Mitte rechts, ganz oben
      { x: Math.round(tree.x - r * 0.55 - 10), y: Math.round(tree.y + r * 0.3 - 18) },
      { x: Math.round(tree.x + r * 0.35 - 10), y: Math.round(tree.y - r * 0.2 - 18) },
      { x: Math.round(tree.x - 10), y: Math.round(tree.y - r - 12) }];
    cat = { x: spots[0].x, y: spots[0].y, i: 0, s: 2, on: 'tree', anim: null };
    girl = { x: tree.x - r - 18, y: roadY - 4 };
    truck = { x: -L - 30, y: roadY + Math.round(RH / 2 - WD / 2), park: Math.round(tree.x - L * 0.55), deployed: false };
    if (MUELL) {                                       // drei Tonnen am Gehweg, die mittlere brennt; Auto hält links davon
      const bx = Math.round(W * 0.68);
      bins = [{ x: bx - 26, c: '#2a6fdb', d: '#173f80' }, { x: bx, c: '#6a6e72', d: '#4a4d50', burn: true }, { x: bx + 26, c: '#8a5a2b', d: '#5a3b1c' }].map(b => Object.assign(b, { y: roadY - 4 }));
      fires = [{ x: bx, y: roadY - 4 - 26, w: 22, h: 42, hp: 1, dmg: 0.006 }];
      truck.park = Math.max(4, bx - L - 56); sprayAt = { x: bx - 58, y: roadY - 4 };
      owner = { x: Math.max(18, Math.round(Math.min(W * 0.16, truck.park - 10))), y: roadY - 4 };
      cat.on = 'none'; girl = owner;
    }
    if (HAUS) {                                        // Einfamilienhaus rechts, Familie links, Auto dazwischen
      const hw = Math.round(clamp(W * 0.36, 96, 160)), hx = Math.round(Math.min(W - hw - 8, W * 0.64 - hw / 2)), fl = Math.round(clamp((roadY - 70) / 3.2, 26, 40));
      house = { x: hx, w: hw, fl, base: roadY - 6, roof: Math.round(fl * 1.1) };
      const ww = Math.round(hw * 0.2), wh = Math.round(fl * 0.55), wins = [];
      for (const [fi, cx] of [[0, 0.2], [0, 0.8], [1, 0.2], [1, 0.8]]) wins.push({ x: Math.round(hx + hw * cx - ww / 2), y: Math.round(house.base - (fi + 1) * fl + fl * 0.22), w: ww, h: wh });
      house.wins = wins;
      const burn = [0, 2, 3];                         // unten links, beide oben
      fires = burn.map(i => { const w = wins[i]; w.fire = true; return { win: w, x: w.x + w.w / 2, y: w.y + w.h, w: w.w + 6, h: Math.round(fl * 0.9), hp: 1, dmg: 0.008 }; });
      truck.park = Math.max(4, hx - L - 22); sprayAt = { x: Math.max(30, hx - 34), y: roadY - 4 };
      family = [{ x: 0, y: roadY - 4, pal: MOM }, { x: 0, y: roadY - 4, pal: CHILD }];
      const fx = Math.max(16, Math.round(Math.min(W * 0.1, truck.park - 20))); family[0].x = fx; family[1].x = fx + 20;
      owner = { x: fx + 10, y: roadY - 4 }; cat.on = 'none'; girl = owner;
    }
    if (BAUM) {                                        // Stamm liegt auf der unteren Spur (Wurzel links, Krone rechts), Auto wartet rechts dahinter
      const x0 = Math.round(W * 0.4), ce = Math.round(W * 0.8), cr = Math.round(clamp(RH * 0.55, 16, 28)), x1 = ce - 2 * cr;
      trunk = { x0, x1, ce, cr, y: roadY + Math.round(RH * 0.72), th: Math.max(8, Math.round(RH * 0.24)) };
      marks = [0, 1, 2].map(i => ({ x: Math.round(x0 + 10 + (x1 - x0 - 14) * (i + 0.5) / 3), p: 0, done: false }));
      const b = [x0 - 4, ...marks.map(m => m.x), ce];
      pieces = b.slice(0, -1).map((a, i) => ({ a, b: b[i + 1], crown: i === 3, dx: 0, dy: 0, gone: false, anim: null }));
      truck.y = roadY + 1; truck.park = Math.max(4, x0 - L - 26);
      car = { x: Math.min(W - 24, ce + 26), y: roadY + RH - 3, go: false };
      cat.on = 'none'; owner = { x: car.x, y: car.y - 16 }; girl = owner;
    }
    pivot = { x: truck.park + Math.round(L * 0.32), y: truck.y + WD / 2 };
    Lmax = Math.max(...spots.map(p => Math.hypot(p.x + 10 - pivot.x, p.y + 9 - pivot.y))) + 30;
    const n = E.tools.length, gap = W < 240 ? 6 : 10, sw = Math.min(46, Math.floor((W - 12 - (n - 1) * gap) / n)), x0 = Math.round(W / 2 - (n * sw + (n - 1) * gap) / 2);   // schmal: Kästchen kleiner
    bar = E.tools.map((k, i) => ({ k, x: x0 + i * (sw + gap), y: H - BAR + Math.round((BAR - sw) / 2), w: sw, h: sw }));
    paint();
    phase = 'arrive'; t = 0; wrong = 0; react = null; idle = 0; starGiven = false; basket = null; target = null; kid.show = false; aim = null; spraying = 0; steam = [];
    show('ihud'); setWord(E.word); tatuta();
    setTimeout(() => sayWord(E.word), 500);
  }
  function paint() {
    for (let r = 0; r < gr; r++) for (let c = 0; c < gc; c++) for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) bctx.drawImage(pick(tiles.grass), c*G+i*T, r*G+j*T);
    const B = (col,x,y,w,h)=>{bctx.fillStyle=col;bctx.fillRect(x,y,w,h);};
    for (let y = roadY; y < roadY + RH; y += T) for (let x = 0; x < W; x += T) bctx.drawImage(pick(tiles.road), x, y);
    B('#cfc8b8', 0, roadY - 3, W, 3); B('#cfc8b8', 0, roadY + RH, W, 3);   // Bordstein
    { const hw = Math.min(90, Math.round(W * 0.22)), hx = Math.round(Math.min(W * 0.12, tree.x - tree.r - 50 - hw)), hy = roadY - 74, rz = 34, fz = 30;   // Haus des Mädchens
      if (hx > 2 && !MUELL && !BAUM && (!HAUS || hx + hw < house.x - 30)) {   // beim Hausbrand als Nachbarhaus, wenn Platz ist
        B('rgba(0,0,0,.25)', hx + 3, hy + 5, hw, rz + fz);
        B('#7a2218', hx - 2, hy, hw + 4, rz); B('#b5442e', hx, hy + 1, hw, rz - 2); for (let yy = hy + 4; yy < hy + rz - 2; yy += 5) B('#9a3826', hx, yy, hw, 1);
        B('#7a2218', hx, hy + Math.round(rz / 2) - 1, hw, 2);                                            // First
        B('#f3e3b8', hx, hy + rz, hw, fz); B('#cdb27a', hx, hy + rz + fz - 2, hw, 2);
        B('#6b4423', hx + Math.round(hw / 2) - 6, hy + rz + 8, 12, fz - 8); B('#ffd23f', hx + Math.round(hw / 2) + 3, hy + rz + 18, 2, 2);   // Tür
        for (const wx of [hx + 8, hx + hw - 24]) { B('#5a3b1c', wx, hy + rz + 7, 16, 12); B('#9fe3ff', wx + 2, hy + rz + 9, 12, 8); B('#5a3b1c', wx + 7, hy + rz + 9, 2, 8); }
      } }
    if (BAUM) {                                        // Wiese oben mit ein paar Bäumen; rechts oben ein kleines Haus
      for (const [fx, r] of [[0.12, 16], [0.24, 12], [0.58, 14]]) { const x = Math.round(W * fx), y = roadY - 46;
        B('#4a2e14', x - 3, y + r - 4, 6, 34 - r); B('rgba(0,0,0,.2)', x - r + 4, roadY - 12, 2 * r - 4, 5);
        for (let yy = -r; yy <= r; yy += 2) { const hw = Math.round(Math.sqrt(r * r - yy * yy)); B('#24561f', x - hw, y + yy, 2 * hw, 2); if (hw > 3) B('#3f8f37', x - hw + 2, y + yy, 2 * hw - 4, 2); } }
      const t = trunk, hx = Math.round(t.x0 - 18), hy = roadY + Math.round(RH * 0.45);   // Wurzelteller und Erdloch am Straßenrand
      B('#5a4030', hx - 4, roadY - 10, 18, 9); B('#3a2a20', hx - 2, roadY - 8, 14, 5);
      B('#1f2b33', 0, H - BAR, W, BAR); B('#33444f', 0, H - BAR, W, 2);
      return;
    }
    if (HAUS) {                                        // Einfamilienhaus von vorne: 2 Etagen, Satteldach, Tür, 4 Fenster (Feuer in draw)
      const h = house, top = h.base - 2 * h.fl;
      B('rgba(0,0,0,.25)', h.x + 4, top + 4, h.w, 2 * h.fl);
      B('#e9dcc0', h.x, top, h.w, 2 * h.fl); B('#d6c7a6', h.x, top + h.fl - 1, h.w, 2); B('#cdb27a', h.x, h.base - 3, h.w, 3);
      for (let i = 0; i < h.roof; i++) { const k = i / h.roof, ww = Math.round(h.w + 12 - (h.w + 12) * k * 0.9); B(i % 4 === 3 ? '#8e2f22' : '#b5442e', Math.round(h.x + h.w / 2 - ww / 2), top - i - 1, ww, 1); }   // Dach
      B('#7a2218', h.x - 6, top - 2, h.w + 12, 3); B('#6b6b6b', h.x + Math.round(h.w * 0.7), top - h.roof * 0.7, 8, h.roof * 0.55);   // Traufe, Schornstein
      const dw = Math.round(h.w * 0.16), dx = Math.round(h.x + h.w / 2 - dw / 2); B('#6b4423', dx, h.base - Math.round(h.fl * 0.75), dw, Math.round(h.fl * 0.75) - 3); B('#ffd23f', dx + dw - 4, h.base - Math.round(h.fl * 0.4), 2, 2);   // Tür
      for (const w of h.wins) { B('#f2f2f2', w.x - 2, w.y - 2, w.w + 4, w.h + 4); if (!w.fire) { B('#6cc4f0', w.x, w.y, w.w, w.h); B('#9fe3ff', w.x, w.y, w.w, Math.round(w.h / 3)); B('#f2f2f2', w.x + Math.round(w.w / 2) - 1, w.y, 2, w.h); } }
      B('#24561f', h.x - 4, h.base - 10, 10, 8); B('#3f8f37', h.x + h.w - 8, h.base - 10, 12, 8);   // Büsche
      B('#1f2b33', 0, H - BAR, W, BAR); B('#33444f', 0, H - BAR, W, 2);
      return;
    }
    if (MUELL) {                                       // Haus des Nachbarn links, Hecke hinter den Tonnen
      const hw = Math.min(90, Math.round(W * 0.22)), hx = 6, hy = roadY - 74, rz = 34, fz = 30;
      B('rgba(0,0,0,.25)', hx + 3, hy + 5, hw, rz + fz); B('#3a5f8f', hx - 2, hy, hw + 4, rz); B('#4f79b0', hx, hy + 1, hw, rz - 2); for (let yy = hy + 4; yy < hy + rz - 2; yy += 5) B('#44699c', hx, yy, hw, 1);
      B('#3a5f8f', hx, hy + Math.round(rz / 2) - 1, hw, 2); B('#f2efe6', hx, hy + rz, hw, fz); B('#cdb27a', hx, hy + rz + fz - 2, hw, 2);
      B('#6b4423', hx + Math.round(hw / 2) - 6, hy + rz + 8, 12, fz - 8); B('#ffd23f', hx + Math.round(hw / 2) + 3, hy + rz + 18, 2, 2);
      for (const wx of [hx + 8, hx + hw - 24]) { B('#5a3b1c', wx, hy + rz + 7, 16, 12); B('#9fe3ff', wx + 2, hy + rz + 9, 12, 8); B('#5a3b1c', wx + 7, hy + rz + 9, 2, 8); }
      const hx2 = bins[0].x - 20, hw2 = bins[2].x + 20 - hx2;
      B('#24561f', hx2, roadY - 46, hw2, 16); B('#3f8f37', hx2 + 1, roadY - 45, hw2 - 2, 12); for (let i = 0; i < hw2; i += 7) B('#5cb64f', hx2 + i + 2, roadY - 44 + (i % 3) * 3, 4, 3);   // Hecke
      B('#1f2b33', 0, H - BAR, W, BAR); B('#33444f', 0, H - BAR, W, 2);
      return;
    }
    // Baum: Stamm und runde Krone aus Pixelreihen
    const { x, y, r } = tree;
    B('#4a2e14', x - 5, y + Math.round(r * 0.5), 10, roadY - 4 - y - Math.round(r * 0.5)); B('#6b4423', x - 4, y + Math.round(r * 0.5), 6, roadY - 4 - y - Math.round(r * 0.5));
    B('rgba(0,0,0,.2)', x - r + 6, roadY - 10, 2 * r - 6, 8);
    for (let yy = -r; yy <= r; yy += 2) { const hw = Math.round(Math.sqrt(r * r - yy * yy)); B('#24561f', x - hw, y + yy, 2 * hw, 2); if (hw > 3) B('#3f8f37', x - hw + 2, y + yy, 2 * hw - 4, 2); }
    for (let k = 0; k < 14; k++) { const a = k * 2.4, d = r * 0.55 * ((k * 37) % 10) / 10; B('#5cb64f', Math.round(x + Math.cos(a) * d) - 3, Math.round(y + Math.sin(a) * d) - 3, 6, 4); }
    B('#1f2b33', 0, H - BAR, W, BAR); B('#33444f', 0, H - BAR, W, 2);   // Werkzeugleiste
  }
  function tatuta() { for (let k = 0; k < 3; k++) { tone(466, .32, 'square', .05, k * .7); tone(622, .32, 'square', .05, k * .7 + .35); } }
  const miau = () => { tone(950, .35, 'sine', .06, 0, 600); };
  const go = p => { phase = p; t = 0; };
  const door = () => ({ x: truck.x + L - 16, y: truck.y + WD / 2 });            // Fahrertür
  const stand = () => ({ x: truck.x + L - 16, y: truck.y - 4 });                  // neben dem Fahrerhaus auf dem Gehweg
  const lerp = (p, q, k) => ({ x: p.x + (q.x - p.x) * k, y: p.y + (q.y - p.y) * k });
  const catC = () => ({ x: cat.x + 10, y: cat.y + 9 });
  const nozzle = () => ({ x: kid.x + 12, y: kid.y - 14 });                          // Strahlrohr in der Hand des Kindes
  function onPointer(type, x, y) {
    idle = 0;
    if (phase === 'saw') {                            // Kettensäge: über die Schnittlinie wischen oder antippen
      if ((type === 'down' || type === 'move') && y < H - BAR && Math.abs(y - trunk.y) < 34) {
        const m = marks.filter(m => !m.done).sort((a, b) => Math.abs(a.x - x) - Math.abs(b.x - x))[0];
        if (m && Math.abs(m.x - x) < 26) {
          const d = type === 'down' ? 40 : Math.min(30, Math.hypot(x - (m.lx ?? x), y - (m.ly ?? y)));
          m.lx = x; m.ly = y; if (d > 0) { m.p = Math.min(1, m.p + d * 0.003); sawT = 0.35; walkTo = m.x - 8; m.act = true; }
          for (const o of marks) if (o !== m) o.act = false;
        } }
      if (type === 'up') for (const m of marks) { m.lx = m.ly = undefined; }
      return true; }
    if (phase === 'clear') {                          // Stücke antippen → an den Rand räumen
      if (type === 'down') { const pc = pieces.find(q => !q.gone && !q.anim && x > q.a - 6 && x < (q.crown ? trunk.ce : q.b) + 6 && Math.abs(y - trunk.y) < (q.crown ? trunk.cr + 10 : 26));
        if (pc) { pc.anim = { t: 0 }; walkTo = (pc.a + pc.b) / 2; sfx.click(); setWord(pc.crown ? 'tree' : 'wood'); sayWord(pc.crown ? 'tree' : 'wood'); } }
      return true; }
    if (phase === 'spray') {                          // Schlauch: auf das Feuer zielen (halten/ziehen), Tippen spritzt kurz
      if ((type === 'down' || type === 'move') && y < H - BAR) { aim = { x, y }; spraying = type === 'down' ? Math.max(spraying, 0.7) : Math.max(spraying, 0.25); }
      if (type === 'up') spraying = Math.min(spraying, 0.35);
      return true; }
    if (phase === 'steer') {                          // Korb steuern: Finger ziehen oder hintippen
      if ((type === 'down' || type === 'move') && y < H - BAR) target = { x, y };
