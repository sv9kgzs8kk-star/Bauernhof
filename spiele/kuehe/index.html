<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<script>
/* Zeigt Fehler direkt auf dem Bildschirm an (es gibt auf dem iPad keine Konsole) */
window.addEventListener('error', function (e) {
  var d = document.getElementById('fehler');
  if (!d) { d = document.createElement('pre'); d.id = 'fehler'; (document.body || document.documentElement).appendChild(d);
    d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;margin:0;padding:10px;background:#b00020;color:#fff;font:15px/1.3 monospace;z-index:999;white-space:pre-wrap'; }
  var t = e.target, msg;
  if (t && t !== window && (t.src || t.href)) msg = 'Datei nicht gefunden: ' + (t.src || t.href);
  else msg = 'Fehler: ' + e.message + (e.filename ? '  (' + e.filename.split('/').slice(-2).join('/') + ', Zeile ' + e.lineno + ')' : '');
  d.textContent += msg + '\n';
}, true);
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bauernhof">

<title>Kühe melken</title>
</head>
<body>
<canvas id="game"></canvas>

<div id="khud" class="hud gamehud hidden">
  <div class="pill" id="milkpill"><i class="ico" data-ico="milk"></i> <span id="milkcount">0/1</span></div>
  <div class="pill" id="haypill"><i class="ico" data-ico="hay"></i> <span id="haycount">0</span></div>
  <button class="pill btn" id="pausebtn" aria-label="Pause"><i class="ico" data-ico="pause"></i></button>
</div>

<div id="gpause" class="overlay hidden">
  <div class="row">
    <button class="home" data-home aria-label="Zum Hof"><i class="ico" data-ico="home"></i></button>
    <button class="big" id="gresume" aria-label="Weiter"><svg width="70" height="70" viewBox="0 0 10 10"><path d="M2 1 L9 5 L2 9 Z" fill="#5a3d00"/></svg></button>
  </div>
  <button class="mute" aria-label="Ton"><i class="ico" data-ico="sound"></i></button>
</div>

<div id="gwin" class="overlay hidden">
  <div class="stars"></div>
  <div class="row">
    <div class="pill gain" data-say="milk" style="cursor:pointer"><i class="ico" data-ico="milk"></i> +<span id="wingain">1</span> <span class="word">MILCH</span></div>
  </div>
  <button class="home" data-home aria-label="Zum Hof"><i class="ico" data-ico="home"></i></button>
</div>

<script>window.NO_PAD = true;   // hier wird nur getippt</script>
<script src="../../gemeinsam/sterne.js?v=20261123b"></script>
<script src="../../gemeinsam/basis.js?v=20261123b"></script>
<script>
/* =====================================================================
   MINISPIEL: KÜHE MELKEN
   Jede Kuh kommt herein → Heuballen in die Raufe tippen → Kuh frisst →
   ans Euter tippen, bis der Eimer voll ist → 1 Milch. Jede Kuh frisst 1 Heuballen.
   ===================================================================== */
window.HOF_URL = '../../hof.html';
const save = Hof.save;
const goHome = () => goHof('kuehe');
document.querySelectorAll('[data-home]').forEach(b => b.addEventListener('click', goHome));
const MAX_COWS = 4, TAPS = 8;
const cowPrice = () => save.cows >= MAX_COWS ? null : 10 + 5 * save.cows;   // 10, 15, 20, 25 Sterne

const Kuehe = (() => {
  let state = 'start', cows = 0, idx = 0, milked = 0, cow = null, cans = [], flying = [], winTimer = null, saidMilk = false;
  // Die Szene wird in einem festen Bühnenraster (DW×DH) gezeichnet und auf den Bildschirm vergrößert,
  // damit Kuh, Raufe und Eimer groß sind und kein leerer Raum bleibt.
  const DW = 200, DH = 140, FLOOR = 62;
  let S = 1, OX = 0, OY = 0;
  const CX = 100, CY = 92;
  const MANGER = { x: 133, y: 78, w: 22, h: 14 }, STACK = { x: 164, y: 96, w: 34, h: 36 };
  const cat = { x: 44, y: 108, hop: 0 };
  const sp = (x, y, vx, vy, life, col, grav = 0) => spawn(OX + x*S, OY + y*S, vx*S, vy*S, life, col, grav*S);

  function build() {
    layout(true);
    const m = Math.min(W / DW, H / DH);
    S = m >= 2 ? Math.floor(m) : m;                 // ganze Vergrößerung = scharfe Pixel (iPad quer)
    OX = Math.round((W - DW*S) / 2); OY = Math.round((H - DH*S) * 0.8);   // hochkant: mehr Wand oben, weniger leerer Boden
    const B = (col,x,y,w,h)=>{bctx.fillStyle=col;bctx.fillRect(x,y,w,h);};
    bctx.imageSmoothingEnabled = false;
    bctx.setTransform(S, 0, 0, S, OX, OY);
    const x0 = Math.floor(-OX/S) - 1, x1 = Math.ceil((W-OX)/S) + 1, y0 = Math.floor(-OY/S) - 1, y1 = Math.ceil((H-OY)/S) + 1;
    // Bretterwand
    B('#8a5a2b', x0, y0, x1-x0, FLOOR-y0);
    for (let y = FLOOR - 8; y > y0; y -= 8) { B('#6b4423', x0, y, x1-x0, 1); B('#a0673a', x0, y+1, x1-x0, 1); }
    for (let x = 0; x > x0; x -= 40) B('#5a3b1c', x, y0, 3, FLOOR-y0);
    for (let x = 40; x < x1; x += 40) B('#5a3b1c', x, y0, 3, FLOOR-y0);
    // Fenster mit Himmel und Wolke
    B('#5a3b1c', 50, 10, 36, 28); B('#9fe3ff', 53, 13, 30, 22); B('#c8f0ff', 53, 13, 30, 6);
    B('#ffffff', 58, 20, 10, 3); B('#ffffff', 60, 18, 6, 2); B('#7ec850', 53, 31, 30, 4);
    B('#5a3b1c', 67, 13, 2, 22); B('#5a3b1c', 53, 23, 30, 2); B('#a0673a', 49, 37, 38, 3);
    // Stalltür links (dahinter warten die nächsten Kühe)
    B('#5a3b1c', 2, 16, 36, FLOOR-16); B('#2a1a0c', 5, 19, 30, FLOOR-19);
    B('#a0673a', -6, 18, 8, FLOOR-18); for (let y = 20; y < FLOOR; y += 6) B('#6b4423', -6, y, 8, 1);   // offener Torflügel
    B('#9a9a9a', 16, 9, 8, 2); B('#9a9a9a', 16, 9, 2, 6); B('#9a9a9a', 22, 9, 2, 6);                 // Hufeisen
    // Mistgabel an der Wand
    B('#7a4a22', 186, 14, 2, 48); B('#9a9a9a', 182, 12, 10, 2); for (const tx of [182, 186, 190]) B('#9a9a9a', tx, 6, 2, 7);
    // Leiste unten an der Wand
    B('#5a3b1c', x0, FLOOR - 6, x1-x0, 2); B('#5a3b1c', x0, FLOOR, x1-x0, 2);
    // Stroh-Boden
    for (let y = FLOOR + 2; y < y1; y += T) for (let x = x0 - (x0 % T) - T; x < x1; x += T) bctx.drawImage(pick(tiles.straw), x, y);
    // Pfosten der Melkbox
    B('#5a3b1c', 62, FLOOR - 14, 4, 46); B('#7a4a22', 63, FLOOR - 14, 2, 46);
    B('#5a3b1c', 160, FLOOR - 14, 4, 30); B('#7a4a22', 161, FLOOR - 14, 2, 30);
    B('rgba(0,0,0,.15)', 62, FLOOR + 32, 4, 2);
    bctx.setTransform(1, 0, 0, 1, 0, 0);
  }
  function hud() {
    $('milkcount').textContent = milked + '/' + cows; $('haycount').textContent = save.hay;
  }

  /* --- Ablauf --- */
  function nextCow() {
    if (idx >= cows) return finish();
    cow = { x: -40, phase: 'in', fill: 0, teat: 0, eat: 0, hay: 0, walk: 0, tapCd: 0, shake: 0 };
  }
  function finish() {
    if (state === 'won') return;
    state = 'won';
    Hof.addMilk(milked);
    setTimeout(() => {
      hide('khud'); $('wingain').textContent = milked;
      const row = $('gwin').querySelector('.stars');
      row.innerHTML = milked ? '<i class="ico" data-ico="milk"></i>'.repeat(milked) : '<i class="ico" data-ico="hay"></i>';
      applyIcons(row); show('gwin'); sfx.win(); confetti();
      setTimeout(() => sayWord('milk'), 1500);
      winTimer = setTimeout(goHome, 4000);
    }, 600);
  }

  function enter() {
    build(); state = 'start'; hide('khud');
    const p = cowPrice();
    if (save.cows === 0 || save.hay === 0 || (p != null && save.stars >= p)) {
      openShop({
        stats: () => [['cow', save.cows, 'cow', 'shopcow'], ['star', save.stars, 'star', 'shopstar'], ['hay', save.hay, 'hay', 'shophay']],
        item: { word: WORDS.cow[0], sayKey: 'cow', price: cowPrice,
                draw: el => { el.innerHTML = '<i class="ico" data-ico="cow"></i>'; applyIcons(el); } },
        canPlay: () => save.cows > 0 && save.hay > 0,
        missingId: () => save.cows === 0 ? 'shopbuy' : 'shophay',
        onBlocked: () => { if (save.cows > 0) sayWord('hay'); },
        onBuy: () => { save.cows++; Hof.persist(); sfx.moo(); },
        onPlay: start, onHome: goHome
      });
    } else start();
  }
  function start() {
    cows = Math.min(save.cows, MAX_COWS); idx = 0; milked = 0; cans = [];
    state = 'play'; show('khud'); hud(); nextCow();
  }
  $('pausebtn').addEventListener('click', () => { if (state !== 'play') return; state = 'pause'; show('gpause'); });
  $('gresume').addEventListener('click', () => { hide('gpause'); state = 'play'; });

  /* --- Antippen --- */
  const inRect = (x, y, r, pad = 8) => x > r.x - pad && x < r.x + r.w + pad && y > r.y - pad && y < r.y + r.h + pad;
  function udderRect() { return { x: cow.x + 8, y: CY + 4, w: 28, h: 22 }; }
  function onPointer(type, x, y) {
    if (type !== 'down' || state !== 'play' || !cow) return true;
    x = (x - OX) / S; y = (y - OY) / S;
    if (inRect(x, y, { x: cat.x - 2, y: cat.y - 8, w: 18, h: 18 }, 4) && cat.hop <= 0) {   // Katze springt
      cat.hop = 0.5; for (let i = 0; i < 8; i++) sp(cat.x + 7, cat.y - 4, rnd(-20, 20), rnd(-40, -20), .7, pick(['#ff6b8a', '#ff9ab0']));
      return true;
    }
    if (cow.phase === 'hungry' && (inRect(x, y, STACK, 12) || inRect(x, y, MANGER, 12) || inRect(x, y, { x: cow.x + 40, y: CY - 30, w: 30, h: 30 }))) {
      if (save.hay <= 0) { sfx.bonk(); shakeEl($('haypill')); sayWord('hay'); cow.phase = 'out'; cow.sad = true; return true; }
      Hof.addHay(-1); hud(); sfx.load();
      flying.push({ x: STACK.x + 10, y: STACK.y + 10, tx: MANGER.x + 4, ty: MANGER.y + 3, t: 0 });
      cow.phase = 'feed'; cow.eat = 0;
    } else if (cow.phase === 'milk' && inRect(x, y, udderRect(), 18)) {
      if (cow.tapCd > 0) return true;
      cow.tapCd = 0.12; cow.fill = Math.min(TAPS, cow.fill + 1); cow.teat = (cow.teat + 1) % 4; sfx.squirt();
      const tx = cow.x + 15 + cow.teat * 4, ty = CY + 26;
      for (let i = 0; i < 6; i++) sp(tx + rnd(-1, 1), ty, rnd(-4, 4), rnd(40, 70), .25, pick(['#ffffff', '#e8f4ff']));
      if (cow.fill >= TAPS) {
        milked++; hud(); bump($('milkpill')); sfx.load(); sfx.moo();
        cans.push({ x: cow.x + 20, y: CY + 34 });
        for (let i = 0; i < 30; i++) sp(cow.x + 22, CY + 30, rnd(-30, 30), rnd(-50, -10), rnd(.5, 1), pick(['#ffd23f', '#fff', '#7cc0f0']), 60);
        cow.phase = 'out';
      }
    }
    return true;
  }

  /* --- Ablauf pro Bild --- */
  function update(dt) {
    if (state !== 'play' || !cow) return;
    cow.tapCd -= dt; cow.shake = Math.max(0, cow.shake - dt); cat.hop = Math.max(0, cat.hop - dt);
    const target = CX - 26;
    if (cow.phase === 'in') {
      cow.walk += dt; cow.x = Math.min(target, cow.x + 40*dt);
      if (cow.x >= target) { cow.phase = 'hungry'; sfx.moo(); sayWord('hay'); }
    } else if (cow.phase === 'feed') {
      cow.eat += dt; if (Math.random() < .08) sfx.munch();
      if (cow.eat > 2.2) { cow.phase = 'milk'; if (!saidMilk) { sayWord('milk'); saidMilk = true; } }
    } else if (cow.phase === 'out') {
      cow.walk += dt; cow.x += 45*dt;
      if (cow.x > DW + 20) { idx++; if (cow.sad) return finish(); nextCow(); }
    }
    for (const f of flying) f.t += dt * 2.5;
    flying = flying.filter(f => f.t < 1);
  }

  /* --- Zeichnen --- */
  function drawCow(x0, y0, time) {
    x0 = Math.round(x0); y0 = Math.round(y0);
    const moving = cow.phase === 'in' || cow.phase === 'out', step = moving ? (Math.sin(time / 90) > 0 ? 2 : 0) : 0;
    const chew = cow.phase === 'feed' && Math.sin(time / 80) > 0 ? 1 : 0;
    R('rgba(0,0,0,.2)', x0 - 2, y0 + 33, 52, 4);
    for (const [lx, o] of [[4, step], [10, -step], [34, -step], [40, step]]) {
      R('#222', lx + x0 - 1, y0 + 19, 6, 14 + o * 0); R('#fff', lx + x0, y0 + 20, 4, 11 - Math.abs(o)); R('#777', lx + x0, y0 + 31 - Math.abs(o), 4, 2);
    }
    R('#222', x0 - 1, y0 - 1, 46, 24); R('#fff', x0, y0, 44, 22);
    R('#222', x0 + 6, y0 + 3, 10, 7); R('#222', x0 + 24, y0 + 10, 9, 6); R('#222', x0 + 30, y0 + 2, 6, 5); R('#eee', x0 + 2, y0 + 1, 40, 1);
    R('#fff', x0 - 3, y0 + 2, 3, 12); R('#222', x0 - 4, y0 + 13, 4, 4);                       // Schwanz
    R('#d9708a', x0 + 13, y0 + 21, 16, 7); R('#f7a8b8', x0 + 14, y0 + 21, 14, 6);              // Euter
    for (let i = 0; i < 4; i++) {
      const glow = cow.phase === 'milk' && i === cow.teat && Math.sin(time / 120) > 0;
      if (glow) R('#ffd23f', x0 + 14 + i * 4, y0 + 26, 4, 6);
      R('#e58aa0', x0 + 15 + i * 4, y0 + 27, 2, 4);
    }
    const hx = x0 + 42, hy = y0 - 6 + chew;                                                   // Kopf
    R('#222', hx - 1, hy - 1, 16, 17); R('#fff', hx, hy, 14, 15); R('#222', hx + 2, hy + 1, 5, 4);
    R('#f7a8b8', hx + 6, hy + 9, 9, 6); R('#d9708a', hx + 8, hy + 11, 2, 2); R('#d9708a', hx + 12, hy + 11, 2, 2);
    R('#222', hx + 8, hy + 4, 2, 2); R('#e8d8b0', hx + 2, hy - 3, 2, 3); R('#e8d8b0', hx + 10, hy - 3, 2, 3);
    R('#fff', hx - 3, hy + 3, 3, 3); R('#222', hx - 4, hy + 3, 1, 3);
  }
  function drawCan(x, y) {
    x = Math.round(x); y = Math.round(y);
    R('#6f7d88', x, y, 10, 12); R('#c8d4dc', x + 1, y + 1, 8, 10); R('#ffffff', x + 2, y + 2, 6, 3); R('#6f7d88', x + 2, y - 2, 6, 2);
  }
  function drawCat(time) {
    const x = cat.x, y = cat.y - Math.round(Math.sin(Math.min(1, cat.hop / 0.5) * Math.PI) * 10), tail = Math.sin(time / 300) > 0 ? 0 : 2;
    R('rgba(0,0,0,.2)', x, cat.y + 8, 14, 2);
    R('#e08a2c', x + 12 + tail, y - 4, 2, 9); R('#e08a2c', x + 13 + tail, y - 6, 2, 3);           // Schwanz
    R('#e08a2c', x + 2, y, 11, 8); R('#c06a1c', x + 4, y + 2, 2, 5); R('#c06a1c', x + 8, y + 2, 2, 5);
    R('#e08a2c', x, y - 7, 8, 7); R('#e08a2c', x, y - 9, 2, 2); R('#e08a2c', x + 6, y - 9, 2, 2);  // Kopf + Ohren
    const blink = Math.sin(time / 900) > 0.95;
    R('#222', x + 2, y - 5, 1, blink ? 1 : 2); R('#222', x + 5, y - 5, 1, blink ? 1 : 2); R('#ff9ab0', x + 3, y - 3, 2, 1);
  }
  function drawWaiting() {                         // wartende Kühe schauen aus der Tür
    const n = Math.max(0, Math.min(3, cows - idx - (cow ? 1 : 0)));
    for (let k = 0; k < n; k++) {
      const hx = 8 + k * 9, hy = 34 + (k % 2) * 6;
      R('#222', hx - 1, hy - 1, 12, 12); R('#fff', hx, hy, 10, 10); R('#222', hx + 1, hy + 1, 4, 3);
      R('#f7a8b8', hx + 2, hy + 6, 7, 4); R('#222', hx + 6, hy + 3, 1, 2); R('#e8d8b0', hx + 1, hy - 3, 2, 3); R('#e8d8b0', hx + 7, hy - 3, 2, 3);
    }
  }
  function drawLamp(time) {
    R('#3a2410', 149, 0, 1, 14); R('#3a2410', 145, 14, 9, 2);
    const flick = Math.sin(time / 170) > 0.3 ? .22 : .16;
    ctx.fillStyle = `rgba(255,210,63,${flick})`; ctx.beginPath(); ctx.arc(149.5, 21, 16, 0, Math.PI * 2); ctx.fill();
    R('#3a2410', 145, 16, 9, 11); R('#ffd23f', 146, 17, 7, 8); R('#fff3a8', 148, 18, 3, 4);
  }
  function draw(time) {
    ctx.drawImage(bg, 0, 0);
    ctx.setTransform(S, 0, 0, S, OX, OY);
    drawLamp(time); drawWaiting(); drawCat(time);
    // Raufe mit Heu
    R('#5a3b1c', MANGER.x, MANGER.y, MANGER.w, MANGER.h); R('#7a4a22', MANGER.x + 1, MANGER.y + 1, MANGER.w - 2, MANGER.h - 2);
    const hayLeft = cow && cow.phase === 'feed' ? 1 - Math.min(1, cow.eat / 2.2) : 0;
    if (hayLeft > 0) R('#e0c060', MANGER.x + 2, MANGER.y + 2 + (1 - hayLeft) * 10, MANGER.w - 4, 10 * hayLeft);
    for (let i = 0; i < MANGER.w; i += 5) R('#3a2410', MANGER.x + i, MANGER.y, 1, MANGER.h);
    // Heuballen-Stapel
    for (let i = 0; i < Math.min(save.hay, 6); i++) drawBale(STACK.x + (i % 2) * 15, STACK.y + 22 - ((i / 2) | 0) * 9);
    // volle Milchkannen
    cans.forEach((c, i) => drawCan(6 + i * 13, 118));
    if (cow) {
      drawCow(cow.x, CY - 14, time);
      // Eimer unter dem Euter
      if (cow.phase === 'milk' || cow.phase === 'feed') {
        const bx = cow.x + 14, by = CY + 22;
        R('#6f7d88', bx, by, 16, 12); R('#9aa8b2', bx + 1, by + 1, 14, 10);
        const f = cow.fill / TAPS; if (f > 0) R('#ffffff', bx + 2, by + 1 + 9 * (1 - f), 12, 9 * f);
      }
      const bounce = Math.abs(Math.sin(time / 200)) * 4;
      if (cow.phase === 'hungry') {
        drawArrow(STACK.x + 13, STACK.y - 12 - bounce);
        drawBale(cow.x + 52, CY - 44 - bounce);                    // Sprechblase: Heu!
      }
      if (cow.phase === 'milk') drawArrow(cow.x + 19, CY - 2 - bounce);
    }
    for (const f of flying) drawBale(f.x + (f.tx - f.x) * f.t, f.y + (f.ty - f.y) * f.t - Math.sin(f.t * Math.PI) * 20);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }
  function resize() { build(); }
  function exit() { clearTimeout(winTimer); }
  return { enter, update, draw, resize, exit, onPointer, _s: () => ({ S, OX, OY }), _dbg: () => ({ state, idx, cows, milked, phase: cow && cow.phase, CX, CY, STACK, MANGER, cowx: cow && cow.x }) };
})();

startLoop(Kuehe);
addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
</script>
