<script>
/* Zeigt Fehler direkt auf dem Bildschirm an (es gibt auf dem iPad keine Konsole) */
window.addEventListener('error', function (e) {
  var d = document.getElementById('fehler');
  if (!d) { d = document.createElement('pre'); d.id = 'fehler'; (document.body || document.documentElement).appendChild(d);
    d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;margin:0;padding:10px;background:#b00020;color:#fff;font:15px/1.3 monospace;z-index:999;white-space:pre-wrap'; }
  var t = e.target, msg;
  if (t && t !== window && (t.src || t.href)) msg = 'Datei nicht gefunden: ' + (t.src || t.href);
  else msg = 'Fehler: ' + e.message + (e.filename ? '  (' + e.filename.split('/').slice(-2).join('/') + ', Zeile ' + e.lineno + ')' : '');
  d.textContent += msg + '\n';
}, true);
</script>

    <button class="big" id="gresume" aria-label="Weiter"><svg width="70" height="70" viewBox="0 0 10 10"><path d="M2 1 L9 5 L2 9 Z" fill="#5a3d00"/></svg></button>
  </div>
  <button class="mute" aria-label="Ton"><i class="ico" data-ico="sound"></i></button>
</div>

  <div class="stars"></div>
  <div class="row">
    <div class="pill gain" data-say="star" style="cursor:pointer">+<span id="wingain">3</span> <i class="ico" data-ico="star"></i></div>
    <div class="pill gain" id="winword" style="cursor:pointer"><span class="word"></span></div>
  </div>
  <button class="home" data-home aria-label="Zur Baustelle"><i class="ico" data-ico="home"></i></button>
</div>
<script>window.NO_PAD = true;   // hier wird gezogen und getippt</script>
<script src="../../../gemeinsam/sterne.js?v=20261118b"></script>

<script>
window.HOF_URL = '../../index.html';                 // „Hof“ ist hier der Bauhof
const save = Hof.save;
const house = () => { if (!save.house || typeof save.house !== 'object') save.house = { step: 0 }; return save.house; };
let winTimer = null;
// Bauschritt fertig: Fortschritt speichern, Sterne, Jubel, zurück zum Bauhof
function finishStep(step, key, back) {
  Hof.load(); house().step = Math.max(house().step, step); save.stars += BAU_STARS_STEP; Hof.persist();
  setTimeout(() => {
    document.querySelectorAll('.gamehud').forEach(el => el.classList.add('hidden'));
    $('wingain').textContent = BAU_STARS_STEP;
    const row = $('gwin').querySelector('.stars'); row.innerHTML = '<i class="ico" data-ico="star"></i>'.repeat(BAU_STARS_STEP); applyIcons(row);
    $('winword').dataset.say = key; $('winword').querySelector('.word').textContent = WORDS[key][0];
    show('gwin'); sfx.win(); confetti();
    setTimeout(() => sayWord(key), 1400);
    winTimer = setTimeout(() => goHof(back), 4200);
  }, 400);
}
</script>
<script>
/* =====================================================================
   MINISPIEL: WÄNDE MAUERN (Baustelle, Wohnhaus Schritt 3) – von schräg oben wie der Hof
   Steine von der Palette in die leuchtenden Lücken der Hauswand ziehen. Reihe für Reihe von unten nach oben,
   Tür und Fenster bleiben frei. Nichts fliegt durch die Luft: Ein Stein hängt am Finger oder liegt auf der Palette.
   Hilfe: Eine leuchtende Lücke antippen legt dort direkt einen Stein hinein.
   ===================================================================== */
document.querySelectorAll('[data-home]').forEach(b => b.addEventListener('click', () => goHof('mauer')));

const Wall = (() => {
  const ROWS = 3, COLS = 7;   // 7 Spalten: Tür liegt genau in der Mitte einer Spalte
  let g, geo, cells, state, row, drag = null, pal, plops = [], paused = false;
  function siteGeo() {
    const hw = Math.min(6, gc - 6) * G, hh = Math.min(4, gr - 4) * G;
    const hx = Math.round((gc * G - hw) / 2) - G, hy = Math.max(G, Math.round(((gr - 1) * G - hh) / 2));
    return { hx, hy, hw, hh };
  }
  function enter() {
    Hof.load();
    if (house().step !== 2) { goHof('mauer'); return; }
    layout(true);
    g = siteGeo(); geo = houseGeo(g.hx, g.hy, g.hw, g.hh);
    // Boden: Schotter, Straße unten, Bauzaun
    for (let r = 0; r < gr; r++) for (let c = 0; c < gc; c++) {
      const set = r === gr - 1 ? tiles.road : bauTiles.gravel;
      for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) bctx.drawImage(pick(set), c*G+i*T, r*G+j*T);
    }
    const B = (col,x,y,w,h)=>{bctx.fillStyle=col;bctx.fillRect(x,y,w,h);};
    const fx = g.hx - 14, fy = g.hy - 14, fw = g.hw + 28 + 3 * G, fh = g.hh + 26;
    for (let x = fx; x <= fx + fw; x += 9) B('#d35400', x, fy - 2, 2, 7);
    for (let y = fy; y <= fy + fh; y += 9) { B('#d35400', fx, y, 2, 6); B('#d35400', fx + fw, y, 2, 6); }
    B('#ffffff', fx, fy, fw + 2, 2); B('#ffffff', fx, fy, 2, fh); B('#ffffff', fx + fw, fy, 2, fh);
    // Palette rechts neben dem Haus
    const cwp = Math.round(g.hw / COLS), chp = Math.round(geo.fz / ROWS);
    pal = { x: g.hx + g.hw + G, y: g.hy + geo.rz - 6, w: 2 * cwp + 8, h: 3 * (chp - 1) + 8 };
    B('rgba(0,0,0,.25)', pal.x + 2, pal.y + 3, pal.w, pal.h);
    B('#5a3b1c', pal.x, pal.y, pal.w, pal.h); for (let y = pal.y + 2; y < pal.y + pal.h; y += 6) B('#a0673a', pal.x + 1, y, pal.w - 2, 4);
    // Wand-Raster der Fassade: Lücke = Tür/Fenster (bleibt frei)
    const holes = facadeHoles(geo).rects, cw = g.hw / COLS, rh = geo.fz / ROWS;
    cells = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const x = Math.round(g.hx + c * cw), y = Math.round(g.hy + g.hh - (r + 1) * rh), w = Math.round(g.hx + (c + 1) * cw) - x, h = Math.round(g.hy + g.hh - r * rh) - y;
      const cx = x + w / 2, cy = y + h / 2;
      const ov = ([hx, hy, hw2, hh2]) => Math.max(0, Math.min(x + w, hx + hw2) - Math.max(x, hx)) * Math.max(0, Math.min(y + h, hy + hh2) - Math.max(y, hy));
      const open = holes.some(hr => ov(hr) > w * h * 0.5);   // Tür/Fenster überdeckt mehr als die Hälfte der Zelle
      cells.push({ r, c, x, y, w, h, open, done: false });
    }
    row = 0; while (row < ROWS && !free().length) row++;
    drag = null; plops = []; state = 'play';
    show('whud'); hud();
    setTimeout(() => sayWord('wall'), 400);
  }
  $('pausebtn').addEventListener('click', () => { if (state !== 'play') return; paused = true; drag = null; show('gpause'); });
  $('gresume').addEventListener('click', () => { hide('gpause'); paused = false; });
  const need = () => cells.filter(k => !k.open);
  function hud() { $('wcount').textContent = need().filter(k => k.done).length + '/' + need().length; }
  const free = () => cells.filter(k => k.r === row && !k.open && !k.done);
  const inPal = (x, y) => x > pal.x - 8 && x < pal.x + pal.w + 8 && y > pal.y - 10 && y < pal.y + pal.h + 8;
  function place(k) {
    k.done = true; sfx.clod(); hud(); plops.push({ k, t: 0 });
    for (let i = 0; i < 6; i++) spawn(k.x + rnd(0, k.w), k.y + k.h, rnd(-15, 15), rnd(-15, -5), .35, '#d8c8a8', 40);
    if (!free().length) {
      row++; while (row < ROWS && !free().length) row++;   // Reihen ohne Lücken überspringen
      sfx.load();
      if (row >= ROWS) { state = 'won'; finishStep(3, 'wall', 'mauer'); }
    }
  }
  function onPointer(type, x, y) {
    if (state !== 'play' || paused) return true;
    if (type === 'down') {
      if (inPal(x, y)) { drag = { x, y }; sfx.click(); return true; }
      const k = free().find(k => x > k.x - 3 && x < k.x + k.w + 3 && y > k.y - 3 && y < k.y + k.h + 3);
      if (k) place(k);                                 // Hilfe: Lücke antippen
    } else if (type === 'move' && drag) { drag.x = x; drag.y = y; }
    else if (type === 'up' && drag) {
      let best = null, bd = 30;
      for (const k of free()) { const d = Math.hypot(k.x + k.w / 2 - drag.x, k.y + k.h / 2 - drag.y); if (d < bd) { bd = d; best = k; } }
      if (best) place(best); else sfx.bonk();         // daneben: Stein liegt einfach wieder auf der Palette
      drag = null;
    }
    return true;
  }
  function update(dt) { for (const p of plops) p.t += dt; plops = plops.filter(p => p.t < 0.25); }
  function brick(x, y, w, h) { R('#7a2218', x, y, w, h); R('#c0392b', x + 1, y + 1, w - 2, h - 3); R('#e06a5a', x + 1, y + 1, w - 2, 1); R('#d8c8a8', x, y + h - 1, w, 1); }
  function draw(time) {
    ctx.drawImage(bg, 0, 0);
    const done = state === 'won';
    drawHouseTop(R, g.hx, g.hy, g.hw, g.hh, { step: done ? 3 : 2, time });
    if (!done) {
      // Mauerkrone von oben: wird mit jeder fertigen Reihe kräftiger
      if (row > 0) { const th = Math.min(3, row); R('#8e2a20', g.hx, g.hy, g.hw, th); R('#8e2a20', g.hx, g.hy, th, geo.rz); R('#8e2a20', g.hx + g.hw - th, g.hy, th, geo.rz); }
      // Fassade: gesetzte Steine, leuchtende Lücken der aktuellen Reihe
      const on = Math.abs(Math.sin(time / 260)) > .5;
      for (const k of cells) {
        if (k.open) { if (k.r < row) R('#2e1f10', k.x, k.y, k.w, k.h); continue; }
        if (k.done) brick(k.x, k.y, k.w, k.h);
        else if (k.r === row) { R(on ? 'rgba(255,210,63,.8)' : 'rgba(255,210,63,.45)', k.x + 1, k.y + 1, k.w - 2, k.h - 2); }
        else R('rgba(255,255,255,.15)', k.x + 1, k.y + 1, k.w - 2, k.h - 2);
      }
      for (const p of plops) R('rgba(255,255,255,.6)', p.k.x, p.k.y, p.k.w, p.k.h);
    }
    // Steine auf der Palette, Bauarbeiter daneben
    const cw = Math.round(g.hw / COLS), ch = Math.round(geo.fz / ROWS);
    for (let j = 0; j < 3; j++) for (let i = 0; i < 2; i++) brick(pal.x + 3 + i * (cw + 1), pal.y + 3 + j * (ch - 1), cw, ch);
    ctx.drawImage(BUILDER.frames[16], pal.x + pal.w / 2 - 10, pal.y + pal.h + 2);
    if (drag) brick(Math.round(drag.x - cw / 2), Math.round(drag.y - ch / 2), cw, ch);
    // Hinweis ohne fliegende Steine: gepunkteter Weg von der Palette zur ersten Lücke, Pfeil auf die Palette
    if (state === 'play' && !drag) {
      const k = free()[0];
      if (k) {
        const sx = pal.x + pal.w / 2, sy = pal.y + pal.h / 2, ex = k.x + k.w / 2, ey = k.y + k.h / 2, n = Math.ceil(Math.hypot(ex - sx, ey - sy) / 7);
        const blink = Math.floor(time / 180) % 3;
        for (let i = 1; i < n; i++) if (i % 3 === blink) R('rgba(255,255,255,.85)', Math.round(sx + (ex - sx) * i / n) - 1, Math.round(sy + (ey - sy) * i / n) - 1, 3, 3);
        drawArrow(Math.round(sx - 3), Math.round(pal.y - 16 - Math.abs(Math.sin(time / 220)) * 4));
      }
    }
  }
  function resize() { layout(false); }
  function exit() { clearTimeout(winTimer); }
  return { enter, update, draw, resize, exit, onPointer, _dbg: () => ({ state, row, pal, free: free().map(k => [k.x + k.w / 2, k.y + k.h / 2]) }) };
})();
startLoop(Wall);
addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
</script>
