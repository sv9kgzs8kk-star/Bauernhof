<script>
/* Zeigt Fehler direkt auf dem Bildschirm an (es gibt auf dem iPad keine Konsole) */
window.addEventListener('error', function (e) {
  var d = document.getElementById('fehler');
  if (!d) { d = document.createElement('pre'); d.id = 'fehler'; (document.body || document.documentElement).appendChild(d);
    d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;margin:0;padding:10px;background:#b00020;color:#fff;font:15px/1.3 monospace;z-index:999;white-space:pre-wrap'; }
  var t = e.target, msg;
  if (t && t !== window && (t.src || t.href)) msg = 'Datei nicht gefunden: ' + (t.src || t.href);
  else msg = 'Fehler: ' + e.message + (e.filename ? '  (' + e.filename.split('/').slice(-2).join('/') + ', Zeile ' + e.lineno + ')' : '');
  d.textContent += msg + '\n';
}, true);
</script>

<script>window.NO_PAD = true;   // hier wird gezogen und getippt</script>

<script>
/* =====================================================================
   WOHNHAUS EINRICHTEN – drei Zimmer von schräg oben (wie der Hof)
   Wohnzimmer links, Schlafzimmer rechts oben, Bad rechts unten (Innenwände mit Durchgängen).
   Möbel aus der Leiste ziehen (beliebig oft), hingestellte Möbel verschieben, zurück in die Leiste = weg.
   Auf den Boden tippen: das Kind läuft hin. Kurz auf einem Bett stehen bleiben = schlafen (es wird Nacht und wieder Tag).
   Gespeichert: save.home.items = [{ k, x, y }] (x/y = 0–1 im Zimmer).
   ===================================================================== */
const FARM = new URLSearchParams(location.search).has('bauernhaus');   // ?bauernhaus = Bauernhaus auf dem Hof einrichten (gratis, eigener Spielstand save.farm)
window.HOF_URL = FARM ? '../hof.html' : '../baustelle/index.html';          // „Hof“ ist hier die Stadt bzw. der Bauernhof
const BACK_TAG = FARM ? 'bauernhaus' : 'wohnhaus', WHERE = FARM ? 'farm' : 'home';

const save = Hof.save;
document.querySelectorAll('[data-home]').forEach(b => b.addEventListener('click', () => goHof(BACK_TAG)));

Object.assign(WORDS, { up: ['OBEN', 'Oben'], down: ['UNTEN', 'Unten'], stairs: ['TREPPE', 'Treppe'], lift: ['AUFZUG', 'Aufzug'],
  fl0: ['ERDGESCHOSS', 'Erdgeschoss'], fl1: ['ERSTER STOCK', 'Erster Stock'], fl2: ['ZWEITER STOCK', 'Zweiter Stock'], fl3: ['DRITTER STOCK', 'Dritter Stock'], fl4: ['DACHTERRASSE', 'Dachterrasse'] });
// Großes Haus (2 Stockwerke): unten Wohnzimmer, Küche, Flur mit Treppe; oben Kinderzimmer, Schlafzimmer, Bad, Flur mit Treppe
// Holzhaus (L-Form): unten Wohnzimmer mit Kamin (linker Flügel), Küche und Bad (rechter Flügel); über die Leiter auf den Dachboden
const WOOD = !FARM && houseType().shape === 'L';
const TOWER = !FARM && houseType().shape === 'T';   // Hochhaus: Etagen 0–3 (EG Eingangshalle, 1 Wohnen, 2 Kinder, 3 Schlafen), Aufzug statt Treppe
const TWO = !FARM && !WOOD && !TOWER && ((save.house && save.house.type) | 0) >= 1;
const TOWER_LEVELS = 5;                                // 0–3 Etagen, 4 = Dachterrasse
const SKY_COLS = ['#7ec8e3', '#a8dcf0', '#4a9cc0'];   // Farbe des Dach-Knopfs (Himmel)
const levelCols = l => l >= 4 ? SKY_COLS : TOWER_COLS[l];
const Room = (() => {
  let S = 1, BS = 1, WH = G, room, floor, bar, slots, arrows, page = 0, pages = [], walls = [], drag = null, sel = null, wob = new Map(), lampOn = true, idle = 0;
  let lastTap = null, sit = null, liftOpen = 0, atDoor = 0, calling = false, heli = { ph: 'idle', t: 0 };   // heli: Hubschrauber auf dem Dach   // calling: Kind steht vor dem Aufzug, Türen gehen auf          // sit = Kind sitzt im Schaukelstuhl { i, t }
  let kid = null, night = null, grid = null, level = 0, stairs = null, swap = null, panel = null, ride = null;   // Hochhaus: Aufzug-Bedienfeld, Fahrt
  const list = () => save[WHERE].items;
  const onLevel = it => ((it.f | 0) === level);
  const toScreen = (f, p) => ({ x: Math.round(floor.x + p.x * (floor.w - f.W)), y: Math.round(floor.y + p.y * (floor.h - f.H)) });
  const toFrac = (f, x, y) => ({ x: clamp((x - floor.x) / (floor.w - f.W), 0, 1), y: clamp((y - floor.y) / (floor.h - f.H), 0, 1) });
  const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  function enter() {
    Hof.load();
    if (!FARM && (!save.house || save.house.step < 5 || !save.home.unlocked)) { goHof(BACK_TAG); return; }
    layout(true);
    const cols = Math.min(gc - 1, 15);
    S = 1; BS = 1;                                   // Möbel und Kind klein genug, damit die Zimmer groß wirken WH = G * S / 2 + G / 2;
    FURN.forEach(f => { f.W = f.w * S; f.H = f.h * S; });
    const barH = 38 * Math.max(1, S - 1) + 18;
    room = { x: Math.round((W - cols * G) / 2), y: G, w: cols * G, h: H - barH - G - 6 };
    floor = { x: room.x + 4, y: room.y + WH + 2, w: room.w - 8, h: room.h - WH - 6 };
    layoutBar();
    setupLevel();
    if (!kid) kid = { x: TOWER ? floor.x + floor.w / 2 : floor.x + floor.w * 0.3, y: floor.y + floor.h - 26, path: [], t: 0, flip: false, still: 0 };   // ein Stück hinter der Haustür (dort geht es raus)
    else { kid.x = clamp(kid.x, floor.x + 6, floor.x + floor.w - 6); kid.y = clamp(kid.y, floor.y + 14 * S, floor.y + floor.h); kid.path = []; }
    drag = null; sel = null;
    show('ihud');
  }
  // Wände, Treppe, Laufraster und Bild für die aktuelle Etage
  function setupLevel() {
    // Innenwände: links Wohnzimmer/Kinderzimmer, rechts oben Schlafzimmer/Bad, rechts unten Bad bzw. Flur mit Treppe (je mit Durchgang)
    const t = 4 * S, vx = Math.round(floor.x + floor.w * (TOWER ? 0.64 : 0.56)), hy = Math.round(floor.y + floor.h * (WOOD ? 0.3 : 0.5)), gap = 26 * S;   // Holzhaus: Garten kleiner, rechter Flügel höher (Platz für die Veranda)
    const vGapY = floor.y + floor.h - gap - 6 * S;
    walls = [
      { x: vx, y: room.y + WH - 2, w: t, h: vGapY - room.y - WH + 2 },                      // senkrecht, Durchgang unten
      { x: vx, y: vGapY + gap, w: t, h: floor.y + floor.h - vGapY - gap },
      { x: vx + t, y: hy, w: Math.round((floor.x + floor.w - vx - t) * 0.25), h: t },          // waagrecht rechts, Durchgang in der Mitte
      { x: vx + t + Math.round((floor.x + floor.w - vx - t) * 0.25) + gap, y: hy, w: floor.x + floor.w - (vx + t + Math.round((floor.x + floor.w - vx - t) * 0.25) + gap), h: t },
    ];
    if (WOOD) {                                        // L-Form: hinten rechts ist draußen (Garten), Kamin im Wohnzimmer, Leiter zum Dachboden
      const rx = Math.round(vx + (floor.x + floor.w - vx) * 0.55), rTop = hy + WH;
      const fb = floor.y + floor.h, yb = Math.round(fb - Math.max(40 * S, (fb - hy) * 0.3));          // vor dem rechten Flügel: Veranda (draußen, aber mit Möbeln)
      const d1 = yb - gap - 6 * S, d2 = yb + t + Math.round((fb - yb - t - gap) / 2);   // Türen: Wohnzimmer→Küche, Wohnzimmer→Veranda
      walls = [{ kind: 'out', x: vx, y: room.y - 4, w: room.x + room.w + 4 - vx, h: rTop + 2 - room.y + 4 }];
      if (level === 0) walls.push(
        { kind: 'fire', x: Math.round(floor.x + (vx - floor.x) * 0.2), y: room.y + WH - 10, w: 40, h: 20 },   // großer Natursteinkamin (nur unten)
        { x: vx, y: rTop, w: t, h: Math.max(0, d1 - rTop) }, { x: vx, y: d1 + gap, w: t, h: d2 - d1 - gap }, { x: vx, y: d2 + gap, w: t, h: fb - d2 - gap },   // Wohnzimmer | Küche | Veranda
        { x: rx, y: rTop, w: t, h: Math.max(0, d1 - rTop) }, { x: rx, y: d1 + gap, w: t, h: yb - d1 - gap },   // Küche | Bad
        { x: vx + t, y: yb, w: floor.x + floor.w + 4 - vx - t, h: t });                                       // Hauswand vorne (dahinter die Veranda)
      else walls.push({ kind: 'out', x: vx, y: yb, w: room.x + room.w + 4 - vx, h: room.y + room.h + 4 - yb });   // oben: Vordach über der Veranda
      room.rx = rx; room.yb = yb;
    }
    if (TWO && level === 1) {                          // oben links geteilt: Kinderzimmer (hinten) und Schlafzimmer (vorne), Durchgang in der Mitte
      const gx = Math.round(floor.x + (vx - floor.x) / 2 - gap / 2);
      walls.push({ x: floor.x - 4, y: hy, w: gx - floor.x + 4, h: t }, { x: gx + gap, y: hy, w: vx - gx - gap, h: t });
    }
    if (TOWER && level === 0) walls = [                // Eingangshalle: offen, Pförtnertresen rechts, Pflanzkübel
      { kind: 'desk', x: Math.round(floor.x + floor.w * 0.72), y: Math.round(floor.y + floor.h * 0.35), w: 44, h: 14 },
      { kind: 'pot', x: floor.x + 4, y: floor.y + floor.h - 22, w: 14, h: 14 }, { kind: 'pot', x: floor.x + floor.w - 18, y: floor.y + floor.h - 22, w: 14, h: 14 }];
    if (TOWER && level === 4) {                         // Dachterrasse: frei, rechts der Landeplatz (dort keine Möbel)
      const ps = Math.min(Math.round(floor.h * 0.62), Math.round(floor.w * 0.36));
      walls = [{ kind: 'pad', x: floor.x + floor.w - ps - 10, y: Math.round(floor.y + (floor.h - ps) / 2), w: ps, h: ps }];
    }
    room.vx = vx; room.hy = hy;
    if (TOWER) {                                       // Aufzug hinten in der Mitte: Schacht ragt aus der Wand, davor die Haltestelle
      const lx = Math.round(floor.x + floor.w / 2 - 20);
      walls.push({ kind: 'shaft', x: lx - 6, y: room.y + WH - 10, w: 52, h: floor.y - room.y - WH + 38 });
      stairs = { x: lx, y: floor.y + 28, w: 40, h: 20, lift: true };
      buildGrid(); paint(); fixItems(); return; }
    stairs = TWO ? { x: floor.x + floor.w - 30, y: floor.y + floor.h - 44, w: 28, h: 42 } : null;   // Treppe unten rechts im Flur
    if (WOOD) stairs = { x: vx - 30, y: floor.y + 6, w: 24, h: 40, ladder: true };                  // Leiter hinten rechts im Wohnzimmer
    buildGrid();
    paint();
    fixItems();
  }
  function fixItems() {
    const fixed = list().filter(it => { const f = rotF(BY[it.k], it.r); return !f || !onLevel(it) || !lost(f, it); })   // Möbel an Stellen, die es hier nicht gibt: weg
      .map(it => { const f = rotF(BY[it.k], it.r); if (!f || !onLevel(it)) return it; const p = toScreen(f, it); return Object.assign({}, it, fit(f, p.x, p.y)); });
    if (fixed.length !== list().length || fixed.some((it, i) => Math.abs(it.x - list()[i].x) > 0.002 || Math.abs(it.y - list()[i].y) > 0.002)) Hof.setHome(fixed, WHERE);   // Möbel nicht in Innenwänden
  }
  function layoutBar() {
    const barH = 38 * Math.max(1, S - 1) + 18;
    bar = { x: room.x, y: H - barH + 2, w: room.w, h: barH - 6 };
    // Leiste in Seiten aufteilen (Pfeile links/rechts, wenn nicht alles passt)
    const aw = 22 + 6 * S, inner = bar.w - 2 * aw - 8;
    pages = []; let cur = [], used = 0;
    for (const f of FURN) { const need = f.w * BS + 8; if (used + need > inner && cur.length) { pages.push(cur); cur = []; used = 0; } cur.push(f); used += need; }
    if (cur.length) pages.push(cur);
    page = Math.min(page, pages.length - 1);
    arrows = pages.length > 1 ? [{ dir: -1, x: bar.x + 4, y: bar.y + 4, w: aw - 4, h: bar.h - 8 }, { dir: 1, x: bar.x + bar.w - aw, y: bar.y + 4, w: aw - 4, h: bar.h - 8 }] : [];
    layoutSlots();
  }
  function layoutSlots() {
    const aw = arrows.length ? arrows[0].w + 8 : 4, inner = bar.w - 2 * aw - 4, fs = pages[page] || [];
    const need = fs.reduce((a, f) => a + f.w * BS + 8, 0), extra = Math.max(0, Math.floor((inner - need) / Math.max(1, fs.length)));
    let sx = bar.x + aw + 2;
    slots = fs.map(f => { const w = f.w * BS + 8 + extra, s = { key: f.key, x: sx, y: bar.y + 4, w: w - 2, h: bar.h - 8 }; sx += w; return s; });
  }

  function paint() {
    for (let r = 0; r < gr; r++) for (let c = 0; c < gc; c++)
      for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) bctx.drawImage(pick(tiles.grass), c*G+i*T, r*G+j*T);
    const B = (col,x,y,w,h)=>{bctx.fillStyle=col;bctx.fillRect(x,y,w,h);};
    if (WOOD) { paintWood(B); paintBar(B); return; }
    if (TOWER) { paintTower(B); paintBar(B); return; }
    const { x, y, w, h, vx, hy } = room;
    B('rgba(0,0,0,.25)', x + 4, y + 6, w, h);
    // Böden je Zimmer: Holz (Wohnzimmer), Teppich (Schlafzimmer), Fliesen (Bad), Steinplatten (Flur), bunter Teppich (Kinderzimmer)
    const wood = (x1, y1, x2, y2) => { for (let yy = y1, k = 0; yy < y2; yy += 6, k++) { B(k % 2 ? '#c58a4f' : '#b97f45', x1, yy, x2 - x1, Math.min(6, y2 - yy)); B('#8e5a2e', x1, yy + 5, x2 - x1, 1);
      for (let xx = x1 + (k * 17) % 34; xx < x2; xx += 34) B('#8e5a2e', xx, yy, 1, 5); } };
    const carpet = (x1, y1, x2, y2, c1, c2) => { B(c1, x1, y1, x2 - x1, y2 - y1); for (let i = 0; i < 40; i++) B(c2, x1 + ((i * 37) % Math.max(1, x2 - x1 - 2)), y1 + ((i * 23) % Math.max(1, y2 - y1 - 1)), 2, 1); };
    const tileF = (x1, y1, x2, y2, c1, c2, n) => { for (let yy = y1, k = 0; yy < y2; yy += n, k++) for (let xx = x1, j = 0; xx < x2; xx += n, j++) B((k + j) % 2 ? c1 : c2, xx, yy, Math.min(n, x2 - xx), Math.min(n, y2 - yy)); };
    const left = [x, y + WH, vx, y + h], rt = [vx, y + WH, x + w, hy], rb = [vx, hy, x + w, y + h];
    if (!TWO) { wood(...left); carpet(...rt, '#a9c8e8', '#bcd6f0'); }                     // kleines Haus: Wohnzimmer, Schlafzimmer, Bad
    else if (level === 0) { wood(...left); tileF(...rt, '#fff8e8', '#d9534f', 8); }          // unten: Wohnzimmer, Küche (rot-weiße Fliesen)
    else { carpet(x, y + WH, vx, hy, '#9fd68a', '#c6e9b6');                                   // oben: Kinderzimmer (grün mit Punkten), Schlafzimmer (blau), Bad
      for (let i = 0; i < 5; i++) B(['#ffd23f', '#ff6b8a', '#3fa9f5'][i % 3], Math.round(x + 14 + i * (vx - x - 34) / 4), Math.round(y + WH + 14 + (i % 2) * Math.max(10, hy - y - WH - 34)), 6, 6);
      carpet(x, hy, vx, y + h, '#a9c8e8', '#bcd6f0');
      tileF(...rt, '#e8f2f8', '#cfe0ec', 6 * S); }
    if (TWO) tileF(...rb, '#e6dcc8', '#d4c8ae', 10); else tileF(...rb, '#e8f2f8', '#cfe0ec', 6 * S);
    if (stairs) {                                    // Treppe: unten nach oben (helle Stufen), oben nach unten (dunkle Öffnung)
      const s2 = stairs; B('#5a3b1c', s2.x - 2, s2.y - 2, s2.w + 4, s2.h + 4);
      for (let i = 0; i < 7; i++) { const sy = s2.y + i * 6, c = level === 0 ? ['#e0a868', '#c98a4f'][i % 2] : `rgb(${60 + i * 18},${40 + i * 13},${24 + i * 8})`;
        B(c, s2.x, sy, s2.w, 6); B('rgba(0,0,0,.25)', s2.x, sy + 5, s2.w, 1); }
      B('#7a4a22', s2.x - 2, s2.y - 2, 2, s2.h + 4); B('#ffd23f', s2.x - 2, s2.y - 2, 2, 2);   // Geländer
      // Pfeil aufs Treppenfeld: nach oben bzw. unten
      const ax = s2.x + s2.w / 2, ay = s2.y + s2.h / 2, up = level === 0;
      for (let i = 0; i < 5; i++) B('#ffffff', Math.round(ax - i), Math.round(up ? ay - 6 + i : ay + 6 - i), 2 * i + 1, 1);
      B('#ffffff', ax - 1, up ? ay - 1 : ay - 6, 3, 7);
    }
    // Rückwand mit Tapete, Fenster, Bild
    if (FARM) { B('#a0673a', x, y, w, WH + 2); for (let xx = x; xx < x + w; xx += 10) B('#7a4a22', xx, y, 1, WH + 2); B('#c98a4f', x, y, w, 1); }   // Bauernhaus: Holzwand
    else { B('#f3e3b8', x, y, w, WH + 2); for (let xx = x + 3; xx < x + w; xx += 8 * S) B('#e8d39c', xx, y, 3 * S, WH + 2); }
    B('#cdb27a', x, y + WH, w, 2); B('#7a4a22', x, y + WH + 1, w, 2);
    const win = (wx) => { const Q = (col, a, b, c, d) => B(col, wx + a * S, y + b * S + 2, c * S, d * S);
      Q('#5a3b1c', 0, 2, 22, 14); Q('#9fe3ff', 2, 4, 18, 10); Q('#e6f8ff', 2, 4, 4, 10); Q('#5a3b1c', 10, 4, 2, 10); Q('#5a3b1c', 2, 8, 18, 2); Q('#ffffff', 13, 5, 5, 2); };
    win(x + Math.round((vx - x) * 0.3)); win(vx + Math.round((x + w - vx) * 0.4));
    const px = x + Math.round((vx - x) * 0.72), P = (col, a, b, c, d) => B(col, px + a * S, y + b * S + 2, c * S, d * S);
    P('#c48a00', 0, 3, 14, 11); P('#7cc0f0', 1, 4, 12, 9); P('#5cb64f', 1, 10, 12, 3); P('#ffd23f', 8, 5, 3, 3);
    // Außenmauern von oben, vorne mit offener Haustür
    const WC = '#e9dcc0', WD = '#b8a888';
    B(WD, x - 4, y - 4, w + 8, 4); B(WC, x - 4, y - 4, w + 8, 2);
    B(WD, x - 4, y - 4, 4, h + 8); B(WC, x - 4, y - 4, 2, h + 8);
    B(WD, x + w, y - 4, 4, h + 8); B(WC, x + w + 2, y - 4, 2, h + 8);
    const dw = level === 0 ? 2 * G : 0, dx = x + Math.round((vx - x - dw) / 2);   // oben: keine Haustür
    room.door = dw ? { x: dx, w: dw } : null;
    B(WD, x - 4, y + h, dx - x + 4, 4); B(WD, dx + dw, y + h, x + w - dx - dw + 4, 4);
    B(WC, x - 4, y + h, dx - x + 4, 2); B(WC, dx + dw, y + h, x + w - dx - dw + 4, 2);
    if (dw) B('#c9b48a', dx + 4, y + h, dw - 8, 4);
    // Innenwände (von oben, wie die Außenmauern) mit Schatten
    for (const r of walls) { B('rgba(0,0,0,.18)', r.x + 2, r.y + 2, r.w, r.h); B(WD, r.x, r.y, r.w, r.h); B(WC, r.x, r.y, Math.max(1, r.w - 2), Math.max(1, r.h - 2)); }
    paintBar(B);
  }
  // Hochhaus innen: Wände in der Farbe der Etage (wie die Fassade), Aufzug hinten, vorne große Fenster (EG: Glastür)
  function paintTower(B) {
    const { x, y, w, h, vx, hy } = room, col = levelCols(level);
    B('rgba(0,0,0,.25)', x + 4, y + 6, w, h);
    const tileF = (x1, y1, x2, y2, c1, c2, n) => { for (let yy = y1, k = 0; yy < y2; yy += n, k++) for (let xx = x1, j = 0; xx < x2; xx += n, j++) B((k + j) % 2 ? c1 : c2, xx, yy, Math.min(n, x2 - xx), Math.min(n, y2 - yy)); };
    const wood = (x1, y1, x2, y2) => { for (let yy = y1, k = 0; yy < y2; yy += 6, k++) { B(k % 2 ? '#c58a4f' : '#b97f45', x1, yy, x2 - x1, Math.min(6, y2 - yy)); B('#8e5a2e', x1, yy + 5, x2 - x1, 1);
      for (let xx = x1 + (k * 17) % 34; xx < x2; xx += 34) B('#8e5a2e', xx, yy, 1, 5); } };
