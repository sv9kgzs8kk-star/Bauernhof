<script>
/* =====================================================================
   MINISPIEL: ANBAU DER FEUERWACHE (dritter Stellplatz links an der Halle), Etappe 1 in 3 Teilen (Michael 26.11.)
   Fortschritt in save.fire.annexStep, jeder Teil ist eine eigene Runde (3 Sterne) und endet in der Stadt:
   Teil A (annexStep 0 → 1), Ansicht von vorne: Grube baggern (Felder antippen, Schaufel voll → Kipper), dann Beton mit der Pumpe malen.
   Teil B (1 → 2): Kamera schwenkt, Seitenansicht der Wache: mit dem Hammer die 3 Wandplatten der Halle einschlagen (je 3 Schläge, Platte kippt nach vorne);
          Kamera schwenkt zurück, der Schutt liegt auf der neuen Bodenplatte → mit dem Bagger zum Kipper.
   Teil C (2 → annex 2): Autokran hebt Rückwand, Seitenwand, Vorderwand mit Torloch und Flachdach vom Tieflader; Torloch antippen = Rolltor;
          der Rüstwagen setzt rückwärts ganz in die Halle, das Tor geht wieder zu.
   Start über den Monitor in der Leitstelle. Etappe 2 (Treppe, Landeplatz, Hubschrauber) kommt später.
   ===================================================================== */
document.querySelectorAll('[data-home]').forEach(b => b.addEventListener('click', () => goHof('wache')));
if (ORT !== 'wache') location.replace(location.pathname + '?ort=wache');
const Q = snapF(R, 2);
const Anbau = (() => {
  let s0, fg, fb, gg, part, phase, paused = false, idle = 0, shake = 0, turn = null, view = 'front', pit, cells, plate = false;
  let veh, tip, fill, cap, loads, totalLoads, left, honked = false, tipCol = 0, vexit = null;   // Bagger und Kipper (Grube und Schutt)
  let pour;                                                                                     // Beton
  let side, hammer;                                                                             // Seitenansicht mit Hammer
  let slots, crane, truck, hook, carry, queue, placed, follow, finger, delivered;               // Kran
  let gateK, rw;                                                                                // Tor und Rüstwagen
  const N = ANNEX_PARTS, PER_TRUCK = 3, TIP = 50, HITS = 5;   // Michael: 5 Hammerschläge je Feld
  const liftH = lh => Math.round(4 + lh * 22);
  function setWord(k, count) { const el = $('kword'); el.dataset.say = k; el.querySelector('.word').textContent = WORDS[k][0]; $('kcount').textContent = count || ''; }
  const B = (col, x, y, w, h) => { bctx.fillStyle = col; bctx.fillRect(x, y, w, h); };
  function enter() {
    Hof.load();
    const f = save.fire || {};
    if ((f.step | 0) < 5 || (f.annex | 0) !== 1) { goHof('wache'); return; }
    part = Math.min(2, f.annexStep | 0);
    layout(true);
    // Platz: links der Anbau (genau 2 Rasterfelder breit, damit Grube und Schutt ins Raster passen), rechts die Wache; unten die Straße
    const hh = Math.max(40, Math.min(4 * G, Math.floor((H - 42 - 8 - 22 - 14) / 2.12)));
    let bw = Math.min(clamp(gc - 5, 3, 6) * G, Math.round(hh * 1.5));
    const cs = Math.round(2.2 * G);
    if (Math.round(bw * 1.33) + cs + 12 > W) bw = Math.floor((W - cs - 12) / 1.33);
    const aw = Math.max(G, Math.round(bw * 0.32 / G) * G), tw = bw + aw;
    let ax = Math.round((Math.round((W - tw - cs) / 2) + cs) / G) * G; while (ax + tw > W - 4 && ax > G) ax -= G;
    const bot = Math.min((gr - 1) * G, Math.round((42 + hh * 2.1) / G) * G), hy = bot - hh;
    s0 = { ax, hy, aw, bw, hh, bot }; fg = fireGeo(ax, hy, tw, hh, aw); gg = fg.garage; fb = fg.old;
    for (let r = 0; r < gr; r++) for (let c = 0; c < gc; c++) {
      const set = r === gr - 1 ? tiles.road : bauTiles.gravel;
      for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) bctx.drawImage(pick(set), c*G+i*T, r*G+j*T);
    }
    B('#6a7076', ax + aw - 2, hy - 2, bw + 4, hh + 4); B('#a2a8ae', ax + aw - 1, hy - 1, bw + 2, hh + 2);   // Bodenplatte der Wache
    // Grube: Rasterfelder links neben der Halle
    const c0 = ax / G, r0 = Math.floor(gg.y / G), r1 = bot / G - 1;
    pit = { c0, r0, w: aw / G, h: r1 - r0 + 1 };
    cells = [];
    for (let r = r0; r <= r1; r++) for (let c = c0; c < c0 + pit.w; c++) cells.push({ r, c, dug: false, seed: r * 31 + c * 7 });
    const x0 = c0 * G, y0 = r0 * G, w = pit.w * G, h = pit.h * G;
    if (part === 0) {                                  // Absteckung: orange Pflöcke mit Schnur
      for (let x = x0; x <= x0 + w; x += 12) { B('#d35400', x - 1, y0 - 3, 3, 3); B('#d35400', x - 1, y0 + h, 3, 3); }
      for (let y = y0; y <= y0 + h; y += 12) { B('#d35400', x0 - 3, y - 1, 3, 3); }
      B('#ffffff', x0, y0 - 2, w, 1); B('#ffffff', x0, y0 + h + 1, w, 1); B('#ffffff', x0 - 2, y0, 1, h);
    } else paintPlate();
    totalLoads = cells.length > 5 ? 2 : 1; cap = Math.ceil(cells.length / totalLoads); left = cells.length; fill = 0; loads = 0; veh = null; tip = null; vexit = null;
    crane = { x: Math.max(24, ax - Math.round(1.3 * G)), y: gg.y + 14 };
    slots = annexSlots(gg); hook = { x: crane.x + 30, y: crane.y + 30, lh: 1, vx: 0 };
    truck = null; carry = null; queue = []; placed = 0; follow = null; finger = null; delivered = 0; gateK = 0; rw = null;
    pour = null; side = null; hammer = null; turn = null; view = 'front'; idle = 0; paused = false;
    show('khud');
    if (part === 0) { startDig(); setTimeout(() => say('Wir bauen an! Zuerst die Grube.'), 400); }
    else if (part === 1) { phase = 'intro'; setWord('hammer'); setTimeout(() => say('Jetzt reißen wir die Wand ein.'), 400); setTimeout(() => startTurn('side', startWall), 1800); }
    else { setTimeout(() => say('Jetzt kommt der Kran.'), 400); startCrane(); }
  }
  function paintPlate() {                              // fertige Bodenplatte des Anbaus ins Hintergrundbild
    plate = true; const x0 = pit.c0 * G, y0 = pit.r0 * G, w = pit.w * G, h = pit.h * G;
    B('#6a7076', x0 - 2, y0 - 2, w + 2, h + 4); B('#a2a8ae', x0 - 1, y0 - 1, w + 1, h + 2);
    for (let i = 0; i < w * h / 60; i++) B(i % 2 ? '#989ea4' : '#b0b6bc', x0 + (i * 37) % w, y0 + (i * 23) % h, 2, 1);
  }
  $('pausebtn').addEventListener('click', () => { if (phase === 'done') return; paused = true; show('gpause'); });
  $('gresume').addEventListener('click', () => { hide('gpause'); paused = false; });

  // ---------- Kamera schwenken (Bild wird schmal und wieder breit) ----------
  function startTurn(to, then) { turn = { t: 0, to, then, swapped: false }; tone(180, .8, 'sine', .06, 0, 520); noise(600, 1800, .03, 3); }

  // ---------- Bagger und Kipper: Grube (dig) und Schutt (clear) ----------
  const cellAt = (r, c) => cells.find(q => q.r === r && q.c === c);
  const inBase = (r, c) => { const cx = c * G + G / 2, cy = r * G + G / 2; return cx > s0.ax + s0.aw && cx < s0.ax + s0.aw + s0.bw + 4 && cy > fg.main.top - 10 && cy < s0.bot + 4; };
  const tipCell = (r, c) => tip && r === gr - 1 && ['arrive', 'park', 'pause'].includes(tip.state) && (c === tip.tx || c === tip.tx + 1);
  const passable = (r, c) => r >= 0 && c >= 0 && r < gr && c < gc && !inBase(r, c) && !tipCell(r, c);
  const nearTip = () => tip && !veh.moving && veh.r >= gr - 2 && veh.c >= tip.tx - 1 && veh.c <= tip.tx + 2;
  const canUnload = () => fill >= cap || (left === 0 && fill > 0);
  function startVeh() {
    left = cells.filter(q => !q.dug).length; fill = 0; loads = 0; totalLoads = left > 5 ? 2 : 1; cap = Math.ceil(left / totalLoads);
    let c0 = Math.max(0, pit.c0 - 1); while (c0 < gc - 1 && !passable(gr - 2, c0)) c0++;
    veh = newMover(gr - 2, c0, -Math.PI / 2); veh.unloading = false; newTip();
  }
  function startDig() { phase = 'dig'; for (const q of cells) q.dug = false; startVeh(); setWord('dig', '0/' + totalLoads); setTimeout(() => sayWord('digger'), 2200); }
  function startClear() { phase = 'clear'; for (const q of cells) q.dug = q.c !== pit.c0 + pit.w - 1; startVeh(); setWord('rubble2', '0/' + totalLoads); sayWord('rubble2'); }   // Michael: nur eine Reihe Schutt, direkt an der Halle
  function newTip() {
    tipCol = (tipCol + 1) % TIPPERS.length;
    let tx; for (let t = 0; t < 30; t++) { tx = 1 + ((Math.random() * (gc - 3)) | 0); if (!(veh.r === gr - 1 && (veh.c === tx || veh.c === tx + 1))) break; }
    tip = { tx, x: W + 10, y: (gr - 1) * G + 4, park: tx * G + 6, fill: 0, state: 'arrive', timer: 0, col: TIPPERS[tipCol] };
  }
  const BITS = () => phase === 'dig' ? ['#4f3520', '#6b4a2b', '#8a6a4c'] : ['#8a7a66', '#9a9a9a', '#c0392b'];
  function work(m) {
    if (m.done || m.prog < 0.25) return;
    m.done = true;
    const q = cellAt(m.tr, m.tc);
    if (!q || q.dug) return;
    if (fill >= cap) { if (!honked) { sfx.honk(); honked = true; } return; }
    q.dug = true; left--; fill++; honked = false; sfx.clod();
    if (phase === 'dig') for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) bctx.drawImage(pick(bauTiles.dug), q.c * G + i * T, q.r * G + j * T);   // Grube wird tiefer
    const px = q.c * G + G / 2, py = q.r * G + G / 2;
    for (let i = 0; i < 14; i++) spawn(px + rnd(-10, 10), py + rnd(-10, 10), rnd(-25, 25), rnd(-30, 10), rnd(.3, .8), pick(BITS()), 40);
  }
  function updVeh(dt) {
    if (!veh.unloading) {
      moverUpdate(veh, dt, { passable, speed: 1.9, onProg: m => { work(m); const p = moverPos(m); if (Math.random() < .25) spawn(p.x - Math.cos(m.a) * 12, p.y - Math.sin(m.a) * 12, rnd(-6, 6), rnd(-6, 6), .5, 'rgba(90,80,70,.6)'); } });
      if (tip.state === 'park' && canUnload() && nearTip()) { veh.unloading = true; sfx.pour(); }
    } else {
      const amt = Math.min(fill, cap * dt / 1.3); fill -= amt; tip.fill += amt / cap;
      const p = moverPos(veh), tx = tip.x + 23, ty = tip.y + 8;
      for (let i = 0; i < 3; i++) { const sx = p.x + rnd(-3, 3), sy = p.y + rnd(-3, 3), ex = tx + rnd(-7, 7), ey = ty + rnd(-4, 4); spawn(sx, sy, (ex - sx) / .4, (ey - sy) / .4, .4, pick(BITS())); }
      if (fill <= 0.001) { fill = 0; veh.unloading = false; loads++; sfx.load(); setWord(phase === 'dig' ? 'dig' : 'rubble2', loads + '/' + totalLoads); tip.state = 'pause'; tip.timer = 0.6; }
    }
    setEngine(true, veh.moving || veh.unloading, 40);
    const t = tip;
    if (t.state === 'arrive') { t.x = approach(t.x, t.park, 80 * dt); if (t.x === t.park) t.state = 'park'; }
    else if (t.state === 'pause') { t.timer -= dt; if (t.timer <= 0) { t.state = 'leave'; t.v = 10; sfx.honk(); } }
    else if (t.state === 'leave') { t.v += 90 * dt; t.x -= t.v * dt; if (t.x < -50) { if (left === 0 && fill === 0) vehDone(); else newTip(); } }
  }
  function vehDone() {
    const p = moverPos(veh); vexit = { x: p.x, y: p.y }; veh = null; tip = null; clearTapGoal(); setEngine(false, false);
    if (phase === 'dig') startPour(); else finishPart(2);
  }

  // ---------- Beton (wie beim Wohnhaus: Finger ziehen, Pumpe links, Mischer darunter; ab 90 % läuft der Rest nach) ----------
  function startPour() {
    phase = 'pour'; const nx = pit.w * 2, ny = pit.h * 2;
    const pump = { x: Math.max(18, pit.c0 * G - 22), y: (pit.r0 + pit.h - 1) * G + G / 2 };
    pour = { nx, ny, sub: new Array(nx * ny).fill(0), filled: 0, total: nx * ny, pump, tip: { x: pump.x - 8, y: pump.y - 30 }, target: null, holding: false,
      mixer: { x: -70, park: Math.round(Math.min(pump.x - 8, W - 60)), y: Math.min((gr - 1) * G - 22, Math.max((pit.r0 + pit.h) * G + 6, pump.y + 20)), state: 'arrive', rot: 0 } };
    setWord('concrete'); setTimeout(() => sayWord('concrete'), 900);
  }
  const subCenter = i => [pit.c0 * G + (i % pour.nx) * T + T / 2, pit.r0 * G + ((i / pour.nx) | 0) * T + T / 2];
  const mixReady = () => pour.mixer.state === 'park';
  function updPour(dt) {
    const P = pour, m = P.mixer;
    if (P.target) { P.tip.x = approach(P.tip.x, P.target.x, 160 * dt); P.tip.y = approach(P.tip.y, P.target.y, 160 * dt); }
    m.rot += dt * (mixReady() ? 6 : 2);
    if (m.state === 'arrive') { m.x = approach(m.x, m.park, 100 * dt); if (m.x === m.park) { m.state = 'park'; sfx.honk(); } }
    else if (m.state === 'leave') m.x += 120 * dt;
    setEngine(true, P.holding, 30);
    if (P.filled >= P.total * 0.9) for (let i = 0; i < P.sub.length; i++) if (P.sub[i] < 1) { P.sub[i] = Math.min(1, P.sub[i] + dt * 1.2); if (P.sub[i] >= 1) P.filled++; }
    if (P.filled >= P.total) { P.holding = false; m.state = 'leave'; sfx.load(); paintPlate(); phase = 'pourdone'; setEngine(false, false); setTimeout(() => finishPart(1), 900); return; }
    $('kcount').textContent = Math.round(100 * P.filled / P.total) + ' %';
    if (!P.holding || !mixReady()) return;
    let any = false;
    for (let i = 0; i < P.sub.length; i++) { if (P.sub[i] >= 1) continue; const [cx, cy] = subCenter(i);
      if (Math.hypot(cx - P.tip.x, cy - P.tip.y) < 18) { P.sub[i] = Math.min(1, P.sub[i] + 2.4 * dt); any = true; if (P.sub[i] >= 1) P.filled++; } }
    if (Math.random() < .7) spawn(P.tip.x + rnd(-2, 2), P.tip.y + 2, rnd(-15, 15), rnd(-10, 15), .5, pick(['#8e959c', '#a8aeb4', '#c4c9ce']), 30);
    if (Math.random() < .6) { const sx = m.x - 3, sy = m.y + 4, ex = P.pump.x - 12, ey = P.pump.y + 4; spawn(sx, sy, (ex - sx) / .3, (ey - sy) / .3, .3, pick(['#8e959c', '#a8aeb4'])); }
    if (any && Math.random() < .04) sfx.pour();
  }
  function drawPour(time) {
    const P = pour, m = P.mixer;
    if (phase === 'pour') for (let i = 0; i < P.sub.length; i++) { const f = P.sub[i]; if (f <= 0) continue; const [cx, cy] = subCenter(i);
      ctx.globalAlpha = Math.min(1, 0.3 + f * 0.7); R(f >= 1 ? '#a2a8ae' : '#8e959c', cx - T / 2, cy - T / 2, T, T); ctx.globalAlpha = 1; }
    if (m.x < W + 10) {                                // Betonmischer von oben (wie beim Wohnhaus)
      const x = Math.round(m.x), y = m.y;
      Q('rgba(0,0,0,.25)', x + 2, y + 3, 56, 18); for (const wx of [6, 16, 40]) { Q('#1a1a1a', x + wx, y - 1, 6, 2); Q('#1a1a1a', x + wx, y + 17, 6, 2); }
      Q('#444', x, y + 1, 44, 16); Q('#9a5a00', x + 4, y, 34, 18); Q('#f08c00', x + 5, y + 1, 32, 16);
      for (let i = 0; i < 6; i++) { const sx = x + 5 + ((i * 7 + Math.floor(m.rot * 4)) % 32); Q('#ffffff', sx, y + 2, 2, 14); }
      Q('#2a6fdb', x + 44, y, 12, 18); Q('#173f80', x + 44, y, 12, 2); Q('#9fe3ff', x + 52, y + 2, 3, 14); Q('#777', x - 6, y + 5, 7, 4);
    }
    if (phase !== 'pour') return;
    const bx = P.pump.x, by = P.pump.y;                // Betonpumpe mit Arm zum Finger
    ctx.drawImage(PUMP.shadows[0], Math.round(bx - 15), Math.round(by - 15)); ctx.drawImage(PUMP.frames[0], Math.round(bx - 17), Math.round(by - 17));
    const px = bx - 8, py = by, dx = P.tip.x - px, dy = P.tip.y - py, d = Math.hypot(dx, dy) || 1, ex = px + dx / 2 - dy / d * 26, ey = py + dy / 2 + dx / d * 26 - 10;
    ctx.lineCap = 'round';
    for (const [w, col] of [[7, '#5a1010'], [5, '#d83a3a'], [1, '#ffffff']]) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(ex, ey); ctx.lineTo(P.tip.x, P.tip.y - 4); ctx.stroke(); }
    R('#999', px - 4, py - 4, 8, 8); R('#cfcfcf', px - 3, py - 3, 6, 6); R('#333', ex - 2, ey - 2, 4, 4); R('#222', P.tip.x - 2, P.tip.y - 5, 4, 7);
    if (P.holding) R('#a2a8ae', P.tip.x - 1, P.tip.y + 1, 2, 3);
  }

  // ---------- Seitenansicht: Wand mit dem Hammer einschlagen ----------
  function startWall() {
    phase = 'wall'; view = 'side';
    const gy = Math.round(H * 0.78), sw = Math.min(Math.round(W * 0.56), 240), sh = Math.round(sw * 0.5), oh = Math.round(sh * 0.55), x0 = Math.round((W - sw) / 2);
    const cw = Math.max(6, Math.round(sw * 0.035)), bh = Math.max(6, Math.round(sh * 0.08));   // Säulen und Träger aus Beton bleiben stehen (Michael)
    side = { gy, sw, sh, oh, x0, cw, bh, cols: [0, 1, 2, 3].map(i => Math.round(x0 + i * (sw - cw) / 3)),
      panels: [0, 1, 2].map(i => { const a = Math.round(x0 + i * (sw - cw) / 3) + cw, b = Math.round(x0 + (i + 1) * (sw - cw) / 3); return { x: a, w: b - a, hits: 0, fall: 0, down: false }; }) };
    hammer = { x: x0 - 26, y: gy - Math.round(sh / 2), t: 9 };
    setWord('hammer', '0/3'); setTimeout(() => sayWord('hammer'), 300);
  }
  const standing = () => side.panels.filter(p => p.hits < HITS);
  function smash(x, y) {
    const ps = standing(); if (!ps.length) return;
    const p = ps.find(p => x >= p.x && x < p.x + p.w) || ps.sort((a, b) => Math.abs(x - a.x - a.w / 2) - Math.abs(x - b.x - b.w / 2))[0];
    const hy = clamp(y, side.gy - side.sh + side.bh + 8, side.gy - 8);
    p.hits++; hammer = { x: clamp(x, p.x + 6, p.x + p.w - 6), y: hy, t: 0 }; shake = 0.15; idle = 0;
    tone(150, .14, 'square', .13, 0, 80); noise(250, 900, .14, 2);

      if (fill > 0) { const p = moverPos(veh), fx = p.x + Math.cos(veh.a) * 12, fy = p.y + Math.sin(veh.a) * 12, n = Math.ceil(4 * fill / cap), cs = BITS();
        R('#6a6058', fx - 4, fy - 4, 8, 8); R(cs[1], fx - 3, fy - 3 - n, 6, 3 + n); R(cs[2], fx - 2, fy - 3 - n, 2, 2); }
      const p = moverPos(veh); for (let i = 0; i < cap && cap <= 12; i++) R(i < Math.round(fill) ? '#ffd23f' : 'rgba(0,0,0,.35)', Math.round(p.x - cap * 2 + i * 4), Math.round(p.y - 24), 3, 3); }
    if (vexit) ctx.drawImage(EXCAVATOR.frames[frameIdx(Math.PI)], Math.round(vexit.x) - 17, Math.round(vexit.y) - 17);
    // Rüstwagen: nur vor der Halle und durch das offene Tor sichtbar (dahinter ist das Hallendach)
    if (rw) { const [gx, gy, gW, gH] = gate(); ctx.save(); ctx.beginPath(); ctx.rect(0, gy + gH, W, H); ctx.rect(gx, gy, gW, Math.round(gH * (1 - gateK))); ctx.clip();
      drawFireTruck(Q, rw.x, rw.y, rw.L, rw.w, 'rw', 'down', Math.floor(time / 250) % 2 === 0); ctx.restore(); }
    // Hinweise
    if ((phase === 'dig' || phase === 'clear') && veh) {
      if (tip && canUnload() && tip.state === 'park' && !veh.unloading) drawArrow(Math.round(tip.x + 16), Math.round(tip.y - 12 - b));
      else if (!veh.moving && !tapGoal && fill === 0 && !loads && cells.filter(q => !q.dug).length === left) { const q = cells.find(q => !q.dug); drawArrow(q.c * G + 9, Math.round(q.r * G - 14 - b)); }
    }
    if (phase === 'pour' && !pour.holding && mixReady()) { const i = pour.sub.findIndex(f => f < 1); if (i >= 0) { const [cx, cy] = subCenter(i); drawArrow(Math.round(cx - 3), Math.round(cy - 16 - b)); } }
    if (phase === 'crane' && !busy() && !follow) {
      if (!carry && truck && truck.state === 'park') { const [x, y] = pickPt(); drawArrow(Math.round(x - 3), Math.round(y - 22 - b)); }
      else if (carry) { const s = slot(), ay = s.y - (s.roof ? Math.round(s.h / 2) : s.ang ? Math.round(s.len / 2) : 0); drawArrow(Math.round(s.x - 3), Math.round(ay - 18 - b)); }
    }
    if (phase === 'gate' && gateK === 0 && !busy()) { const [gx, gy, gW, gH] = gate(), col = a ? 'rgba(255,210,63,.9)' : 'rgba(255,210,63,.45)';
      R(col, gx - 2, gy - 2, gW + 4, 2); R(col, gx - 2, gy + gH, gW + 4, 2); R(col, gx - 2, gy, 2, gH); R(col, gx + gW, gy, 2, gH); drawArrow(Math.round(gx + gW / 2 - 3), Math.round(gy - 20 - b)); }
  }
  function draw(time) {
    if (!cells) return;
    const sx = shake > 0 ? Math.round(Math.sin(time / 15) * 2) : 0;
    ctx.save(); ctx.translate(sx, 0);
    if (turn) { const k = Math.abs(Math.cos(Math.PI * Math.min(1, turn.t / 0.9))); R('#222', 0, 0, W, H); ctx.translate(W / 2, 0); ctx.scale(Math.max(0.02, k), 1); ctx.translate(-W / 2, 0); }
    if (view === 'side' && side) drawSide(time); else drawFront(time);
    ctx.restore();
  }
  function resize() { layout(false); }
  function exit() { setEngine(false, false); clearTimeout(winTimer); }
  return { enter, update, draw, resize, exit, onPointer, _dbg: () => ({ phase, part, view, turn: !!turn, panels: side && side.panels.map(p => [p.x + p.w / 2, side.gy - side.sh / 2, p.hits, p.down]), left, fill, cap, loads,
    veh: veh && { r: veh.r, c: veh.c, moving: veh.moving, unloading: veh.unloading }, tip: tip && { tx: tip.tx, state: tip.state }, todo: cells && cells.filter(q => !q.dug).map(q => [q.r, q.c]),
    pour: pour && { filled: pour.filled, total: pour.total, ready: mixReady(), next: (i => i >= 0 ? subCenter(i) : null)(pour.sub.findIndex(f => f < 1)) },
    placed, N, truck: truck && { state: truck.state, load: truck.load }, pick: truck && pickPt(), slot: placed < N ? [slot().x, slot().y] : null, busy: busy(), carry: !!carry, gate: gate(), gateK, rw: rw && { state: rw.state, y: rw.y, inY: rw.inY } }) };
})();
startLoop(Anbau);
