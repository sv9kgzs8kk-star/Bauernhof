<!DOCTYPE html>

<script>
/* Zeigt Fehler direkt auf dem Bildschirm an (es gibt auf dem iPad keine Konsole) */
window.addEventListener('error', function (e) {
  var d = document.getElementById('fehler');
  if (!d) { d = document.createElement('pre'); d.id = 'fehler'; (document.body || document.documentElement).appendChild(d);
    d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;margin:0;padding:10px;background:#b00020;color:#fff;font:15px/1.3 monospace;z-index:999;white-space:pre-wrap'; }
  var t = e.target, msg;
  if (t && t !== window && (t.src || t.href)) msg = 'Datei nicht gefunden: ' + (t.src || t.href);
  else msg = 'Fehler: ' + e.message + (e.filename ? '  (' + e.filename.split('/').slice(-2).join('/') + ', Zeile ' + e.lineno + ')' : '');
  d.textContent += msg + '\n';
}, true);
</script>

<body>
<canvas id="game"></canvas>
<div id="ihud" class="hud gamehud hidden">
  <button class="pill btn" data-home aria-label="Zur Stadt"><i class="ico" data-ico="home"></i></button>
  <div class="pill" id="iword" data-say="house" style="pointer-events:auto"><span class="word">HAUS</span></div>
</div>
<script>window.NO_PAD = true;   // hier wird gezogen und getippt</script>
<script src="../gemeinsam/sterne.js?v=20261119f"></script>
<script src="../gemeinsam/basis.js?v=20261119f"></script>
<script src="../gemeinsam/moebel.js?v=20261119f"></script>
<script src="../gemeinsam/bau.js?v=20261119f"></script>
<script>
/* =====================================================================
   WOHNHAUS EINRICHTEN – drei Zimmer von schräg oben (wie der Hof)
   Wohnzimmer links, Schlafzimmer rechts oben, Bad rechts unten (Innenwände mit Durchgängen).
   Möbel aus der Leiste ziehen (beliebig oft), hingestellte Möbel verschieben, zurück in die Leiste = weg.
   Auf den Boden tippen: das Kind läuft hin. Kurz auf einem Bett stehen bleiben = schlafen (es wird Nacht und wieder Tag).
   Gespeichert: save.home.items = [{ k, x, y }] (x/y = 0–1 im Zimmer).
   ===================================================================== */
const FARM = new URLSearchParams(location.search).has('bauernhaus');   // ?bauernhaus = Bauernhaus auf dem Hof einrichten (gratis, eigener Spielstand save.farm)
window.HOF_URL = FARM ? '../hof.html' : '../baustelle/index.html';          // „Hof“ ist hier die Stadt bzw. der Bauernhof
const BACK_TAG = FARM ? 'bauernhaus' : 'wohnhaus', WHERE = FARM ? 'farm' : 'home';

const save = Hof.save;
document.querySelectorAll('[data-home]').forEach(b => b.addEventListener('click', () => goHof(BACK_TAG)));

const Room = (() => {
  let S = 1, BS = 1, WH = G, room, floor, bar, slots, arrows, page = 0, pages = [], walls = [], drag = null, sel = null, wob = new Map(), lampOn = true, idle = 0;
  let kid = null, night = null, grid = null;
  const list = () => save[WHERE].items;
  const toScreen = (f, p) => ({ x: Math.round(floor.x + p.x * (floor.w - f.W)), y: Math.round(floor.y + p.y * (floor.h - f.H)) });
  const toFrac = (f, x, y) => ({ x: clamp((x - floor.x) / (floor.w - f.W), 0, 1), y: clamp((y - floor.y) / (floor.h - f.H), 0, 1) });
  const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  function enter() {
    Hof.load();
    if (!FARM && (!save.house || save.house.step < 5 || !save.home.unlocked)) { goHof(BACK_TAG); return; }
    layout(true);
    const cols = Math.min(gc - 1, 15);
    S = 1; BS = 1;                                   // Möbel und Kind klein genug, damit die Zimmer groß wirken WH = G * S / 2 + G / 2;
    FURN.forEach(f => { f.W = f.w * S; f.H = f.h * S; });
    const barH = 38 * Math.max(1, S - 1) + 18;
    room = { x: Math.round((W - cols * G) / 2), y: G, w: cols * G, h: H - barH - G - 6 };
    floor = { x: room.x + 4, y: room.y + WH + 2, w: room.w - 8, h: room.h - WH - 6 };
    // Innenwände: links Wohnzimmer, rechts oben Schlafzimmer, rechts unten Bad (je mit Durchgang)
    const t = 4 * S, vx = Math.round(floor.x + floor.w * 0.56), hy = Math.round(floor.y + floor.h * 0.5), gap = 26 * S;
    const vGapY = floor.y + floor.h - gap - 6 * S;
    walls = [
      { x: vx, y: room.y + WH - 2, w: t, h: vGapY - room.y - WH + 2 },                      // senkrecht, Durchgang unten
      { x: vx, y: vGapY + gap, w: t, h: floor.y + floor.h - vGapY - gap },
      { x: vx + t, y: hy, w: Math.round((floor.x + floor.w - vx - t) * 0.25), h: t },          // waagrecht rechts, Durchgang in der Mitte
      { x: vx + t + Math.round((floor.x + floor.w - vx - t) * 0.25) + gap, y: hy, w: floor.x + floor.w - (vx + t + Math.round((floor.x + floor.w - vx - t) * 0.25) + gap), h: t },
    ];
    room.vx = vx; room.hy = hy;
    bar = { x: room.x, y: H - barH + 2, w: room.w, h: barH - 6 };
    // Leiste in Seiten aufteilen (Pfeile links/rechts, wenn nicht alles passt)
    const aw = 22 + 6 * S, inner = bar.w - 2 * aw - 8;
    pages = []; let cur = [], used = 0;
    for (const f of FURN) { const need = f.w * BS + 8; if (used + need > inner && cur.length) { pages.push(cur); cur = []; used = 0; } cur.push(f); used += need; }
    if (cur.length) pages.push(cur);
    page = Math.min(page, pages.length - 1);
    arrows = pages.length > 1 ? [{ dir: -1, x: bar.x + 4, y: bar.y + 4, w: aw - 4, h: bar.h - 8 }, { dir: 1, x: bar.x + bar.w - aw, y: bar.y + 4, w: aw - 4, h: bar.h - 8 }] : [];
    layoutSlots();
    buildGrid();
    paint();
    if (!kid) kid = { x: floor.x + floor.w * 0.3, y: floor.y + floor.h - 2, path: [], t: 0, flip: false, still: 0 };
    else { kid.x = clamp(kid.x, floor.x + 6, floor.x + floor.w - 6); kid.y = clamp(kid.y, floor.y + 14 * S, floor.y + floor.h); kid.path = []; }
    const fixed = list().map(it => { const f = BY[it.k]; if (!f) return it; const p = toScreen(f, it); return { k: it.k, ...fit(f, p.x, p.y) }; });
    if (fixed.some((it, i) => Math.abs(it.x - list()[i].x) > 0.002 || Math.abs(it.y - list()[i].y) > 0.002)) Hof.setHome(fixed, WHERE);   // Möbel nicht in Innenwänden
    drag = null; sel = null;
    show('ihud');
  }
  function layoutSlots() {
    const aw = arrows.length ? arrows[0].w + 8 : 4, inner = bar.w - 2 * aw - 4, fs = pages[page] || [];
    const need = fs.reduce((a, f) => a + f.w * BS + 8, 0), extra = Math.max(0, Math.floor((inner - need) / Math.max(1, fs.length)));
    let sx = bar.x + aw + 2;
    slots = fs.map(f => { const w = f.w * BS + 8 + extra, s = { key: f.key, x: sx, y: bar.y + 4, w: w - 2, h: bar.h - 8 }; sx += w; return s; });
  }

  function paint() {
    for (let r = 0; r < gr; r++) for (let c = 0; c < gc; c++)
      for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) bctx.drawImage(pick(tiles.grass), c*G+i*T, r*G+j*T);
    const B = (col,x,y,w,h)=>{bctx.fillStyle=col;bctx.fillRect(x,y,w,h);};
    const { x, y, w, h, vx, hy } = room;
    B('rgba(0,0,0,.25)', x + 4, y + 6, w, h);
    // Böden: Holz (Wohnzimmer), hellblauer Teppichboden (Schlafzimmer), Fliesen (Bad)
    for (let yy = y + WH, k = 0; yy < y + h; yy += 6, k++) { B(k % 2 ? '#c58a4f' : '#b97f45', x, yy, vx - x, 6); B('#8e5a2e', x, yy + 5, vx - x, 1);
      for (let xx = x + (k * 17) % 34; xx < vx; xx += 34) B('#8e5a2e', xx, yy, 1, 5); }
    B('#a9c8e8', vx, y + WH, x + w - vx, hy - y - WH); for (let i = 0; i < 40; i++) B('#bcd6f0', vx + ((i * 37) % (x + w - vx)), y + WH + ((i * 23) % Math.max(1, hy - y - WH)), 2, 1);
    for (let yy = hy, k = 0; yy < y + h; yy += 6 * S, k++) for (let xx = vx, j = 0; xx < x + w; xx += 6 * S, j++) B((k + j) % 2 ? '#e8f2f8' : '#cfe0ec', xx, yy, Math.min(6 * S, x + w - xx), Math.min(6 * S, y + h - yy));
    // Rückwand mit Tapete, Fenster, Bild
    if (FARM) { B('#a0673a', x, y, w, WH + 2); for (let xx = x; xx < x + w; xx += 10) B('#7a4a22', xx, y, 1, WH + 2); B('#c98a4f', x, y, w, 1); }   // Bauernhaus: Holzwand
    else { B('#f3e3b8', x, y, w, WH + 2); for (let xx = x + 3; xx < x + w; xx += 8 * S) B('#e8d39c', xx, y, 3 * S, WH + 2); }
    B('#cdb27a', x, y + WH, w, 2); B('#7a4a22', x, y + WH + 1, w, 2);
    const win = (wx) => { const Q = (col, a, b, c, d) => B(col, wx + a * S, y + b * S + 2, c * S, d * S);
      Q('#5a3b1c', 0, 2, 22, 14); Q('#9fe3ff', 2, 4, 18, 10); Q('#e6f8ff', 2, 4, 4, 10); Q('#5a3b1c', 10, 4, 2, 10); Q('#5a3b1c', 2, 8, 18, 2); Q('#ffffff', 13, 5, 5, 2); };
    win(x + Math.round((vx - x) * 0.3)); win(vx + Math.round((x + w - vx) * 0.4));
    const px = x + Math.round((vx - x) * 0.72), P = (col, a, b, c, d) => B(col, px + a * S, y + b * S + 2, c * S, d * S);
    P('#c48a00', 0, 3, 14, 11); P('#7cc0f0', 1, 4, 12, 9); P('#5cb64f', 1, 10, 12, 3); P('#ffd23f', 8, 5, 3, 3);
    // Außenmauern von oben, vorne mit offener Haustür
    const WC = '#e9dcc0', WD = '#b8a888';
    B(WD, x - 4, y - 4, w + 8, 4); B(WC, x - 4, y - 4, w + 8, 2);
    B(WD, x - 4, y - 4, 4, h + 8); B(WC, x - 4, y - 4, 2, h + 8);
    B(WD, x + w, y - 4, 4, h + 8); B(WC, x + w + 2, y - 4, 2, h + 8);
    const dw = 2 * G, dx = x + Math.round((vx - x - dw) / 2);
    B(WD, x - 4, y + h, dx - x + 4, 4); B(WD, dx + dw, y + h, x + w - dx - dw + 4, 4);
    B(WC, x - 4, y + h, dx - x + 4, 2); B(WC, dx + dw, y + h, x + w - dx - dw + 4, 2);
    B('#c9b48a', dx + 4, y + h, dw - 8, 4);
    // Innenwände (von oben, wie die Außenmauern) mit Schatten
    for (const r of walls) { B('rgba(0,0,0,.18)', r.x + 2, r.y + 2, r.w, r.h); B(WD, r.x, r.y, r.w, r.h); B(WC, r.x, r.y, Math.max(1, r.w - 2), Math.max(1, r.h - 2)); }
    // Leiste
    B('rgba(0,0,0,.25)', bar.x + 3, bar.y + 4, bar.w, bar.h);
    B('#5a3b1c', bar.x, bar.y, bar.w, bar.h); B('#a0673a', bar.x + 2, bar.y + 2, bar.w - 4, bar.h - 4); B('#c9a067', bar.x + 2, bar.y + 2, bar.w - 4, 1);
  }

  // Laufraster für das Kind: Zellen, die keine Wand berühren
  function buildGrid() {
    const c = 4 * S, cols = Math.floor(floor.w / c), rows = Math.floor(floor.h / c), ok = [];
    for (let r = 0; r < rows; r++) for (let q = 0; q < cols; q++) {
      const cell = { x: floor.x + q * c - 8 * S, y: floor.y + r * c - 2 * S, w: c + 16 * S, h: c + 4 * S };   // Kind ist 20 Pixel breit
      ok.push(!walls.some(wl => hit(cell, wl)));
    }
    grid = { c, cols, rows, ok };
  }
  const cellOf = (x, y) => [clamp(Math.floor((y - floor.y) / grid.c), 0, grid.rows - 1), clamp(Math.floor((x - floor.x) / grid.c), 0, grid.cols - 1)];
  function findPath(tx, ty) {
    const [sr, sc] = cellOf(kid.x, kid.y); let [er, ec] = cellOf(tx, ty);
    const idx = (r, c) => r * grid.cols + c;
    if (!grid.ok[idx(er, ec)]) {                  // Ziel in einer Wand: nächste freie Zelle
      let best = null, bd = 1e9;
      for (let r = 0; r < grid.rows; r++) for (let c = 0; c < grid.cols; c++) if (grid.ok[idx(r, c)]) { const d = (r - er) ** 2 + (c - ec) ** 2; if (d < bd) { bd = d; best = [r, c]; } }
      if (!best) return []; [er, ec] = best;
    }
    const prev = new Map(), q = [[sr, sc]]; prev.set(idx(sr, sc), -1);
    while (q.length) {
      const [r, c] = q.shift(); if (r === er && c === ec) break;
      for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const nr = r + dr, nc = c + dc; if (nr < 0 || nc < 0 || nr >= grid.rows || nc >= grid.cols) continue;
        const k = idx(nr, nc); if (!grid.ok[k] || prev.has(k)) continue; prev.set(k, idx(r, c)); q.push([nr, nc]);
      }
    }
    if (!prev.has(idx(er, ec))) return [];
    const path = []; let k = idx(er, ec);
    while (k !== -1) { const r = Math.floor(k / grid.cols), c = k % grid.cols; path.unshift({ x: floor.x + c * grid.c + grid.c / 2, y: floor.y + r * grid.c + grid.c / 2 }); k = prev.get(k); }
    return path;
  }

  function setWord(key) { const el = $('iword'); el.dataset.say = key; el.querySelector('.word').textContent = WORDS[key][0]; }
  const inFloor = (x, y) => x > floor.x - 6 && x < floor.x + floor.w + 6 && y > floor.y - 10 && y < floor.y + floor.h + 6;
  const inBar = (x, y) => y >= bar.y - 4;
  const slotAt = (x, y) => slots.find(s => x >= s.x && x < s.x + s.w && y >= s.y - 4 && y < s.y + s.h + 4);
  const arrowAt = (x, y) => arrows.find(a => x >= a.x && x < a.x + a.w && y >= a.y - 4 && y < a.y + a.h + 4);
  const order = () => list().map((it, i) => ({ it, i, f: BY[it.k] })).filter(o => o.f)
    .sort((a, b) => (a.f.flat === b.f.flat ? 0 : a.f.flat ? -1 : 1) || (toScreen(a.f, a.it).y + a.f.H) - (toScreen(b.f, b.it).y + b.f.H));
  function itemAt(x, y) {
    const o = order().reverse();
    for (const e of o) { const p = toScreen(e.f, e.it); if (x >= p.x - 3 && x < p.x + e.f.W + 3 && y >= p.y - 3 && y < p.y + e.f.H + 3) return { ...e, p }; }
    return null;
  }
  // Möbel nicht in Wände stellen: aus der Wand herausschieben
  function fit(f, x, y) {
    let r = { x: clamp(x, floor.x, floor.x + floor.w - f.W), y: clamp(y, floor.y, floor.y + floor.h - f.H), w: f.W, h: f.H };
    for (let n = 0; n < 3; n++) for (const wl of walls) {
      if (!hit(r, wl)) continue;
      const left = r.x + r.w - wl.x, right = wl.x + wl.w - r.x, up = r.y + r.h - wl.y, down = wl.y + wl.h - r.y, m = Math.min(left, right, up, down);
      if (m === left) r.x -= left; else if (m === right) r.x += right; else if (m === up) r.y -= up; else r.y += down;
      r.x = clamp(r.x, floor.x, floor.x + floor.w - f.W); r.y = clamp(r.y, floor.y, floor.y + floor.h - f.H);
    }
    return toFrac(f, r.x, r.y);
  }
  function put(f, cx, cy, i) {
    const pos = fit(f, cx - f.W / 2, cy - f.H / 2), l = list().slice();
    if (i == null) l.push({ k: f.key, ...pos }); else l[i] = { k: f.key, ...pos };
    Hof.setHome(l, WHERE); sfx.clod(); wob.set(i == null ? l.length - 1 : i, 0);
    const p = toScreen(f, pos);
    for (let n = 0; n < 8; n++) spawn(p.x + rnd(0, f.W), p.y + f.H, rnd(-15, 15), rnd(-12, -4), .35, '#e9d8b0', 30);
  }
  function remove(i) { const l = list().slice(); l.splice(i, 1); Hof.setHome(l, WHERE); sfx.load(); }
  function walkTo(x, y) { kid.path = findPath(x, y); kid.still = 0; }

  function onPointer(type, x, y) {
    idle = 0;
    if (!room || night) return true;
    if (type === 'down') {
      const a = arrowAt(x, y);
      if (a) { page = (page + a.dir + pages.length) % pages.length; layoutSlots(); sfx.click(); sel = null; return true; }
      const s = slotAt(x, y);
      if (s) { drag = { f: BY[s.key], x, y, dx: 0, dy: 0, sx: x, sy: y, from: 'bar' }; setWord(s.key); sayWord(s.key); sfx.click(); return true; }
      if (inBar(x, y)) return true;
      const h = itemAt(x, y);
      if (h) { drag = { f: h.f, i: h.i, x, y, dx: h.p.x + h.f.W / 2 - x, dy: h.p.y + h.f.H / 2 - y, sx: x, sy: y, from: 'room' }; sel = null; setWord(h.f.key); sayWord(h.f.key); sfx.click(); return true; }
      if (sel && inFloor(x, y)) { put(BY[sel], x, y); sel = null; return true; }
      if (inFloor(x, y)) walkTo(x, y);                // freier Boden: das Kind läuft hin
      return true;
    }
    if (type === 'move' && drag) { drag.x = x; drag.y = y; return true; }
    if (type === 'up' && drag) {
      const d = drag; drag = null;
      const tap = Math.hypot(d.x - d.sx, d.y - d.sy) < 8;
      if (tap && d.from === 'bar') { sel = sel === d.f.key ? null : d.f.key; return true; }
      if (tap && d.from === 'room') {                 // Möbel antippen: Kind läuft hin (Lampe: Licht an/aus)
        wob.set(d.i, 0); if (d.f.key === 'lamp') { lampOn = !lampOn; sfx.click(); }
        const p = toScreen(d.f, list()[d.i]); walkTo(p.x + d.f.W / 2, p.y + d.f.H / 2); return true;
      }
      const cx = d.x + d.dx, cy = d.y + d.dy;
      if (!inBar(d.x, d.y) && inFloor(cx, cy)) put(d.f, cx, cy, d.from === 'room' ? d.i : null);
      else if (d.from === 'room') remove(d.i);       // zurück in die Leiste = wegräumen
      return true;
    }
    return true;
  }

  function bedUnderKid() {
    for (const e of order()) if (e.f.key === 'bed') { const p = toScreen(e.f, e.it); if (kid.x > p.x + 2 && kid.x < p.x + e.f.W - 2 && kid.y > p.y + 4 && kid.y < p.y + e.f.H + 4) return { ...e, p }; }
    return null;
  }
  function update(dt) {
    idle += dt;
    for (const [k, v] of wob) { if (v + dt > 0.35) wob.delete(k); else wob.set(k, v + dt); }
    if (!kid) return;
    if (night) {                                       // Schlafen: dunkler werden, schlafen, wieder hell
      night.t += dt;
      if (night.t > 1.2 && !night.zz) { night.zz = true; }
      if (night.t > 4.2 && !night.morning) { night.morning = true; tone(523, .15, 'triangle', .08); tone(659, .15, 'triangle', .08, .15); tone(784, .25, 'triangle', .08, .3); setTimeout(() => say('Guten Morgen'), 400); }
      if (night.t > 5.4) { kid.y = night.bed.p.y + night.bed.f.H + 8 * S; kid.x = night.bed.p.x + night.bed.f.W / 2; night = null; kid.still = 0; }
      return;
    }
    if (kid.path.length) {
      const tgt = kid.path[0], dx = tgt.x - kid.x, dy = tgt.y - kid.y, d = Math.hypot(dx, dy), sp = 70 * S * dt;
      if (Math.abs(dx) > 0.5) kid.flip = dx < 0;
      if (d <= sp) { kid.x = tgt.x; kid.y = tgt.y; kid.path.shift(); } else { kid.x += dx / d * sp; kid.y += dy / d * sp; }
      kid.t += dt; kid.still = 0;
    } else {
      kid.still += dt;
      const bed = bedUnderKid();
      if (bed && kid.still > 0.8) {
        night = { t: 0, bed }; setWord('sleep'); say('Gute Nacht');
        tone(392, .3, 'triangle', .06); tone(330, .3, 'triangle', .06, .35); tone(262, .5, 'triangle', .06, .7);
      }
    }
  }
  function drawAt(f, X, Y, on, t) { f.draw((col, x, y, w, h) => R(col, X + x * S, Y + y * S, w * S, h * S), 0, 0, on, t || 0); }
  function drawSmall(f, X, Y, t) { f.draw((col, x, y, w, h) => R(col, X + x * BS, Y + y * BS, w * BS, h * BS), 0, 0, true, t); }
  function drawKid(time, x, y) {
    const K = 2 * S, fr = kid.path.length && Math.floor(kid.t * 8) % 2 ? KID.b : KID.a, w = 10 * K, h = 13 * K;   // Kind doppelt so groß: passt zu Bett und Sofa
    R('rgba(0,0,0,.25)', Math.round(x - w / 2) + K, Math.round(y) - 2 * K, w, 2 * K);
    fr.forEach((row, j) => [...row].forEach((ch, i) => { if (ch !== '.') R(KID.pal[ch], Math.round(x - w / 2) + (kid.flip ? 9 - i : i) * K, Math.round(y - h) + j * K, K, K); }));
  }
  function draw(time) {
    if (!room) return;

      const p = toScreen(e.f, e.it), cx = p.x + 8 * S, cy = p.y + 7 * S;

    }

    things.sort((a, b) => a.y - b.y);

      const e = th.e, p = toScreen(e.f, e.it), wv = wob.get(e.i), wb = wv !== undefined ? Math.round(Math.sin(wv * 30) * 2 * (1 - wv / 0.35)) : 0;
      R('rgba(0,0,0,.22)', p.x + 2 + wb, p.y + 3, e.f.W, e.f.H);
      drawAt(e.f, p.x + wb, p.y, e.f.key !== 'lamp' || lampOn, time);
      if (night && night.bed.i === e.i) {              // Kind liegt im Bett: Kopf auf dem Kissen

      }
    }

    for (const s of slots) {
      const f = BY[s.key];
      R('#7a4a22', s.x, s.y, s.w, s.h); R(sel === s.key && Math.abs(Math.sin(time / 200)) > .5 ? '#ffd23f' : '#fff8e0', s.x + 1, s.y + 1, s.w - 2, s.h - 2);
      drawSmall(f, Math.round(s.x + (s.w - f.w * BS) / 2), Math.round(s.y + (s.h - f.h * BS) / 2), time);
    }
    for (const a of arrows) {
      R('#7a4a22', a.x, a.y, a.w, a.h); R('#fff8e0', a.x + 1, a.y + 1, a.w - 2, a.h - 2);
      const cx = a.x + a.w / 2, cy = a.y + a.h / 2, n = 4 * S;
      for (let i = 0; i < n; i++) R('#5a3b1c', Math.round(cx + (a.dir > 0 ? i - n / 2 : n / 2 - i) - S), Math.round(cy - (n - i)), S * 2, (n - i) * 2);
    }
    if (pages.length > 1) for (let i = 0; i < pages.length; i++) R(i === page ? '#ffd23f' : '#7a4a22', Math.round(bar.x + bar.w / 2 - pages.length * 4 + i * 8), bar.y + bar.h - 4, 5, 3);
    if (sel || drag) {
      const on = Math.abs(Math.sin(time / 260)) > .5;
      ctx.strokeStyle = on ? 'rgba(255,210,63,.9)' : 'rgba(255,210,63,.5)'; ctx.lineWidth = 2; ctx.setLineDash([4, 3]);
      ctx.strokeRect(floor.x + 1, floor.y + 1, floor.w - 2, floor.h - 2); ctx.setLineDash([]);
    }
    if (drag) { const f = drag.f; R('rgba(0,0,0,.25)', Math.round(drag.x + drag.dx - f.W / 2) + 4, Math.round(drag.y + drag.dy - f.H / 2) + 6, f.W, f.H); drawAt(f, Math.round(drag.x + drag.dx - f.W / 2), Math.round(drag.y + drag.dy - f.H / 2) - 3, true, time); }
    // Nacht: alles wird dunkel, Zzz steigen auf, dann wird es wieder hell
    if (night) {
      const t = night.t, a = t < 1.4 ? t / 1.4 : t < 3.8 ? 1 : Math.max(0, 1 - (t - 3.8) / 1.4);
      ctx.fillStyle = `rgba(12,14,48,${(0.72 * a).toFixed(3)})`; ctx.fillRect(0, 0, W, H);
      if (a > 0.6) {
        const p = night.bed.p;
        for (let k = 0; k < 3; k++) { const zt = (t * 0.8 + k * 0.33) % 1, zx = Math.round(p.x + night.bed.f.W * 0.6 + zt * 10 * S), zy = Math.round(p.y - zt * 22 * S), z = S + 1;
          R('#ffffff', zx, zy, 4 * z, z); R('#ffffff', zx + 2 * z, zy + z, z, z); R('#ffffff', zx + z, zy + 2 * z, z, z); R('#ffffff', zx, zy + 3 * z, 4 * z, z); }
        for (const [sx, sy] of [[0.15, 0.1], [0.45, 0.06], [0.8, 0.12], [0.62, 0.2]]) R('#fff3a8', Math.round(W * sx), Math.round(H * sy), 2, 2);
      }
    }
    // Hinweis bei leerem Haus: Pfeil auf das erste Möbel
    if (!drag && !sel && !list().length && idle > 1.5) { const s = slots[0]; drawArrow(Math.round(s.x + s.w / 2 - 3), Math.round(s.y - 14 - Math.abs(Math.sin(time / 220)) * 4)); }
  }
  function resize() { enter(); }
  return { enter, setWord, update, draw, resize, onPointer, _dbg: () => ({ floor, slots, arrows, page, items: list(), kid: kid && { x: kid.x, y: kid.y, path: kid.path.length }, night: !!night, walls }) };
})();
startLoop(Room);
Room.setWord('house'); setTimeout(() => sayWord('house'), 400);
addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
</script>
