<script>
/* Zeigt Fehler direkt auf dem Bildschirm an (es gibt auf dem iPad keine Konsole) */
window.addEventListener('error', function (e) {
  var d = document.getElementById('fehler');
  if (!d) { d = document.createElement('pre'); d.id = 'fehler'; (document.body || document.documentElement).appendChild(d);
    d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;margin:0;padding:10px;background:#b00020;color:#fff;font:15px/1.3 monospace;z-index:999;white-space:pre-wrap'; }
  var t = e.target, msg;
  if (t && t !== window && (t.src || t.href)) msg = 'Datei nicht gefunden: ' + (t.src || t.href);
  else msg = 'Fehler: ' + e.message + (e.filename ? '  (' + e.filename.split('/').slice(-2).join('/') + ', Zeile ' + e.lineno + ')' : '');
  d.textContent += msg + '\n';
}, true);
</script>

<body>
<canvas id="game"></canvas>
<div id="khud" class="hud gamehud hidden">
  <div class="pill" data-say="truss" style="pointer-events:auto"><span class="word">DACHSTUHL</span> <span id="kcount">0/3</span></div>
  <button class="pill btn" id="pausebtn" aria-label="Pause"><i class="ico" data-ico="pause"></i></button>
</div>
<div id="gpause" class="overlay hidden">
  <div class="row">
    <button class="home" data-home aria-label="Zur Baustelle"><i class="ico" data-ico="home"></i></button>
    <button class="big" id="gresume" aria-label="Weiter"><svg width="70" height="70" viewBox="0 0 10 10"><path d="M2 1 L9 5 L2 9 Z" fill="#5a3d00"/></svg></button>
  </div>
  <button class="mute" aria-label="Ton"><i class="ico" data-ico="sound"></i></button>
</div>
<div id="gwin" class="overlay hidden">
  <div class="stars"></div>
  <div class="row">
    <div class="pill gain" data-say="star" style="cursor:pointer">+<span id="wingain">3</span> <i class="ico" data-ico="star"></i></div>
    <div class="pill gain" id="winword" style="cursor:pointer"><span class="word"></span></div>
  </div>
  <button class="home" data-home aria-label="Zur Baustelle"><i class="ico" data-ico="home"></i></button>
</div>
<script>window.NO_PAD = true;   // hier wird gezogen und getippt</script>
<script src="../../../gemeinsam/sterne.js?v=20261118b"></script>
<script src="../../../gemeinsam/basis.js?v=20261118b"></script>
<script src="../../../gemeinsam/bau.js?v=20261118b"></script>
<script>
window.HOF_URL = '../../index.html';                 // „Hof“ ist hier der Bauhof
const save = Hof.save;
const house = () => { if (!save.house || typeof save.house !== 'object') save.house = { step: 0 }; return save.house; };
let winTimer = null;
// Bauschritt fertig: Fortschritt speichern, Sterne, Jubel, zurück zum Bauhof
function finishStep(step, key, back) {
  Hof.load(); house().step = Math.max(house().step, step); save.stars += BAU_STARS_STEP; Hof.persist();
  setTimeout(() => {
    document.querySelectorAll('.gamehud').forEach(el => el.classList.add('hidden'));
    $('wingain').textContent = BAU_STARS_STEP;
    const row = $('gwin').querySelector('.stars'); row.innerHTML = '<i class="ico" data-ico="star"></i>'.repeat(BAU_STARS_STEP); applyIcons(row);
    $('winword').dataset.say = key; $('winword').querySelector('.word').textContent = WORDS[key][0];
    show('gwin'); sfx.win(); confetti();
    setTimeout(() => sayWord(key), 1400);
    winTimer = setTimeout(() => goHof(back), 4200);
  }, 400);
}
</script>
<script>
/* =====================================================================
   MINISPIEL: DACHSTUHL MIT DEM KRAN (Baustelle, Wohnhaus Schritt 4) – von schräg oben wie der Hof
   Binder auf dem Tieflader antippen → der Kran schwenkt hin und hebt ihn an. Dann die leuchtende Stelle
   auf dem Haus antippen → der Kran schwenkt hin und setzt ab. 3 Binder, dann RICHTFEST (house.step = 4).
   Hilfe: Wer gleich die leuchtende Stelle antippt, bekommt Holen und Absetzen in einem Rutsch.
   ===================================================================== */
document.querySelectorAll('[data-home]').forEach(b => b.addEventListener('click', () => goHof('kran')));

// Gleiche Lage des Hauses in Kran und Dach: Raster wie beim Baggern/Beton (scharfe Pixel, Hof-Maßstab)
function siteGeo(withCrane) {
  const hw = Math.min(6, gc - (withCrane ? 6 : 4)) * G, hh = Math.min(4, gr - 4) * G;
  const hx = Math.round((gc * G - hw) / 2) - (withCrane ? G : 0), hy = Math.max(G, Math.round(((gr - 1) * G - hh) / 2));
  return { hx, hy, hw, hh };
}
function paintGround(g) {
  for (let r = 0; r < gr; r++) for (let c = 0; c < gc; c++) {
    const set = r === gr - 1 ? tiles.road : bauTiles.gravel;
    for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) bctx.drawImage(pick(set), c*G+i*T, r*G+j*T);
  }
  const B = (col,x,y,w,h)=>{bctx.fillStyle=col;bctx.fillRect(x,y,w,h);};
  // Bauzaun um den Bauplatz
  const x0 = g.hx - 14, y0 = g.hy - 14, w = g.hw + 28, h = g.hh + 26;
  for (let x = x0; x <= x0 + w; x += 9) { B('#d35400', x, y0 - 2, 2, 7); }
  for (let y = y0; y <= y0 + h; y += 9) { B('#d35400', x0, y, 2, 6); B('#d35400', x0 + w, y, 2, 6); }
  B('#ffffff', x0, y0, w + 2, 2); B('#ffffff', x0, y0, 2, h); B('#ffffff', x0 + w, y0, 2, h);
}

const Kran = (() => {
  let g, geo, tower, truck, L, state, placed, ang, dist, lift, carry, queue, fest, paused = false, deliverAfter = false;
  const beamLen = () => geo.rz + 3;
  function enter() {
    Hof.load();
    if (house().step !== 3) { goHof('kran'); return; }
    layout(true);
    g = siteGeo(true); geo = houseGeo(g.hx, g.hy, g.hw, g.hh);
    paintGround(g);
    tower = { x: g.hx + g.hw + Math.round(G * 1.2), y: g.hy + g.hh + Math.round(G * 0.4) };     // Kran unten rechts am Haus
    truck = { x: g.hx + Math.round(g.hw / 2) - 28, y: (gr - 1) * G + 3 };                       // Tieflader auf der Straße unter dem Haus
    const far = [[truck.x + 22, truck.y + 9], ...[0, 1, 2].map(i => [geo.beam(i), g.hy + Math.round(geo.rz / 2)])];
    L = Math.max(...far.map(([x, y]) => Math.hypot(x - tower.x, y - tower.y))) + 12;
    placed = 0; ang = -Math.PI * 0.75; dist = L * 0.6; lift = 1; carry = null; queue = []; fest = null; deliverAfter = false;
    state = 'idle'; show('khud'); hud();
    setTimeout(() => sayWord('crane'), 400);
  }
  $('pausebtn').addEventListener('click', () => { if (state === 'fest') return; paused = true; show('gpause'); });
  $('gresume').addEventListener('click', () => { hide('gpause'); paused = false; });
  function hud() { $('kcount').textContent = placed + '/3'; }
  const pickPt = () => [truck.x + 22, truck.y + FLATBED_SLOTS[2 - placed] + 1];
  const slotPt = () => [geo.beam(placed), g.hy + Math.round(geo.rz / 2)];
  function to(x, y, lf, then) { queue.push({ a: Math.atan2(y - tower.y, x - tower.x), d: Math.hypot(x - tower.x, y - tower.y), lf, then }); }
  function fetch() {
    const [x, y] = pickPt(); state = 'busy'; sfx.click();
    to(x, y, 1); to(x, y, 0, () => { carry = { ang: 0 }; sfx.clod(); }); to(x, y, 1, () => { state = 'carry'; });
  }
  function deliver() {
    const [x, y] = slotPt(); state = 'busy'; sfx.click();
    to(x, y, 1); to(x, y, 0, () => {
      carry = null; placed++; hud(); sfx.load();
      for (let k = 0; k < 10; k++) spawn(x + rnd(-4, 4), g.hy + rnd(0, geo.rz), rnd(-20, 20), rnd(-20, 5), .5, '#e8c27a', 30);
    });
    to(x, y, 1, () => { if (placed >= 3) richtfest(); else state = 'idle'; });
  }
  function richtfest() {
    state = 'fest'; fest = 0; hide('khud');
    setTimeout(() => { sfx.unlock(); confetti(); sayWord('richtfest'); }, 900);
    setTimeout(() => finishStep(4, 'richtfest', 'kran'), 2800);
  }
  function onPointer(type, x, y) {
    if (type !== 'down' || paused) return true;
    const onTruck = x > truck.x - 8 && x < truck.x + 64 && y > truck.y - 10 && y < truck.y + 26;
    const onHouse = x > g.hx - 10 && x < g.hx + g.hw + 10 && y > g.hy - 10 && y < g.hy + g.hh + 6;
    if (state === 'idle') { if (onTruck) fetch(); else if (onHouse) { fetch(); deliverAfter = true; } }
    else if (state === 'carry' && onHouse) deliver();
    return true;
  }
  function turn(a, b, step) { let d = Math.atan2(Math.sin(b - a), Math.cos(b - a)); return Math.abs(d) <= step ? b : a + Math.sign(d) * step; }
  function update(dt) {
    if (fest !== null) { fest += dt; return; }
    if (paused) return;
    if (carry && lift > 0.5) carry.ang = approach(carry.ang, Math.PI / 2, 2.2 * dt);   // angehoben: Binder dreht sich quer zum Haus
    const q = queue[0];
    if (!q) { if (state === 'carry' && deliverAfter) { deliverAfter = false; deliver(); } return; }
    ang = turn(ang, q.a, 1.5 * dt);
    if (ang === q.a) dist = approach(dist, q.d, 70 * dt);
    if (ang === q.a && dist === q.d) lift = approach(lift, q.lf, 2 * dt);
    if (ang === q.a && dist === q.d && lift === q.lf) { queue.shift(); if (q.then) q.then(); }
    setEngine(true, !!q, 30);
  }
  function draw(time) {
    ctx.drawImage(bg, 0, 0);
    drawFlatbedTop(R, truck.x, truck.y, 3 - placed - (carry ? 1 : 0), Math.min(beamLen(), 44));
    drawHouseTop(R, g.hx, g.hy, g.hw, g.hh, { step: 3, trusses: placed, ridge: fest !== null, wreath: fest !== null ? Math.min(1, fest / 1.0) : 0, time });
    // leuchtende Zielstelle für den nächsten Binder
    if (placed < 3 && fest === null) {
      const bx = geo.beam(placed), a = Math.abs(Math.sin(time / 260)) > .5;
      R(state === 'carry' ? (a ? 'rgba(126,217,87,.9)' : 'rgba(126,217,87,.5)') : (a ? 'rgba(255,210,63,.85)' : 'rgba(255,210,63,.45)'), bx - 2, g.hy - 2, 5, geo.rz + 3);
    }
    // Haken mit Last, dann der Kran darüber
    const hx = tower.x + Math.cos(ang) * dist, hy = tower.y + Math.sin(ang) * dist;
    if (carry) drawBeamTop(R, hx, hy + 4, carry.ang < 0.05 ? Math.min(beamLen(), 44) : beamLen(), carry.ang, lift);
    R('rgba(0,0,0,.25)', Math.round(hx) + Math.round(2 + lift * 6) - 2, Math.round(hy) + Math.round(2 + lift * 6), 4, 3);
    R('#333', Math.round(hx), Math.round(hy) - Math.round(lift * 2), 1, 4 + Math.round((1 - lift) * 4));
    R('#e0a800', Math.round(hx) - 2, Math.round(hy) + 3 - Math.round(lift * 2) + Math.round((1 - lift) * 4), 5, 3);
    drawCraneTop(R, tower.x, tower.y, ang, L, dist);
    // Hinweise: erst zum Tieflader, dann zur Stelle am Haus
    const b = Math.abs(Math.sin(time / 220)) * 4;
    if (state === 'idle') { const [x, y] = pickPt(); drawArrow(Math.round(x - 3), Math.round(y - 22 - b)); }
    if (state === 'carry') { const [x, y] = slotPt(); drawArrow(Math.round(x - 3), Math.round(g.hy - 18 - b)); }
  }
  function resize() { layout(false); }
  function exit() { setEngine(false, false); clearTimeout(winTimer); }
  return { enter, update, draw, resize, exit, onPointer, _dbg: () => ({ state, placed, truck, g, slot: slotPt(), pick: pickPt() }) };
})();
startLoop(Kran);
addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
</script>
</body>
