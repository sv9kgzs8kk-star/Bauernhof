<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Unsere Spiele</title>
<script>
/* ===== WELTEN – hier neue Welten eintragen =====
   wort:  wird angezeigt (GROSS) und vorgelesen (sprich)
   url:   relativer Pfad zur Welt
   bild:  Name der Zeichenfunktion unten in BILDER
   anker: Rücksprung-Anker (#feld usw.), die zu dieser Welt gehören
   aktiv: false = Kachel wird NICHT gezeigt (keine leeren Kacheln)      */
var WELTEN = [
  { id: 'bauernhof', wort: 'BAUERNHOF', sprich: 'Bauernhof', url: 'hof.html',
    bild: 'hof', farbe: '#7ec850', anker: ['feld', 'wiese', 'schafe', 'kuehe'], aktiv: true },
  { id: 'baustelle', wort: 'BAUSTELLE', sprich: 'Baustelle', url: 'baustelle/index.html',
    bild: 'kran', farbe: '#f5b700', anker: [], aktiv: false }
];

/* Sicherheitsnetz: Minispiele, die noch auf index.html#anker zurückspringen,
   landen trotzdem in ihrer Welt statt auf der Startseite. */
(function () {
  var h = (location.hash || '').replace('#', '');
  if (!h) return;
  var ziel = WELTEN[0];
  for (var i = 0; i < WELTEN.length; i++) {
    if (WELTEN[i].anker.indexOf(h) >= 0) { ziel = WELTEN[i]; break; }
  }
  location.replace(ziel.url + '#' + h);
})();
/* Nur eine Welt aktiv? Dann ohne Umweg direkt dorthin (kein Extra-Tipp). */
(function () {
  var aktiv = WELTEN.filter(function (w) { return w.aktiv; });
  if (aktiv.length === 1 && !location.hash) location.replace(aktiv[0].url);
})();
</script>
<style>
  html, body { margin: 0; height: 100%; background: #8fd3ff; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    font-family: "Courier New", ui-monospace, monospace; }
  #wolken { position: fixed; inset: 0; image-rendering: pixelated; width: 100%; height: 100%; }
  main { position: relative; height: 100%; display: flex; flex-wrap: wrap; gap: 4vmin;
    align-content: center; justify-content: center; box-sizing: border-box;
    padding: calc(env(safe-area-inset-top) + 4vmin) 4vmin calc(env(safe-area-inset-bottom) + 4vmin); }
  .kachel { border: 0; padding: 0; background: #fff; border-radius: 0;
    box-shadow: 0 0 0 1vmin #2b2b2b, 1.6vmin 1.6vmin 0 1vmin rgba(0,0,0,.35);
    width: min(40vmin, 42vw); display: flex; flex-direction: column; cursor: pointer;
    transition: transform .12s; }
  .kachel canvas { width: 100%; aspect-ratio: 4 / 3; image-rendering: pixelated; display: block; }
  .kachel span { font-size: min(5.4vmin, 6vw); font-weight: 900; letter-spacing: .06em;
    color: #2b2b2b; padding: 1.6vmin 0 1.8vmin; text-align: center; }
  .kachel:active, .kachel.gewaehlt { transform: scale(.95) translate(.6vmin, .6vmin); }
  .kachel.gewaehlt { box-shadow: 0 0 0 1vmin #ffd23f, 1vmin 1vmin 0 1vmin rgba(0,0,0,.35); }
  #fehler { position: fixed; left: 0; right: 0; bottom: 0; background: #c0392b; color: #fff;
    font: 14px sans-serif; padding: 6px 10px; display: none; }
</style>
</head>
<body>
<canvas id="wolken" width="64" height="48"></canvas>
<main id="welten"></main>
<div id="fehler"></div>
<script>
window.onerror = function (m) { var f = document.getElementById('fehler'); f.textContent = m; f.style.display = 'block'; };

/* ===== Pixel-Bilder: 32×24 Raster ===== */
function px(c, farbe, x, y, w, h) { c.fillStyle = farbe; c.fillRect(x, y, w || 1, h || 1); }

var BILDER = {
  hof: function (c) {
    px(c, '#8fd3ff', 0, 0, 32, 24);
    px(c, '#ffd23f', 26, 1, 3, 3); px(c, '#ffe98a', 27, 2);
    px(c, '#ffffff', 3, 2, 5, 1); px(c, '#ffffff', 2, 3, 7, 1);
    px(c, '#7ec850', 0, 18, 32, 6); px(c, '#5fa83a', 0, 18, 32, 1);
    for (var r = 3; r <= 8; r++) { var h = Math.min((r - 2) * 2, 10); px(c, '#8e2a20', 16 - h, r, h * 2, 1); }
    px(c, '#c0392b', 8, 9, 16, 9);
    px(c, '#ffd23f', 15, 6, 2, 2);
    px(c, '#ffffff', 13, 12, 6, 6); px(c, '#8b4513', 14, 13, 4, 5);
    for (var i = 0; i < 4; i++) { px(c, '#ffffff', 14 + i, 13 + i); px(c, '#ffffff', 17 - i, 13 + i); }
    for (var x = 1; x < 8; x += 2) { px(c, '#e8d3a0', x, 15, 1, 3); }
    px(c, '#e8d3a0', 0, 16, 8, 1);
    px(c, '#f0f0f0', 26, 16, 4, 2); px(c, '#2b2b2b', 29, 16); px(c, '#2b2b2b', 26, 18); px(c, '#2b2b2b', 29, 18);
  },
  kran: function (c) {
    px(c, '#8fd3ff', 0, 0, 32, 24);
    px(c, '#ffd23f', 27, 1, 3, 3);
    px(c, '#b5835a', 0, 18, 32, 6); px(c, '#946640', 0, 18, 32, 1);
    px(c, '#f5b700', 8, 3, 2, 15);
    for (var y = 4; y < 18; y += 2) px(c, '#c48a00', 8, y, 2, 1);
    px(c, '#f5b700', 3, 3, 25, 1); px(c, '#c48a00', 3, 4, 25, 1);
    px(c, '#7f8c8d', 3, 5, 3, 2);
    px(c, '#ecf0f1', 10, 5, 3, 2); px(c, '#3498db', 11, 5);
    px(c, '#2b2b2b', 22, 5, 1, 6);
    px(c, '#d35400', 19, 11, 7, 2); px(c, '#a04000', 19, 12, 7, 1);
    for (var row = 0; row < 4; row++) {
      px(c, '#c0392b', 15, 14 + row, 13, 1);
      for (var k = (row % 2 ? 16 : 18); k < 28; k += 4) px(c, '#e6b0a0', k, 14 + row);
    }
    px(c, '#e67e22', 5, 16, 1, 1); px(c, '#ffffff', 4, 17, 3, 1);
    px(c, '#e67e22', 3, 18, 5, 1);
  }
};

/* ===== Hintergrund-Wolken ===== */
(function () {
  var c = document.getElementById('wolken').getContext('2d');
  px(c, '#8fd3ff', 0, 0, 64, 48);
  [[6, 6], [40, 4], [22, 30], [52, 36]].forEach(function (p) {
    px(c, '#bfe6ff', p[0], p[1], 8, 2); px(c, '#bfe6ff', p[0] + 2, p[1] - 1, 4, 1);
  });
})();

/* ===== Vorlesen (Ton-Einstellung vom Hof beachten) ===== */
function tonAn() {
  try { var t = localStorage.getItem('bauernhof.ton'); return !(t === '0' || t === 'aus' || t === 'false' || t === 'off'); }
  catch (e) { return true; }
}
function sag(text, fertig) {
  var erledigt = false, weiter = function () { if (!erledigt) { erledigt = true; fertig && fertig(); } };
  if (!tonAn() || !window.speechSynthesis) { setTimeout(weiter, 250); return; }
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text); u.lang = 'de-DE'; u.rate = 0.95;
    u.onend = weiter; speechSynthesis.speak(u);
  } catch (e) {}
  setTimeout(weiter, 1400);
}

/* ===== Kacheln ===== */
var main = document.getElementById('welten'), unterwegs = false;
WELTEN.filter(function (w) { return w.aktiv; }).forEach(function (w) {
  var b = document.createElement('button'); b.className = 'kachel';
  var cv = document.createElement('canvas'); cv.width = 32; cv.height = 24;
  BILDER[w.bild](cv.getContext('2d'));
  var s = document.createElement('span'); s.textContent = w.wort;
  b.appendChild(cv); b.appendChild(s);
  b.addEventListener('click', function () {
    if (unterwegs) return; unterwegs = true; b.classList.add('gewaehlt');
    try { sessionStorage.setItem('start.welt', w.id); } catch (e) {}
    sag(w.sprich, function () { location.href = w.url; });
  });
  main.appendChild(b);
});
/* Zurück per Wischgeste/Cache: Auswahl zurücksetzen */
window.addEventListener('pageshow', function () {
  unterwegs = false;
  Array.prototype.forEach.call(document.querySelectorAll('.gewaehlt'), function (k) { k.classList.remove('gewaehlt'); });
});
</script>
</body>
</html>
