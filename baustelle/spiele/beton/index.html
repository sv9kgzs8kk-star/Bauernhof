<script>
/* Zeigt Fehler direkt auf dem Bildschirm an (es gibt auf dem iPad keine Konsole) */
window.addEventListener('error', function (e) {
  var d = document.getElementById('fehler');
  if (!d) { d = document.createElement('pre'); d.id = 'fehler'; (document.body || document.documentElement).appendChild(d);
    d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;margin:0;padding:10px;background:#b00020;color:#fff;font:15px/1.3 monospace;z-index:999;white-space:pre-wrap'; }
  var t = e.target, msg;
  if (t && t !== window && (t.src || t.href)) msg = 'Datei nicht gefunden: ' + (t.src || t.href);
  else msg = 'Fehler: ' + e.message + (e.filename ? '  (' + e.filename.split('/').slice(-2).join('/') + ', Zeile ' + e.lineno + ')' : '');
  d.textContent += msg + '\n';
}, true);
</script>

<body>
<canvas id="game"></canvas>
<div id="bhud" class="hud gamehud hidden">
  <div class="pill" data-say="concrete" style="pointer-events:auto"><canvas class="veh" id="bveh" width="34" height="34"></canvas><div class="bar"><div class="fill" id="bfill" style="background:repeating-linear-gradient(90deg,#a2a8ae 0 10px,#7d838a 10px 12px)"></div></div></div>
  <button class="pill btn" id="pausebtn" aria-label="Pause"><i class="ico" data-ico="pause"></i></button>
</div>
<div id="gpause" class="overlay hidden">
  <div class="row">
    <button class="home" data-home aria-label="Zur Baustelle"><i class="ico" data-ico="home"></i></button>
    <button class="big" id="gresume" aria-label="Weiter"><svg width="70" height="70" viewBox="0 0 10 10"><path d="M2 1 L9 5 L2 9 Z" fill="#5a3d00"/></svg></button>
  </div>
  <button class="mute" aria-label="Ton"><i class="ico" data-ico="sound"></i></button>
</div>
<div id="gwin" class="overlay hidden">
  <div class="stars"></div>
  <div class="row">
    <div class="pill gain" data-say="star" style="cursor:pointer">+<span id="wingain">3</span> <i class="ico" data-ico="star"></i></div>
    <div class="pill gain" id="winword" style="cursor:pointer"><span class="word"></span></div>
  </div>
  <button class="home" data-home aria-label="Zur Baustelle"><i class="ico" data-ico="home"></i></button>
</div>
<script>window.NO_PAD = true;   // hier wird gezogen und getippt</script>
<script src="../../../gemeinsam/sterne.js?v=20261118a"></script>

<script>
window.HOF_URL = '../../index.html';                 // „Hof“ ist hier der Bauhof
const save = Hof.save;
const house = () => { if (!save.house || typeof save.house !== 'object') save.house = { step: 0 }; return save.house; };
let winTimer = null;
// Bauschritt fertig: Fortschritt speichern, Sterne, Jubel, zurück zum Bauhof
function finishStep(step, key, back) {
  Hof.load(); house().step = Math.max(house().step, step); save.stars += BAU_STARS_STEP; Hof.persist();
  setTimeout(() => {
    document.querySelectorAll('.gamehud').forEach(el => el.classList.add('hidden'));
    $('wingain').textContent = BAU_STARS_STEP;
    const row = $('gwin').querySelector('.stars'); row.innerHTML = '<i class="ico" data-ico="star"></i>'.repeat(BAU_STARS_STEP); applyIcons(row);
    $('winword').dataset.say = key; $('winword').querySelector('.word').textContent = WORDS[key][0];
    show('gwin'); sfx.win(); confetti();
    setTimeout(() => sayWord(key), 1400);
    winTimer = setTimeout(() => goHof(back), 4200);
  }, 400);
}
</script>
<script>
/* =====================================================================
   MINISPIEL: BETON MALEN (Baustelle, Wohnhaus Schritt 2)
   Finger über die Grube ziehen: der Arm der Betonpumpe folgt, und dort, wo er ist, läuft Beton hinein.
   Alles voll = Bodenplatte fertig (house.step = 2).
   ===================================================================== */
document.querySelectorAll('[data-home]').forEach(b => b.addEventListener('click', () => goHof('beton')));
{ const g = $('bveh').getContext('2d'); g.drawImage(PUMP.frames[24], 0, 0); }

const Pour = (() => {
  let pit, cells, nx, ny, state, tip, target, holding = false, truck, filled = 0;
  const RADIUS = 18, RATE = 2.4, SPREAD = 0.9;   // ab 90 % läuft der Rest von selbst nach (keine fummeligen Ecken)
  function makePit() {                               // gleiche Grube wie beim Baggern
    const w = Math.min(7, gc - 4), h = Math.min(4, gr - 5);
    return { c0: Math.floor((gc - w) / 2), r0: Math.max(1, Math.floor((gr - 2 - h) / 2)), w, h };
  }
  function enter() {
    Hof.load();
    if (house().step !== 1) { goHof('beton'); return; }
    layout(true);
    pit = makePit(); nx = pit.w * 2; ny = pit.h * 2;
    cells = new Array(nx * ny).fill(0); filled = 0;
    const B = (col,x,y,w,h)=>{bctx.fillStyle=col;bctx.fillRect(x,y,w,h);};
    for (let r = 0; r < gr; r++) for (let c = 0; c < gc; c++) {
      const isPit = r >= pit.r0 && r < pit.r0 + pit.h && c >= pit.c0 && c < pit.c0 + pit.w;
      const set = r === gr-1 ? tiles.road : isPit ? bauTiles.dug : bauTiles.gravel;
      for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) bctx.drawImage(pick(set), c*G+i*T, r*G+j*T);
    }
    // Schalung aus Holzbrettern rund um die Grube
    const x0 = pit.c0*G, y0 = pit.r0*G, w = pit.w*G, h = pit.h*G;
    B('#5a3b1c', x0-4, y0-4, w+8, 4); B('#5a3b1c', x0-4, y0+h, w+8, 4); B('#5a3b1c', x0-4, y0-4, 4, h+8); B('#5a3b1c', x0+w, y0-4, 4, h+8);
    B('#c9a067', x0-3, y0-3, w+6, 2); B('#c9a067', x0-3, y0+h+1, w+6, 2); B('#c9a067', x0-3, y0-3, 2, h+6); B('#c9a067', x0+w+1, y0-3, 2, h+6);
    for (let x = x0; x < x0 + w; x += 18) { B('#3e2a18', x, y0-4, 1, 4); B('#3e2a18', x, y0+h, 1, 4); }
    truck = { x: 2*G, y: (gr-1)*G + G/2 };                       // Pumpe steht unten links auf der Straße
    tip = { x: truck.x + 8, y: truck.y - 20 }; target = null;
    state = 'play'; show('bhud'); hud();
    setTimeout(() => sayWord('concrete'), 400);
  }
  $('pausebtn').addEventListener('click', () => { if (state !== 'play') return; state = 'pause'; holding = false; show('gpause'); });
  $('gresume').addEventListener('click', () => { hide('gpause'); state = 'play'; });
  function hud() { $('bfill').style.width = (100 * filled / cells.length) + '%'; }
  function cellCenter(i) { const cx = i % nx, cy = (i / nx) | 0; return [pit.c0*G + cx*T + T/2, pit.r0*G + cy*T + T/2]; }
  function onPointer(type, x, y) {
    if (state !== 'play') return true;
    if (type === 'down' || type === 'move') { holding = true; target = { x, y }; if (type === 'down') sfx.pour(); }
    if (type === 'up') holding = false;
    return true;
  }
  function update(dt) {
    if (state !== 'play') { setEngine(false, false); return; }
    if (target) { tip.x = approach(tip.x, target.x, 160*dt); tip.y = approach(tip.y, target.y, 160*dt); }
    setEngine(true, holding, 30);
    if (filled >= cells.length * SPREAD) {           // Beton verläuft in die letzten Lücken
      for (let i = 0; i < cells.length; i++) if (cells[i] < 1) { cells[i] = Math.min(1, cells[i] + dt * 1.2); if (cells[i] >= 1) { filled++; hud(); } }
    }
    if (filled >= cells.length && state === 'play') { state = 'won'; holding = false; sfx.load(); finishStep(2, 'concrete', 'beton'); return; }
    if (!holding) return;
    let any = false;
    for (let i = 0; i < cells.length; i++) {
      if (cells[i] >= 1) continue;
      const [cx, cy] = cellCenter(i);
      if (Math.hypot(cx - tip.x, cy - tip.y) < RADIUS) { cells[i] = Math.min(1, cells[i] + RATE*dt); any = true; if (cells[i] >= 1) { filled++; hud(); } }
    }
    if (Math.random() < .7) spawn(tip.x + rnd(-2, 2), tip.y + 2, rnd(-15, 15), rnd(-10, 15), .5, pick(['#8e959c', '#a8aeb4', '#c4c9ce']), 30);
    if (any && Math.random() < .04) sfx.pour();
  }
  function draw(time) {
    ctx.drawImage(bg, 0, 0);
    for (let i = 0; i < cells.length; i++) {                    // Beton: je voller, desto heller
      const f = cells[i]; if (f <= 0) continue;
      const [cx, cy] = cellCenter(i);
      ctx.globalAlpha = Math.min(1, 0.3 + f * 0.7);
      R(f >= 1 ? '#a2a8ae' : '#8e959c', cx - T/2, cy - T/2, T, T);
      if (f >= 1 && ((i * 7) % 5 === 0)) R('#c4c9ce', cx - 3, cy - 2, 4, 1);
      ctx.globalAlpha = 1;
    }
    // Betonpumpe mit ausgeklapptem Arm (Drehturm → Knick → Schlauchende am Finger)
    drawTipperLikePump(time);
    // Hinweis: zum ersten leeren Feld ziehen
    if (state === 'play' && !holding) {
      const i = cells.findIndex(f => f < 1);
      if (i >= 0) { const [cx, cy] = cellCenter(i), b = Math.abs(Math.sin(time/220))*4; drawArrow(Math.round(cx - 3), Math.round(cy - 16 - b)); }
    }
  }
  function drawTipperLikePump(time) {
    const bx = truck.x, by = truck.y;
    ctx.drawImage(PUMP.shadows[0], Math.round(bx - 17 + 2), Math.round(by - 17 + 2));
    ctx.drawImage(PUMP.frames[0], Math.round(bx - 17), Math.round(by - 17));
    const px = bx - 8, py = by;                                   // Drehturm hinten auf dem Wagen
    const dx = tip.x - px, dy = tip.y - py, d = Math.hypot(dx, dy) || 1;
    const ex = px + dx/2 - dy/d * 26, ey = py + dy/2 + dx/d * 26 - 10;   // Knick seitlich und etwas hoch
    ctx.lineCap = 'round';
    for (const [w, col] of [[7, '#5a1010'], [5, '#d83a3a']]) {
      ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(ex, ey); ctx.lineTo(tip.x, tip.y - 4); ctx.stroke();
    }
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(ex, ey); ctx.lineTo(tip.x, tip.y - 4); ctx.stroke();
    R('#999', px - 4, py - 4, 8, 8); R('#cfcfcf', px - 3, py - 3, 6, 6);
    R('#333', ex - 2, ey - 2, 4, 4);
    R('#222', tip.x - 2, tip.y - 5, 4, 7);                        // Schlauchende
    if (holding) R('#a2a8ae', tip.x - 1, tip.y + 1, 2, 3);
  }
  function resize() { layout(false); }
  function exit() { setEngine(false, false); clearTimeout(winTimer); }
  return { enter, update, draw, resize, exit, onPointer, _dbg: () => ({ state, filled, total: cells && cells.length, pit, tip }) };
})();
startLoop(Pour);
addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
</script>
</body>
